const SCI="<!DOCTYPE html>\n<html lang=\"mr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>6वी गणित – जादुई गणित – 1<\/title>\n<style>\n:root{--b:#1d4ed8;--g:#15803d;--o:#ea580c;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:#fff;color:var(--ink);font-family:\"Noto Sans Devanagari\",\"Mukta\",\"Segoe UI\",system-ui,sans-serif;font-size:17px;line-height:1.5}\n.wrap{max-width:760px;margin:0 auto;padding:12px}\n.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}\nh2{margin:0 0 6px;font-size:20px;color:var(--b)}\n.step{font-size:13px;color:var(--mut);font-weight:700}\n.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0}\n.btn.gr{background:var(--g)}.btn.or{background:var(--o)}.btn.ln{background:#e2e8f0;color:#1e293b}\n.btn:disabled{opacity:.4}\n.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.chip{padding:8px 14px;border-radius:999px;background:#e2e8f0;font-weight:700;border:2px solid transparent;cursor:pointer;user-select:none}\n.chip.on{background:#dbeafe;border-color:var(--b);color:var(--b)}\n.chip.ok{background:#dcfce7;border-color:#16a34a;color:#166534}.chip.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}\nsvg{max-width:100%;height:auto}\n.fig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;margin:6px 0}\n.fig>div{text-align:center;font-size:14px;font-weight:700;min-width:100px}\ntable.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}\ntable.t th,table.t td{border:1.5px solid #94a3b8;padding:6px;text-align:center}\ntable.t th{background:#dbeafe}\ntable.t td.l{text-align:left;font-weight:700;background:#f8fafc}\ntable.t tr.hi td{background:#fef9c3}\ninput.n{width:70px;font:inherit;font-size:17px;text-align:center;padding:5px;border:2px solid #94a3b8;border-radius:8px}\n.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}\n.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}\n.say{float:right;border:0;background:#eff6ff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}\n.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}\n.big{font-size:22px;font-weight:800;text-align:center}\ninput[type=range]{width:100%}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<div id=\"stepBox\"><\/div>\n<\/div>\n<script>\n/* ---------- common ---------- */\nfunction say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;\n const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}\nconst C='#1e293b',BL='#2563eb',RD='#dc2626',GR='#16a34a',OR='#ea580c';\nconst f=v=>(+v).toFixed(1);\nfunction ah(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),L=12,W=6;const bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a);\n return `<polygon points=\"${f(x2)},${f(y2)} ${f(bx-W*Math.sin(a))},${f(by+W*Math.cos(a))} ${f(bx+W*Math.sin(a))},${f(by-W*Math.cos(a))}\" fill=\"${col||C}\"/>`}\nfunction ln(x1,y1,x2,y2,o){o=o||{};const col=o.c||C;let s=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${col}\" stroke-width=\"${o.w||3}\" stroke-linecap=\"round\"${o.d?' stroke-dasharray=\"6 5\"':''}/>`;\n if(o.e)s+=ah(x1,y1,x2,y2,col);if(o.s)s+=ah(x2,y2,x1,y1,col);return s}\nfunction dot(x,y,lab,dx,dy,col){return `<circle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"5\" fill=\"${col||C}\"/>`+(lab?`<text x=\"${f(x+(dx||0))}\" y=\"${f(y+(dy==null?-10:dy))}\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${col||C}\">${lab}<\/text>`:'')}\nconst svg=(w,h,inner,pw)=>`<svg viewBox=\"0 0 ${w} ${h}\" width=\"${pw||w}\">${inner}<\/svg>`;\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}\nfunction shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\n\n/* ---------- steps : जादुई गणित – 1 ---------- */\nlet S=0;const SN=7;\nconst PT=/*PENTO*/{\"6x10\": [\"FFIIIIILZZ\", \"VFFYLLLLZN\", \"VFYYYYXZZN\", \"VVVTWXXXNN\", \"PPPTWWXUNU\", \"PPTTTWWUUU\"], \"5x12\": [\"FIIIIINNVVVL\", \"FFFXTTTNNNVL\", \"PFXXXTZZWWVL\", \"PPUXUTZWWYLL\", \"PPUUUZZWYYYY\"], \"4x15\": [\"FYYYYXIIIIITVVV\", \"FFFYXXXWWTTTZZV\", \"LFNNNXPPWWUTUZV\", \"LLLLNNPPPWUUUZZ\"], \"3x20\": [\"UUXIIIIINNNFTWYYYYZV\", \"UXXXPPLNNFFFTWWYZZZV\", \"UUXPPPLLLLFTTTWWZVVV\"]};\nconst SH={F:[[0,1],[0,2],[1,0],[1,1],[2,1]],I:[[0,0],[1,0],[2,0],[3,0],[4,0]],L:[[0,0],[1,0],[2,0],[3,0],[3,1]],N:[[0,1],[1,1],[2,0],[2,1],[3,0]],P:[[0,0],[0,1],[1,0],[1,1],[2,0]],T:[[0,0],[0,1],[0,2],[1,1],[2,1]],U:[[0,0],[0,2],[1,0],[1,1],[1,2]],V:[[0,0],[1,0],[2,0],[2,1],[2,2]],W:[[0,0],[1,0],[1,1],[2,1],[2,2]],X:[[0,1],[1,0],[1,1],[1,2],[2,1]],Y:[[0,1],[1,0],[1,1],[2,1],[3,1]],Z:[[0,0],[0,1],[1,1],[2,1],[2,2]]};\nconst PC={F:'#ef4444',I:'#f97316',L:'#f59e0b',N:'#84cc16',P:'#22c55e',T:'#14b8a6',U:'#06b6d4',V:'#3b82f6',W:'#6366f1',X:'#a855f7',Y:'#ec4899',Z:'#78716c'};\nconst CARDS=[1,2,4,8,16].map(b=>[...Array(31)].map((_,i)=>i+1).filter(n=>n&b));\nconst st={sel:[0,0,0,0,0],rev:false,sq:null,sm:'',ak:0,n:5,rt:'6x10',rk:12,fg:0,fv:{},pr:null,prm:'',hint:false};\nfunction sx(t){return `<button class=\"say\" onclick=\"say(this.dataset.t)\" data-t=\"${t.replace(/\"/g,'&quot;')}\">🗣 ऐका<\/button>`}\nfunction nav(){return `<div class=\"nav\"><button class=\"btn ln\" ${S==0?'disabled':''} onclick=\"go(-1)\">◀ मागे<\/button><span class=\"step\">${S+1} / ${SN}<\/span><button class=\"btn\" ${S==SN-1?'disabled':''} onclick=\"go(1)\">पुढे ▶<\/button><\/div>`}\nfunction go(d){S=Math.max(0,Math.min(SN-1,S+d));drawStep();try{window.parent.document.getElementById('sf').scrollIntoView()}catch(x){}}\nfunction drawStep(){document.getElementById('stepBox').innerHTML=[s0,s1,s2,s3,s4,s5,s6][S]()+nav()}\nconst BOX=a=>`<div style=\"border:2px solid #cbd5e1;border-radius:12px;padding:8px 14px;font-size:18px;line-height:2;font-weight:600\">${a}<\/div>`;\nconst gcd=(a,b)=>b?gcd(b,a%b):a;\nconst FR=(n,d,c)=>d==1?`<b style=\"${c?'color:'+c:''}\">${n}<\/b>`:`<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 3px;${c?'color:'+c:''}\"><span style=\"border-bottom:2px solid currentColor;padding:0 3px\">${n}<\/span><span>${d}<\/span><\/span>`;\nfunction card(i,hl,on){return `<div onclick=\"${on?`st.sel[${i}]^=1;st.rev=false;drawStep()`:''}\" style=\"cursor:${on?'pointer':'default'};display:inline-grid;grid-template-columns:repeat(4,26px);gap:2px;padding:6px;margin:4px;border-radius:10px;border:3px solid ${st.sel[i]&&on?'#16a34a':'#e879f9'};background:${st.sel[i]&&on?'#dcfce7':'#fefce8'}\">${CARDS[i].map((n,j)=>`<span style=\"text-align:center;font-weight:700;font-size:14px;${j==0&&hl?'background:#fde68a;border-radius:4px;color:#b45309':''}${hl===n?';background:#bfdbfe;border-radius:4px':''}\">${n}<\/span>`).join('')}<\/div>`}\n\n/* पायरी 1 : स्मार्ट कार्ड्स – खेळ */\nfunction s0(){const t='मित्राला एक ते एकतीस पैकी एक संख्या मनात धरायला सांगा. ती संख्या कोणकोणत्या कार्डांवर आहे ते विचारा. त्या कार्डांवरील पहिल्या संख्यांची बेरीज म्हणजे मित्राच्या मनातील संख्या.';\n const sum=st.sel.reduce((a,v,i)=>a+(v?2**i:0),0);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 1<\/div><h2>स्मार्ट कार्ड्स : मनातील संख्या ओळखा<\/h2>\n <div class=\"msg in\">1 ते 31 पैकी एक संख्या मनात धरा (उदा. तुमचा जन्मदिनांक). ती ज्या कार्डांवर आहे त्या कार्डांवर टिचकी मारा.<\/div>\n <div style=\"text-align:center\">${CARDS.map((_,i)=>card(i,st.rev,1)).join('')}<\/div>\n <button class=\"btn gr\" onclick=\"st.rev=true;drawStep()\">🔮 माझी संख्या ओळखा<\/button><button class=\"btn ln\" onclick=\"st.sel=[0,0,0,0,0];st.rev=false;drawStep()\">↺ पुन्हा<\/button>\n ${st.rev?(sum?`<div class=\"big\" style=\"font-size:30px;color:#7c3aed\">🎉 तुमची संख्या : ${sum}<\/div>\n <div class=\"key\">क्लृप्ती : निवडलेल्या कार्डांवरील <b>पहिल्या (पिवळ्या) संख्यांची बेरीज<\/b> = ${st.sel.map((v,i)=>v?2**i:0).filter(Boolean).join(' + ')} = ${sum}<\/div>`:'<div class=\"msg no\">एकही कार्ड निवडले नाही!<\/div>'):''}<\/div>`}\n\n/* पायरी 2 : गुपित */\nfunction newSq(){st.sq=rnd(1,31);st.sm=''}\nfunction s1(){if(!st.sq)newSq();const n=st.sq,t='प्रत्येक कार्डावरील पहिली संख्या एक, दोन, चार, आठ, सोळा अशी दुप्पट होत जाते. एक ते एकतीस पैकी प्रत्येक संख्या या संख्यांच्या बेरजेने एकाच प्रकारे लिहिता येते.';\n const parts=[1,2,4,8,16].filter(b=>n&b);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 2<\/div><h2>स्मार्ट कार्ड्सचे गुपित<\/h2>\n <div class=\"key\">पाच कार्डांवरील पहिल्या संख्या : <b>1, 2, 4, 8, 16<\/b> (प्रत्येक मागच्याची दुप्पट). 1 + 2 + 4 + 8 + 16 = 31.<\/div>\n <div class=\"big\" style=\"font-size:26px\">${n} = ${parts.join(' + ')}<\/div>\n <div style=\"text-align:center\">${CARDS.map((c,i)=>`<div style=\"display:inline-block;opacity:${c.includes(n)?1:.35}\">${card(i,n,0)}<\/div>`).join('')}<\/div>\n <div class=\"msg ok\">${n} ही संख्या फक्त ${parts.map(p=>`‘${p}’ ने सुरू होणाऱ्या`).join(', ')} कार्डांवर आहे.<\/div>\n <button class=\"btn ln\" onclick=\"newSq();drawStep()\">🔄 दुसरी संख्या<\/button>\n <div class=\"key\">प्रत्येक संख्या 1, 2, 4, 8, 16 पैकी काहींच्या बेरजेने <b>एकाच प्रकारे<\/b> मांडता येते. ज्या कार्डाची पहिली संख्या बेरजेत येते, त्याच कार्डावर ती संख्या लिहिलेली असते.<\/div><\/div>`}\n\n/* पायरी 3 : चांदणी */\nfunction star(n,o){o=o||{};const cx=150,cy=150,R=125,r=R*Math.cos(Math.PI*2/n)/Math.cos(Math.PI/n);const out=[],inn=[];\n for(let i=0;i<n;i++){const a=-Math.PI/2+2*Math.PI*i/n;out.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);const b=a+Math.PI/n;inn.push([cx+r*Math.cos(b),cy+r*Math.sin(b)])}\n let g=`<polygon points=\"${out.map((p,i)=>p.map(f).join(',')+' '+inn[i].map(f).join(',')).join(' ')}\" fill=\"#fef3c7\" stroke=\"#b45309\" stroke-width=\"2\"/>`;\n g+=`<polygon points=\"${inn.map(p=>p.map(f).join(',')).join(' ')}\" fill=\"#c7d2fe\" stroke=\"#4338ca\" stroke-width=\"2\"/>`;\n return {g,out,inn,cx,cy}}\nfunction s2(){const k=st.ak,t='पाच टोकांच्या चांदणीत मध्यभागी सुसम पंचकोन तयार होतो. चांदणीतील एक कोन बहात्तर अंश दिला आहे. सरळ रेषेवरील दोन कोनांची बेरीज एकशे ऐंशी अंश असते. त्रिकोणाच्या कोनांची बेरीज एकशे ऐंशी अंश असते.';\n const {g,out,inn}=star(5);let lab='';\n const T=(p,txt,c)=>`<text x=\"${f(p[0])}\" y=\"${f(p[1])}\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"${c}\">${txt}<\/text>`;\n const mid=(a,b,s)=>[a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s];\n const G=i=>{const a=out[i],b=inn[(i+4)%5],c=inn[i];return[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3]};\n lab+=T(mid(inn[0],G(0),0.5),'72°',RD);\n if(k>=1)for(let i=0;i<5;i++){lab+=T(mid(inn[i],G(i),0.5),'72°',RD);lab+=T(mid(inn[(i+4)%5],G(i),0.5),'72°',RD)}\n if(k>=2)inn.forEach(p=>lab+=T(mid(p,[150,150],0.32),'108°','#4338ca'));\n if(k>=3)out.forEach(p=>lab+=T(mid(p,[150,150],0.18),'36°','#15803d'));\n const L=['दिलेला कोन : चांदणीच्या एका टोकाच्या त्रिकोणाचा तळकोन = 72°','सुसम पंचकोनामुळे सर्व टोक-त्रिकोण सारखे → प्रत्येक तळकोन 72°','निर्देश 1 : सरळ रेषेवरील कोन 180 − 72 = <b>108°<\/b> → पंचकोनाचा प्रत्येक कोन 108°','निर्देश 3 : टोकाचा कोन = 180 − (72 + 72) = <b>36°<\/b>','पंचकोनाच्या कोनांची बेरीज = 5 × 108 = <b>540°<\/b>'];\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 3<\/div><h2>चांदणी : सर्व कोन शोधा<\/h2>\n <div class=\"fig\">${svg(300,300,g+lab,290)}<\/div>\n ${BOX(L.slice(0,k+1).map((x,i)=>`<div style=\"${i==k?'color:#b45309':''}\">${x}<\/div>`).join(''))}\n <button class=\"btn\" ${k>=4?'disabled':''} onclick=\"st.ak++;drawStep()\">▶ पुढची पायरी<\/button><button class=\"btn ln\" onclick=\"st.ak=0;drawStep()\">↺<\/button>\n <div class=\"key\">निर्देश 1 : सरळ रेषा करणाऱ्या दोन कोनांची बेरीज 180°.<br>निर्देश 2 : सुसम पंचकोनाच्या सर्व बाजू व सर्व कोन समान.<br>निर्देश 3 : त्रिकोणाच्या कोनांची बेरीज 180°.<\/div><\/div>`}\n\n/* पायरी 4 : सुसम बहुभुज – सूत्र */\nfunction s3(){const n=st.n,each=(n-2)*180/n,t='सुसम बहुभुजाकृतीच्या एका शिरोबिंदूतून कर्ण काढले की त्याचे n वजा दोन त्रिकोण होतात. म्हणून कोनांची बेरीज n वजा दोन गुणिले एकशे ऐंशी.';\n const {g,inn}=star(n);let tri='';for(let i=2;i<n-1;i++)tri+=ln(...inn[0],...inn[i],{c:RD,w:2,d:1});\n const r2=v=>+v.toFixed(2);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 4<\/div><h2>चांदणीची टोके वाढवा : बहुभुजाचे कोन<\/h2>\n <div>टोके (n) : <b>${n}<\/b><\/div><input type=\"range\" min=\"5\" max=\"10\" value=\"${n}\" oninput=\"st.n=+this.value;drawStep()\">\n <div class=\"fig\">${svg(300,300,g+tri,280)}<\/div>\n ${BOX(`मध्यभागी सुसम ${n}-भुज आकृती; एका शिरोबिंदूतील कर्णांनी <b>${n-2}<\/b> त्रिकोण<br>कोनांची बेरीज = (${n} − 2) × 180° = <b>${(n-2)*180}°<\/b><br>प्रत्येक कोन = ${(n-2)*180} ÷ ${n} = <span style=\"color:#15803d\">${r2(each)}°<\/span><br>टोकाचा कोन = 180 − 2 × ${r2(180-each)} = ${r2(180-2*(180-each))}°`)}\n <table class=\"t\" style=\"font-size:13px\"><tr><th>n<\/th>${[3,4,5,6,8,10].map(x=>`<th>${x}<\/th>`).join('')}<\/tr><tr><td class=\"l\">बेरीज<\/td>${[3,4,5,6,8,10].map(x=>`<td>${(x-2)*180}°<\/td>`).join('')}<\/tr><tr><td class=\"l\">प्रत्येक कोन<\/td>${[3,4,5,6,8,10].map(x=>`<td>${r2((x-2)*180/x)}°<\/td>`).join('')}<\/tr><\/table>\n <div class=\"key\"><b>सूत्र :<\/b> n बाजूंच्या बहुभुजाच्या कोनांची बेरीज = (n − 2) × 180°.<br>सहा टोकांची चांदणी : आतील षट्कोनाचा प्रत्येक कोन 120°, टोकाचा कोन 60°.<\/div><\/div>`}\n\n/* पायरी 5 : पेन्टोमिनोझ */\nfunction grid(rows,k,u){const H=rows.length,W=rows[0].length,order=[...new Set(rows.join(''))];const showK=new Set(order.slice(0,k));let g='';\n for(let r=0;r<H;r++)for(let c=0;c<W;c++){const ch=rows[r][c],on=showK.has(ch);g+=`<rect x=\"${2+c*u}\" y=\"${2+r*u}\" width=\"${u}\" height=\"${u}\" fill=\"${on?PC[ch]:'#fff'}\" stroke=\"${on?'#fff':'#cbd5e1'}\" stroke-width=\"1\"/>`+(on&&rows[r].indexOf(ch)==c&&(r==0||rows[r-1][c]!=ch)&&rows.findIndex(x=>x.includes(ch))==r?`<text x=\"${2+c*u+u/2}\" y=\"${2+r*u+u*0.7}\" font-size=\"${u*0.5}\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\">${ch}<\/text>`:'')}\n return svg(W*u+4,H*u+4,g,Math.min(320,W*u+4))}\nfunction s4(){const t='पाच समान चौरस बाजूला बाजू जोडून तयार होणारा आकार म्हणजे पेन्टोमिनो. असे बारा वेगवेगळे आकार होतात. प्रत्येकाचे क्षेत्रफळ पाच चौरस, म्हणून बारा आकारांचे मिळून साठ चौरस.';\n const shp=Object.keys(SH).map(k=>{let g='';SH[k].forEach(([r,c])=>g+=`<rect x=\"${2+c*12}\" y=\"${2+r*12}\" width=\"12\" height=\"12\" fill=\"${PC[k]}\" stroke=\"#fff\"/>`);return `<div style=\"display:inline-block;text-align:center;margin:4px;font-weight:800\">${svg(64,64,g,52)}<br>${k}<\/div>`}).join('');\n const rows=PT[st.rt],[h,w]=st.rt.split('x').map(Number);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 5<\/div><h2>पेन्टोमिनोझ : 12 घडणी<\/h2>\n <div style=\"text-align:center\">${shp}<\/div>\n <div class=\"key\">प्रत्येक घडणीचे क्षेत्रफळ 5 चौरस → 12 × 5 = <b>60 चौरस<\/b>. 60 = 6 × 10 = 5 × 12 = 4 × 15 = 3 × 20 → हे चारही आयत बनवता येतात!<\/div>\n <div class=\"chips\">${Object.keys(PT).map(x=>`<span class=\"chip ${x==st.rt?'on':''}\" onclick=\"st.rt='${x}';st.rk=0;drawStep()\">${x.replace('x',' × ')}<\/span>`).join('')}<\/div>\n <div class=\"fig\">${grid(rows,st.rk,Math.min(28,300/w))}<\/div>\n <button class=\"btn\" ${st.rk>=12?'disabled':''} onclick=\"st.rk++;drawStep()\">▶ पुढची घडण बसवा<\/button><button class=\"btn or\" onclick=\"st.rk=12;drawStep()\">✔ पूर्ण आयत<\/button><button class=\"btn ln\" onclick=\"st.rk=0;drawStep()\">↺ रिकामा<\/button>\n <div class=\"msg in\">${h} × ${w} = ${h*w} चौरस – कोठेही रिकामी जागा नाही, कोणतीही घडण दुसरीवर नाही (No Overlap, No Gaps).<\/div>\n <div class=\"key\">उपक्रम : चौकट वहीचा कागद घेऊन 12 घडणी कापा आणि वरील आयत स्वतः पूर्ण करा. एकापेक्षा जास्त उत्तरे शक्य आहेत!<\/div><\/div>`}\n\n/* पायरी 6 : बेरीज-वजाबाकी चौकट */\nconst FG=[[[5,3],[4,3],[2,3],[1,3]],[[1,2],[1,3],[1,3],[1,4]]];\nconst add=(a,b)=>{const n=a[0]*b[1]+b[0]*a[1],d=a[1]*b[1],g=gcd(n,d);return[n/g,d/g]},sub=(a,b)=>add(a,[-b[0],b[1]]);\nfunction newFG(){const D=[2,3,4,5,6][rnd(0,4)],E=[2,3,4,6][rnd(0,3)];const a=[rnd(D,3*D),D],b=[rnd(E,2*E),E],c=[rnd(1,D-1),D],d=[rnd(1,E-1),E];FG[2]=[a,b,c,d];st.fg=2;st.fv={}}\nfunction s5(){const [a,b,c,d]=FG[st.fg],t='चौकटीत आडव्या ओळीत बेरीज आणि उभ्या स्तंभात वजाबाकी करा. शेवटच्या कोपऱ्यातील उत्तर दोन्ही प्रकारे सारखेच येते.';\n const r1=add(a,b),r2=add(c,d),c1=sub(a,c),c2=sub(b,d),k1=sub(r1,r2),k2=add(c1,c2);\n const cell=(id,v)=>{const s=st.fv[id];const ok=s&&s.n*v[1]==s.d*v[0];return `<td style=\"background:${s?(ok?'#dcfce7':'#fee2e2'):'#fff'}\">${s&&s.show?FR(v[0],v[1],'#15803d'):`<input id=\"i_${id}\" style=\"width:38px;font:inherit;text-align:center\" placeholder=\"?\"><br><input id=\"j_${id}\" style=\"width:38px;font:inherit;text-align:center;border-top:2px solid #000\" placeholder=\"?\">`}<\/td>`};\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 6<\/div><h2>बेरीज-वजाबाकी चौकट<\/h2>\n <div class=\"chips\"><span class=\"chip ${st.fg==0?'on':''}\" onclick=\"st.fg=0;st.fv={};drawStep()\">चौकट 1<\/span><span class=\"chip ${st.fg==1?'on':''}\" onclick=\"st.fg=1;st.fv={};drawStep()\">चौकट 2<\/span><span class=\"chip ${st.fg==2?'on':''}\" onclick=\"newFG();drawStep()\">🎲 नवी चौकट<\/span><\/div>\n <div style=\"display:flex;justify-content:center\"><table class=\"t\" style=\"width:auto;font-size:20px\"><tr><th><\/th><th colspan=\"2\">बेरीज →<\/th><th><\/th><\/tr>\n <tr><th rowspan=\"3\" style=\"writing-mode:vertical-rl\">वजाबाकी ↓<\/th><td>${FR(...a)}<\/td><td>${FR(...b)}<\/td>${cell('r1',r1)}<\/tr>\n <tr><td>${FR(...c)}<\/td><td>${FR(...d)}<\/td>${cell('r2',r2)}<\/tr>\n <tr>${cell('c1',c1)}${cell('c2',c2)}${cell('k',k1)}<\/tr><\/table><\/div>\n <button class=\"btn gr\" onclick=\"chkFG()\">तपासा<\/button><button class=\"btn or\" onclick=\"['r1','r2','c1','c2','k'].forEach(x=>st.fv[x]={n:1,d:1,show:1});drawStep()\">👁 उत्तरे<\/button>\n ${Object.keys(st.fv).length==5&&Object.values(st.fv).every(v=>v.show)?BOX(`ओळींची बेरीज : ${FR(...r1)} − ${FR(...r2)} = ${FR(...k1)}<br>स्तंभांची वजाबाकी : ${FR(...c1)} + ${FR(...c2)} = ${FR(...k2)}<br><span style=\"color:#15803d\">दोन्ही उत्तरे समान – हीच चौकटीची जादू!<\/span>`):''}\n <div class=\"key\">उपक्रम : इतर अपूर्णांकांसाठी किंवा पूर्ण संख्यांसाठी अशा चौकटी तयार करा आणि पडताळा घ्या.<\/div><\/div>`}\nfunction chkFG(){const [a,b,c,d]=FG[st.fg],V={r1:add(a,b),r2:add(c,d),c1:sub(a,c),c2:sub(b,d),k:sub(add(a,b),add(c,d))};\n for(const id in V){const n=document.getElementById('i_'+id),dd=document.getElementById('j_'+id);if(!n)continue;const nv=+n.value,dv=+dd.value||1;if(n.value==='')continue;\n  st.fv[id]={n:nv,d:dv,show:nv*V[id][1]==dv*V[id][0]}}drawStep()}\n\n/* पायरी 7 : आता तुम्ही सोडवा */\nfunction newPr(){const k=rnd(0,2);\n if(k==0){const n=rnd(1,31),cs=[1,2,4,8,16].filter(b=>n&b);st.pr={q:`मित्राची संख्या ${cs.map(x=>`‘${x}’`).join(', ')} ने सुरू होणाऱ्या कार्डांवर आहे. ती संख्या कोणती?`,a:n,h:'पहिल्या संख्यांची बेरीज करा.'}}\n else if(k==1){const n=[3,4,5,6,8,9,10,12][rnd(0,7)];st.pr={q:`सुसम ${n}-भुज आकृतीच्या सर्व कोनांच्या मापांची बेरीज किती अंश?`,a:(n-2)*180,h:`(${n} − 2) × 180`}}\n else{const n=[3,4,5,6,9,10][rnd(0,5)];st.pr={q:`सुसम ${n}-भुज आकृतीचा प्रत्येक कोन किती अंशांचा?`,a:(n-2)*180/n,h:`(${n} − 2) × 180 ÷ ${n}`}}\n st.prm='';st.hint=false}\nfunction s6(){if(!st.pr)newPr();const p=st.pr,t='उत्तर लिहा.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 7<\/div><h2>आता तुम्ही सोडवा<\/h2>\n <div class=\"key\" style=\"font-size:18px\">${p.q}<\/div><div class=\"big\"><input class=\"n\" id=\"pra\" style=\"width:100px;font-size:22px\" inputmode=\"numeric\"><\/div>\n <button class=\"btn gr\" onclick=\"chkPr()\">तपासा<\/button><button class=\"btn or\" onclick=\"st.hint=!st.hint;drawStep()\">💡 मदत<\/button>\n ${st.hint?`<div class=\"key\">${p.h}<\/div>`:''}<div>${st.prm}<\/div><button class=\"btn ln\" onclick=\"newPr();drawStep()\">🔄 दुसरा प्रश्न<\/button><\/div>`}\nfunction chkPr(){const raw=document.getElementById('pra').value.trim(),p=st.pr;st.prm=raw!==''&&+raw===p.a?`<div class=\"msg ok\">🎉 बरोबर! ${p.a}<\/div>`:'<div class=\"msg no\">✘ अजून नाही. 💡 मदत पाहा.<\/div>';drawStep();document.getElementById('pra').value=raw}\n\ndrawStep();\n<\/script>\n<\/body>\n<\/html>\n";

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,R){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sx=t=>`<button class="say" onclick="say(this.dataset.t)" data-t="${esc(t).replace(/"/g,'&quot;')}">🗣 ऐका</button>`;
const LET=['अ','ब','क','ड','इ'];

function mqa(id,b,ok,why){const box=$(id);if(box.dataset.done)return;b.classList.add(ok?'ok':'no');const mm=box.querySelector('.mm');
 if(ok){box.dataset.done=1;mm.innerHTML=`<div class="msg ok">🎉 बरोबर! ${why}</div>`;LS.pts++;updProg()}else mm.innerHTML='<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>'}

function ogc(id,b){const box=$(id);let k=+box.dataset.k;if(b.classList.contains('ok'))return;const mm=box.querySelector('.mm');

 else mm.innerHTML='<div class="msg no">✘ ही घटना आता नाही. विचार करून पुन्हा निवडा.</div>'}

function sgc(id,i,j,right){const r=$(id+'_'+i);if(r.dataset.d)return;const box=$(id);if(j==right){r.dataset.d=1;r.style.background='#dcfce7';r.querySelectorAll('.chip').forEach((c,k)=>{c.disabled=true;c.classList.toggle('on',k==j)});box.dataset.k=+box.dataset.k+1;LS.pts++;updProg();if(box.dataset.k==box.dataset.n)box.querySelector('.mm').innerHTML='<div class="msg ok">🎉 सर्व बरोबर!</div>'}else{r.style.background='#fee2e2';setTimeout(()=>{if(!r.dataset.d)r.style.background=''},700)}}
function matchSel(title,rows,opts){const id='ms'+(++WID);return `<div class="mini" id="${id}"><b>🧩 ${title}</b><table class="t">${rows.map((r,i)=>`<tr><td style="text-align:left">${r[0]}</td><td><select id="${id}_${i}"><option value="">–</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</table><button class="btn gr" onclick="msc('${id}',${esc(JSON.stringify(rows.map(r=>r[1]))).replace(/"/g,'&quot;')})">तपासा</button><div class="mm"></div></div>`}
function msc(id,ans){let ok=0;ans.forEach((a,i)=>{const s=$(id+'_'+i),g=s.value==a;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(id).querySelector('.mm').innerHTML=ok==ans.length?'<div class="msg ok">🎉 सर्व बरोबर!</div>':`<div class="msg in">${ok}/${ans.length} बरोबर. लाल रंगाची उत्तरे बदला.</div>`;if(ok==ans.length){LS.pts++;updProg()}}

function scen(title,sit,opts){const id='sc'+(++WID);return `<div class="mini" id="${id}"><b>🎭 ${title}</b><div class="key" style="margin:6px 0">${sit}</div>${opts.map((o,i)=>`<button class="opt" onclick="scc('${id}',this,${o[1]},'${esc(o[2]).replace(/'/g,"\\'")}')">${o[0]}</button>`).join('')}<div class="mm">तुम्ही काय कराल? एक पर्याय निवडा.</div></div>`}

function voteSim(title,cands,rule){const id='vt'+(++WID);const R=rng(11+WID);const base=cands.map(()=>3+Math.floor(R()*8));return `<div class="mini" id="${id}" data-base='${JSON.stringify(base)}'><b>🗳 ${title}</b><div class="key" style="margin:6px 0">${rule}</div>${cands.map((c,i)=>`<button class="opt" onclick="vtc('${id}',${i})">${c}</button>`).join('')}<div class="mm">गुप्त मतदान – तुमचे मत नोंदवा.</div></div>`}
function vtc(id,i){const box=$(id);if(box.dataset.done)return;box.dataset.done=1;const base=JSON.parse(box.dataset.base);base[i]++;const names=[...box.querySelectorAll('.opt')].map(b=>b.textContent);const tot=base.reduce((a,b)=>a+b,0);const mx=Math.max(...base);const w=base.indexOf(mx);
 box.querySelector('.mm').innerHTML=`<div class="msg ok">तुमचे मत नोंदले. निकाल (एकूण ${tot} मते):</div>`+base.map((v,j)=>`<div style="margin:4px 0">${names[j]} — ${v} मते<div style="background:#fde68a;height:10px;border-radius:5px;width:${Math.round(v/mx*100)}%"></div></div>`).join('')+`<div class="msg in">🏆 बहुमत : <b>${names[w]}</b> विजयी. (लोकशाहीत बहुमताने निर्णय होतो.)</div>`;LS.pts++;updProg()}

/* ---------- 2. MCQ ---------- */
let MC={qs:[],i:0,sc:0,wrong:[],done:false};
function mcStart(){const R=rng(Date.now()%100000);MC={qs:shuf(MCQ,R).slice(0,10).map(q=>mkq(q,R)),i:0,sc:0,wrong:[],done:false};drawMc()}
function mkq(q,R){const o=shuf([[q[1],1],[q[2],0],[q[3],0],[q[4],0]],R);return{q:q[0],o:o.map(x=>x[0]),a:o.findIndex(x=>x[1]),e:q[5]}}
function vMcq(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div><div class="card" id="mcb"></div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 MCQ चाचणी (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="mn" onchange="regen()"><option>10</option><option selected>15</option><option>20</option><option>25</option></select>${seedBox(301)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genMcq;mcStart();genMcq()}
function drawMc(){const b=$('mcb');if(!b)return;
 if(MC.done){ssRep(MC);b.innerHTML=`<h2>📊 निकाल : ${MC.sc} / ${MC.qs.length}</h2><div class="msg ${MC.sc>=8?'ok':'in'}">${MC.sc>=9?'उत्तम! 🏆':MC.sc>=7?'छान! 👍':'पुन्हा सराव करा 💪'}</div>${MC.wrong.length?'<h3>चुकलेले प्रश्न:</h3>'+MC.wrong.map(w=>`<div class="qcard"><b>${w.q}</b><div class="ans show">✔ ${w.o[w.a]}\n${w.e}</div></div>`).join(''):''}<button class="btn gr" onclick="mcStart()">🔄 नवे 10 प्रश्न</button>`;return}
 const q=MC.qs[MC.i];b.innerHTML=`<h2>❓ सराव (${MC.i+1}/${MC.qs.length}) <small style="float:right">⭐ ${MC.sc}</small></h2><div class="prog"><i style="width:${MC.i/MC.qs.length*100}%"></i></div><p><b>${q.q}</b></p>${q.o.map((o,i)=>`<button class="opt" onclick="mcA(${i},this)">${LET[i]}) ${o}</button>`).join('')}<div id="mcm"></div>`}
function mcA(i,b){const q=MC.qs[MC.i];if(q.d)return;q.d=1;const bs=document.querySelectorAll('#mcb .opt');bs[q.a].classList.add('ok');if(i!=q.a)b.classList.add('no');if(i==q.a)MC.sc++;else MC.wrong.push(q);
 $('mcm').innerHTML=`<div class="msg ${i==q.a?'ok':'no'}">${i==q.a?'🎉 बरोबर!':'✘ चुकले.'} ${q.e}</div><button class="btn" onclick="MC.i++;if(MC.i>=MC.qs.length)MC.done=true;drawMc()">${MC.i==MC.qs.length-1?'निकाल पाहा':'पुढचा प्रश्न ▶'}</button>`}
function genMcq(){const n=+$('mn').value,seed=+$('seed').value||1,R=rng(seed);const qs=shuf(MCQ,R).slice(0,n).map(q=>mkq(q,R));
 let h=dHead('MCQ चाचणी',n,$('sch').value.trim())+`<div class="ds">संच क्र. ${seed} · योग्य पर्याय निवडून उत्तर कंसात लिहा.</div>`+
 qs.map((q,i)=>`<div class="qb"><div>${i+1}. ${q.q} <b>( &nbsp;&nbsp;&nbsp; )</b></div><div class="opts">${q.o.map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div></div>`).join('');
 if($('ky').checked)h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="opts" style="grid-template-columns:repeat(5,1fr);margin-left:0">${qs.map((q,i)=>`<span>${i+1}) ${LET[q.a]}</span>`).join('')}</div></div>`;
 showPrev(h)}

const mk=c=>c&&typeof c=='object'?`<span class="ans2">${c.a}</span>`:(c==null?'':c);
function swBlock(b,bi){let h=`<div class="card"><h2>${b.h}</h2>`;const id=x=>`sw${bi}_${x}`;
 if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qcard" id="${id(i)}"><div>${i+1}. ${it[0]}</div>${it[1].map((o,j)=>`<button class="opt" onclick="swM('${id(i)}',this,${j==it[2]},'${esc(it[1][it[2]]).replace(/'/g,"\\'")}')">${LET[j]}) ${o}</button>`).join('')}<div class="mm"></div></div>`).join('');
 else if(b.t=='qa')h+=b.items.map((it,i)=>`<div class="qcard">${i+1}. ${it[0]}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='match')h+=`<table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${b.L.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x}</td><td><select id="${id('s'+i)}"><option value="">–</option>${b.R.map((r,j)=>`<option>${LET[j]}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${b.R.map((r,j)=>`<li>${LET[j]}) ${r}</li>`).join('')}</ul><button class="btn gr" onclick="swMt(${bi})">तपासा</button><div id="${id('m')}"></div>`;
 else if(b.t=='table')h+=`<table class="t"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</table><button class="btn ln" onclick="document.querySelectorAll('#sw${bi}c .ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`.replace('<table class="t">',`<div id="sw${bi}c"><table class="t">`).replace('</table>','</table></div>');
 else if(b.t=='order')h+=ordGame('क्रमाने लावा',b.items)+`<div class="msg in">योग्य क्रम : ${b.items.map((x,i)=>`${i+1}) ${x}`).join(' → ')}</div>`;
 else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qcard">${qimg(it[0])}${i+1}. ${it[2]||''}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='concept')h+=`<div style="text-align:center"><b>${b.center}</b><br>⬇<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${b.leaves.map(x=>`<span class="ans2" style="padding:6px 10px">${x}</span>`).join('')}</div></div><div id="sw${bi}c"></div><button class="btn ln" onclick="document.querySelectorAll('.ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`;
 else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 return h+'</div>'}
function swM(id,b,ok,a){const box=$(id);if(box.dataset.d)return;b.classList.add(ok?'ok':'no');if(ok)box.dataset.d=1;box.querySelector('.mm').innerHTML=ok?`<div class="msg ok">🎉 बरोबर!</div>`:`<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>`}
function swMt(bi){const b=SWB[bi];let ok=0;b.L.forEach((x,i)=>{const s=$(`sw${bi}_s${i}`),g=s.value===LET[b.A[i]];if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(`sw${bi}_m`).innerHTML=ok==b.L.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${b.L.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function swA(b){let h=SWB.map((x,i)=>swBlock(x,i)).join('');
 h+=`<div class="card" id="pdfp" style="display:none"><h2>🖨 पुस्तकातील स्वाध्याय – PDF</h2><div class="tool">${schoolBox}<label><input type="checkbox" id="ky" checked onchange="regen()"> आदर्श उत्तरे जोडा</label>${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 b.innerHTML=`<style>.ans2{background:#e5e7eb;color:#e5e7eb;border-radius:6px;padding:0 6px;user-select:none}.ans2.rev{background:#dcfce7;color:#166534;font-weight:700}</style>`+h;REGEN=genSwA;genSwA()}
function genSwA(){const ky=$('ky').checked,sc=$('sch').value.trim();const R=rng(11);
 let h=dHead('स्वाध्याय (पाठ्यपुस्तकातील)','—',sc);const A=t=>`<span class="a">${t}</span>`;
 SWB.forEach(b=>{h+=`<div class="qh">${b.h}</div>`;
  if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qb"><div>${i+1}. ${it[0]} <b>( &nbsp;&nbsp; )</b></div><div class="opts">${it[1].map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div>${ky?`<div class="a">उत्तर : ${LET[it[2]]}) ${it[1][it[2]]}</div>`:''}</div>`).join('');
  else if(b.t=='qa')h+=b.items.map((it,i)=>b.lines>1?`<div class="qb">${i+1}. ${it[0]}${ky?`<div class="a"><pre>${it[1]}</pre></div>`:wl(b.lines)}</div>`:`<div class="qb">${i+1}. ${it[0]} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='match')h+=`<table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${b.L.map((x,i)=>`<tr><td>${i+1}) ${x} &nbsp;&nbsp; ( ${ky?A(LET[b.A[i]]):'&nbsp;&nbsp;'} )</td><td>${b.R[i]!=null?LET[i]+') '+b.R[i]:''}</td></tr>`).join('')}</table>`;
  else if(b.t=='table')h+=`<table class="w"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&typeof c=='object'?(ky?A(c.a):'&nbsp;<br>&nbsp;'):(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if(b.t=='order'){const idx=shuf(b.items.map((x,i)=>i),R);h+=idx.map((j,i)=>`<div class="qb">${i+1}. ${b.items[j]}</div>`).join('')+(ky?A('योग्य क्रम : '+b.items.map((x,i)=>idx.indexOf(i)+1).join(' → ')):wl(2))}
  else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qb"><img src="${IM[it[0]]}" style="height:30mm;border-radius:2mm"> ${i+1}. ${it[2]||''} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='concept')h+=`<div style="text-align:center"><b style="border:1.2px solid #000;padding:2px 10px">${b.center}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px">${b.leaves.map(x=>`<span style="border:1.2px solid #000;padding:6px 12px;min-width:30mm">${ky?A(x):'&nbsp;'}</span>`).join('')}</div></div>`;
  else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.t=='qb'||b.p)h+=''; });
 showPrev(h)}

let SB=401;
function sbData(seed){const R=rng(seed);const fb=shuf(FB,R).slice(0,6),mt=shuf(MT,R).slice(0,5),mtB=shuf(mt.map((x,i)=>[x[1],i]),R),tf=shuf(TF,R).slice(0,6),os=shuf(OS,R).slice(0,5),sa=shuf(SA,R).slice(0,3);return{fb,mt,mtB,tf,os,sa}}
function swB(b){b.innerHTML=`<div id="sbq"></div><div class="card" id="pdfp" style="display:none"><h2>🖨 अधिक स्वाध्याय – PDF</h2><div class="tool">${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;REGEN=()=>{genSwB()};renderSbq();genSwB()}
function newSb(){SB=1+Math.floor(Math.random()*99999);renderSbq();genSwB()}
function sbRev(id){$(id).classList.toggle('show')}
function sbTf(i,v,t,c,b){const ok=(v==t);b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');$('tf'+i).innerHTML=ok?`<span class="msg ok">🎉 बरोबर! ${t?'हे विधान बरोबर आहे.':'हे विधान चूक आहे. बरोबर : '+c}</span>`:`<span class="msg no">✘ पुन्हा विचार करा.</span>`}
function sbMt(){const d=sbData(SB);let ok=0;d.mt.forEach((x,i)=>{const s=$('sm'+i),good=LET[d.mtB.findIndex(y=>y[1]==i)];const g=s.value===good;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$('smm').innerHTML=ok==d.mt.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${d.mt.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function renderSbq(){const d=sbData(SB);let h=`<div class="card"><h2>✍️ अधिक स्वाध्याय · संच क्र. ${SB}</h2><button class="btn gr" onclick="newSb()">🎲 नवे प्रश्न</button></div>`;
 h+=`<div class="card"><h2>प्र.1 रिकाम्या जागा भरा.</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड्या जुळवा.</h2><table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">तपासा</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 बरोबर की चूक?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ बरोबर</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ चूक</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एका वाक्यात उत्तरे लिहा.</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 थोडक्यात उत्तरे लिहा.</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक स्वाध्याय',30,sc)+`<div class="ds">संच क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिकाम्या जागा भरा. (6 गुण)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड्या जुळवा. (5 गुण)</div><table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 खालील विधाने बरोबर की चूक ते लिहा. चूक असल्यास दुरुस्त करून लिहा. (6 गुण)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एका वाक्यात उत्तरे लिहा. (5 गुण)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 थोडक्यात उत्तरे लिहा. (8 गुण)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'बरोबर':'चूक – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक मुद्दे)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

/* ---------- 4. HOTS ---------- */
function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><h2>🧠 उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न</h2><p>पाठाच्या आशयावर आधारित पण पाठ्यपुस्तकाबाहेरील प्रश्न. स्वतः उत्तर लिहून मग ‘मार्गदर्शक मुद्दे’ पाहा.</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक मुद्दे:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्रिका (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न',n*3,sc)+`<div class="ds">संच क्र. ${seed} · स्वतःच्या शब्दांत सविस्तर उत्तरे लिहा.</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 गुण)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक मुद्दे (शिक्षकांसाठी) – संच ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}

document.title=L.name;$('hdr').textContent=L.name;
const h0=location.hash.replace('#','');if(['learn','mcq','sw','hots'].includes(h0))view=h0;
draw();
</script>
