const SCI="<!DOCTYPE html>\n<html lang=\"mr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>6वी गणित – त्रिकोण व चौकोन<\/title>\n<style>\n:root{--b:#1d4ed8;--g:#15803d;--o:#ea580c;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:#fff;color:var(--ink);font-family:\"Noto Sans Devanagari\",\"Mukta\",\"Segoe UI\",system-ui,sans-serif;font-size:17px;line-height:1.5}\n.wrap{max-width:760px;margin:0 auto;padding:12px}\n.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}\nh2{margin:0 0 6px;font-size:20px;color:var(--b)}\n.step{font-size:13px;color:var(--mut);font-weight:700}\n.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0}\n.btn.gr{background:var(--g)}.btn.or{background:var(--o)}.btn.ln{background:#e2e8f0;color:#1e293b}\n.btn:disabled{opacity:.4}\n.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.chip{padding:8px 14px;border-radius:999px;background:#e2e8f0;font-weight:700;border:2px solid transparent;cursor:pointer;user-select:none}\n.chip.on{background:#dbeafe;border-color:var(--b);color:var(--b)}\n.chip.ok{background:#dcfce7;border-color:#16a34a;color:#166534}.chip.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}\nsvg{max-width:100%;height:auto}\n.fig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;margin:6px 0}\n.fig>div{text-align:center;font-size:14px;font-weight:700;min-width:100px}\ntable.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}\ntable.t th,table.t td{border:1.5px solid #94a3b8;padding:6px;text-align:center}\ntable.t th{background:#dbeafe}\ntable.t td.l{text-align:left;font-weight:700;background:#f8fafc}\ntable.t tr.hi td{background:#fef9c3}\ninput.n{width:70px;font:inherit;font-size:17px;text-align:center;padding:5px;border:2px solid #94a3b8;border-radius:8px}\n.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}\n.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}\n.say{float:right;border:0;background:#eff6ff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}\n.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}\n.big{font-size:22px;font-weight:800;text-align:center}\ninput[type=range]{width:100%}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<div id=\"stepBox\"><\/div>\n<\/div>\n<script>\n/* ---------- common ---------- */\nfunction say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;\n const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}\nconst C='#1e293b',BL='#2563eb',RD='#dc2626',GR='#16a34a',OR='#ea580c';\nconst f=v=>(+v).toFixed(1);\nfunction ah(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),L=12,W=6;const bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a);\n return `<polygon points=\"${f(x2)},${f(y2)} ${f(bx-W*Math.sin(a))},${f(by+W*Math.cos(a))} ${f(bx+W*Math.sin(a))},${f(by-W*Math.cos(a))}\" fill=\"${col||C}\"/>`}\nfunction ln(x1,y1,x2,y2,o){o=o||{};const col=o.c||C;let s=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${col}\" stroke-width=\"${o.w||3}\" stroke-linecap=\"round\"${o.d?' stroke-dasharray=\"6 5\"':''}/>`;\n if(o.e)s+=ah(x1,y1,x2,y2,col);if(o.s)s+=ah(x2,y2,x1,y1,col);return s}\nfunction dot(x,y,lab,dx,dy,col){return `<circle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"5\" fill=\"${col||C}\"/>`+(lab?`<text x=\"${f(x+(dx||0))}\" y=\"${f(y+(dy==null?-10:dy))}\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${col||C}\">${lab}<\/text>`:'')}\nconst svg=(w,h,inner,pw)=>`<svg viewBox=\"0 0 ${w} ${h}\" width=\"${pw||w}\">${inner}<\/svg>`;\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}\nfunction shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\n\n/* ---------- steps : त्रिकोण व चौकोन ---------- */\nlet S=0;const SN=7;\nconst st={h1:'v',s:[5,5,5],ax:50,ay:60,tf:{},qh:'os',qn:0,pr:null,prm:[],hint:false};\nfunction sx(t){return `<button class=\"say\" onclick=\"say(this.dataset.t)\" data-t=\"${t.replace(/\"/g,'&quot;')}\">🗣 ऐका<\/button>`}\nfunction nav(){return `<div class=\"nav\"><button class=\"btn ln\" ${S==0?'disabled':''} onclick=\"go(-1)\">◀ मागे<\/button><span class=\"step\">${S+1} / ${SN}<\/span><button class=\"btn\" ${S==SN-1?'disabled':''} onclick=\"go(1)\">पुढे ▶<\/button><\/div>`}\nfunction go(d){S=Math.max(0,Math.min(SN-1,S+d));drawStep();try{window.parent.document.getElementById('sf').scrollIntoView()}catch(x){}}\nfunction drawStep(){document.getElementById('stepBox').innerHTML=[s0,s1,s2,s3,s4,s5,s6][S]()+nav()}\nconst deg=(P,Q,R)=>{const a=[P[0]-Q[0],P[1]-Q[1]],b=[R[0]-Q[0],R[1]-Q[1]];return Math.acos((a[0]*b[0]+a[1]*b[1])/Math.hypot(...a)/Math.hypot(...b))*180/Math.PI};\nfunction arcAt(Q,P,R,r,col){const a1=Math.atan2(P[1]-Q[1],P[0]-Q[0]),a2=Math.atan2(R[1]-Q[1],R[0]-Q[0]);let d=a2-a1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;\n return `<path d=\"M${f(Q[0]+r*Math.cos(a1))},${f(Q[1]+r*Math.sin(a1))} A${r} ${r} 0 0 ${d>0?1:0} ${f(Q[0]+r*Math.cos(a2))},${f(Q[1]+r*Math.sin(a2))}\" fill=\"none\" stroke=\"${col}\" stroke-width=\"3\"/>`}\nfunction tick(P,Q,n,col){const mx=(P[0]+Q[0])/2,my=(P[1]+Q[1])/2,L=Math.hypot(Q[0]-P[0],Q[1]-P[1]),ux=(Q[0]-P[0])/L,uy=(Q[1]-P[1])/L;let g='';\n for(let i=0;i<n;i++){const o=(i-(n-1)/2)*6;const cx=mx+ux*o,cy=my+uy*o;g+=`<line x1=\"${f(cx-uy*8)}\" y1=\"${f(cy+ux*8)}\" x2=\"${f(cx+uy*8)}\" y2=\"${f(cy-ux*8)}\" stroke=\"${col||'#dc2626'}\" stroke-width=\"2.5\"/>`}return g}\nconst lab=(P,t,dx,dy,c)=>`<text x=\"${f(P[0]+dx)}\" y=\"${f(P[1]+dy)}\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${c||'#1e293b'}\">${t}<\/text>`;\n\n/* पायरी 1 : त्रिकोणाचे घटक */\nfunction s0(){const A=[150,25],B=[40,175],C=[260,175],hl=st.h1,t='तीन नैकरेषीय बिंदू रेषाखंडांनी जोडले की त्रिकोण तयार होतो. त्रिकोणाला तीन शिरोबिंदू, तीन बाजू आणि तीन कोन असतात.';\n let g=`<polygon points=\"${A} ${B} ${C}\" fill=\"#fef9c3\" stroke=\"#1e293b\" stroke-width=\"3\"/>`;\n if(hl=='s')g+=ln(...A,...B,{c:RD,w:5})+ln(...B,...C,{c:BL,w:5})+ln(...C,...A,{c:GR,w:5});\n if(hl=='a')g+=arcAt(A,B,C,26,RD)+arcAt(B,C,A,26,BL)+arcAt(C,A,B,26,GR);\n [A,B,C].forEach(P=>g+=`<circle cx=\"${P[0]}\" cy=\"${P[1]}\" r=\"${hl=='v'?8:4}\" fill=\"${hl=='v'?OR:'#1e293b'}\"/>`);\n g+=lab(A,'A',0,-8)+lab(B,'B',-14,6)+lab(C,'C',14,6);\n const L={v:'शिरोबिंदू : A, B, C (3)',s:'बाजू : रेख AB, रेख BC, रेख CA (3)',a:'कोन : ∠ABC, ∠BCA, ∠CAB (3) – म्हणजे ∠B, ∠C, ∠A'};\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 1<\/div><h2>त्रिकोण व त्याचे घटक<\/h2>\n <div class=\"chips\"><span class=\"chip ${hl=='v'?'on':''}\" onclick=\"st.h1='v';drawStep()\">🟠 शिरोबिंदू<\/span><span class=\"chip ${hl=='s'?'on':''}\" onclick=\"st.h1='s';drawStep()\">➖ बाजू<\/span><span class=\"chip ${hl=='a'?'on':''}\" onclick=\"st.h1='a';drawStep()\">◜ कोन<\/span><\/div>\n <div class=\"fig\">${svg(300,200,g,300)}<\/div>\n <div class=\"key\" style=\"font-size:18px;text-align:center\">${L[hl]}<\/div>\n <table class=\"t\"><tr><th>शिरोबिंदूंची संख्या<\/th><th>बाजूंची संख्या<\/th><th>कोनांची संख्या<\/th><\/tr><tr><td><b>3<\/b><\/td><td><b>3<\/b><\/td><td><b>3<\/b><\/td><\/tr><\/table>\n <div class=\"key\">• त्रिकोण ABC असे ‘ΔABC’ लिहितात. तेच त्रिकोण ΔBCA, ΔCAB, ΔACB … असेही लिहिता येतो.<br>• बिंदू एकरेषीय असतील तर त्रिकोण तयार होत नाही.<\/div><\/div>`}\n\n/* पायरी 2 : बाजूंवरून प्रकार */\nfunction s1(){let [a,b,c]=st.s;const t='बाजूंवरून त्रिकोणाचे तीन प्रकार. तीनही बाजू समान – समभुज. दोनच बाजू समान – समद्विभुज. एकही बाजू समान नाही – विषमभुज.';\n const ok=a+b>c&&b+c>a&&a+c>b;let g='',typ='';\n if(ok){const x=(c*c+a*a-b*b)/(2*a),y=Math.sqrt(Math.max(0,c*c-x*x));const sc=Math.min(230/Math.max(a,x,a-x+0.01,Math.abs(x)+a),150/Math.max(y,0.1));\n  const ox=150-(Math.min(0,x)+Math.max(a,x))/2*sc;const B=[ox,185],C=[ox+a*sc,185],A=[ox+x*sc,185-y*sc];\n  g=`<polygon points=\"${A} ${B} ${C}\" fill=\"#e0f2fe\" stroke=\"#1e293b\" stroke-width=\"3\" stroke-linejoin=\"round\"/>`;\n  const marks=[[B,C,a],[C,A,b],[A,B,c]];const vals=[a,b,c];\n  marks.forEach(([P,Q,v])=>{if(vals.filter(z=>z==v).length>1)g+=tick(P,Q,1,RD)});\n  g+=lab(A,'A',0,-8)+lab(B,'B',-12,8)+lab(C,'C',12,8)+lab([(B[0]+C[0])/2,185],a+' सेमी',0,20,BL)+lab([(A[0]+C[0])/2,(A[1]+C[1])/2],b,16,0,BL)+lab([(A[0]+B[0])/2,(A[1]+B[1])/2],c,-16,0,BL);\n  typ=a==b&&b==c?'समभुज त्रिकोण':(a==b||b==c||a==c)?'समद्विभुज त्रिकोण':'विषमभुज त्रिकोण'}\n const sl=(i,l)=>`<div>${l} : <b>${st.s[i]} सेमी<\/b><\/div><input type=\"range\" min=\"2\" max=\"9\" value=\"${st.s[i]}\" oninput=\"st.s[${i}]=+this.value;drawStep()\">`;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 2<\/div><h2>बाजूंवरून त्रिकोणाचे प्रकार<\/h2>\n ${sl(0,'BC')}${sl(1,'CA')}${sl(2,'AB')}\n <div class=\"chips\"><span class=\"chip\" onclick=\"st.s=[5,5,5];drawStep()\">5, 5, 5<\/span><span class=\"chip\" onclick=\"st.s=[6,5,5];drawStep()\">6, 5, 5<\/span><span class=\"chip\" onclick=\"st.s=[6,4,5];drawStep()\">6, 4, 5<\/span><\/div>\n ${ok?`<div class=\"fig\">${svg(300,215,g,300)}<\/div><div class=\"big\" style=\"color:#1d4ed8\">${typ}<\/div>`:'<div class=\"msg no\">✘ या लांबीने त्रिकोण बनत नाही – कोणत्याही दोन बाजूंची बेरीज तिसऱ्या बाजूपेक्षा जास्त हवी.<\/div>'}\n <table class=\"t\"><tr><th>प्रकार<\/th><th>ओळख<\/th><\/tr><tr><td class=\"l\">समभुज<\/td><td>तीनही बाजू समान<\/td><\/tr><tr><td class=\"l\">समद्विभुज<\/td><td>फक्त दोन बाजू समान<\/td><\/tr><tr><td class=\"l\">विषमभुज<\/td><td>एकही बाजू समान नाही<\/td><\/tr><\/table>\n <div class=\"key\">आकृतीत समान लांबीच्या बाजू सारख्या खुणांनी (|) दाखवतात.<\/div><\/div>`}\n\n/* पायरी 3 : कोनांवरून प्रकार */\nfunction s2(){const B=[50,190],C=[250,190],A=[50+st.ax*2,190-st.ay*1.6],t='कोनांवरून त्रिकोणाचे तीन प्रकार. तीनही कोन लघुकोन – लघुकोन त्रिकोण. एक कोन काटकोन – काटकोन त्रिकोण. एक कोन विशालकोन – विशालकोन त्रिकोण.';\n const aA=deg(B,A,C),aB=deg(A,B,C),aC=deg(A,C,B),R=[Math.round(aA),Math.round(aB)];R.push(180-R[0]-R[1]);\n const mx=Math.max(...R),typ=mx==90?'काटकोन त्रिकोण':mx>90?'विशालकोन त्रिकोण':'लघुकोन त्रिकोण',tc=mx==90?BL:mx>90?OR:GR;\n let g=`<polygon points=\"${A} ${B} ${C}\" fill=\"#fef3c7\" stroke=\"#1e293b\" stroke-width=\"3\" stroke-linejoin=\"round\"/>`;\n [[A,B,C,R[0]],[B,C,A,R[1]],[C,A,B,R[2]]].forEach(([Q,P,Rr,v])=>g+=arcAt(Q,P,Rr,22,v==90?BL:v>90?OR:GR));\n g+=lab(A,'A',0,-10)+lab(B,'B',-12,8)+lab(C,'C',12,8)+lab(A,R[0]+'°',0,34,'#7c2d12')+lab(B,R[1]+'°',36,-8,'#7c2d12')+lab(C,R[2]+'°',-36,-8,'#7c2d12');\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 3<\/div><h2>कोनांवरून त्रिकोणाचे प्रकार<\/h2>\n <div>शिरोबिंदू A आडवा सरकवा<\/div><input type=\"range\" min=\"-10\" max=\"110\" value=\"${st.ax}\" oninput=\"st.ax=+this.value;drawStep()\">\n <div>शिरोबिंदू A वर-खाली<\/div><input type=\"range\" min=\"15\" max=\"100\" value=\"${st.ay}\" oninput=\"st.ay=+this.value;drawStep()\">\n <div class=\"chips\"><span class=\"chip\" onclick=\"st.ax=50;st.ay=90;drawStep()\">लघुकोन<\/span><span class=\"chip\" onclick=\"st.ax=0;st.ay=80;drawStep()\">काटकोन<\/span><span class=\"chip\" onclick=\"st.ax=-10;st.ay=40;drawStep()\">विशालकोन<\/span><\/div>\n <div class=\"fig\">${svg(300,215,g,300)}<\/div>\n <div class=\"big\" style=\"color:${tc}\">${typ}<\/div>\n <div class=\"msg in\">m∠A = ${R[0]}°, m∠B = ${R[1]}°, m∠C = ${R[2]}° &nbsp;·&nbsp; निरीक्षण : बेरीज = ${R[0]+R[1]+R[2]}°<\/div>\n <div class=\"key\">• <span style=\"color:${GR}\">लघुकोन त्रिकोण<\/span> : तीनही कोन 90° पेक्षा लहान.<br>• <span style=\"color:${BL}\">काटकोन त्रिकोण<\/span> : एक कोन 90°.<br>• <span style=\"color:${OR}\">विशालकोन त्रिकोण<\/span> : एक कोन 90° पेक्षा मोठा.<br>त्रिकोणात दोन काटकोन किंवा दोन विशालकोन असू शकत नाहीत.<\/div><\/div>`}\n\n/* पायरी 4 : सत्य की असत्य */\nconst TFQ=[['एका त्रिकोणात दोन काटकोन असू शकतात.',0,'दोन काटकोन घेतले तर भुजा समांतर होतात – त्रिकोण बंदच होत नाही.'],['काटकोन त्रिकोण हा समद्विभुज त्रिकोण असू शकतो.',1,'उदा. काटकोन करणाऱ्या दोन्ही बाजू समान (कोन 90°, 45°, 45°).'],\n ['लघुकोन त्रिकोण हा समभुज त्रिकोण असू शकत नाही.',0,'समभुज त्रिकोणाचे सर्व कोन 60° – म्हणजे तो लघुकोन त्रिकोणच असतो.'],['समभुज त्रिकोण हा विशालकोन त्रिकोण असू शकतो.',0,'समभुज त्रिकोणाचे सर्व कोन 60° असतात.'],\n ['विषमभुज त्रिकोण काटकोन त्रिकोण असू शकतो.',1,'उदा. बाजू 3, 4, 5 सेमी.'],['समद्विभुज त्रिकोण विशालकोन त्रिकोण असू शकतो.',1,'उदा. कोन 120°, 30°, 30°.']];\nfunction s3(){const t='एकच त्रिकोण बाजूंवरून एका प्रकारचा आणि कोनांवरून दुसऱ्या प्रकारचा असतो. विधाने बरोबर की चूक ते तपासा.';\n const fig=(pts,tk,arc)=>svg(120,100,`<polygon points=\"${pts.map(p=>p.join(',')).join(' ')}\" fill=\"#e0f2fe\" stroke=\"#1e293b\" stroke-width=\"2.5\"/>`+(tk||''),110);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 4<\/div><h2>दोन्ही प्रकार एकत्र : सत्य की असत्य?<\/h2>\n <div class=\"fig\"><div>${fig([[10,90],[10,15],[85,90]],tick([10,90],[10,15],1)+tick([10,90],[85,90],1)+`<path d=\"M10,78 H22 V90\" fill=\"none\" stroke=\"${BL}\" stroke-width=\"2\"/>`)}<br>काटकोन + समद्विभुज<\/div>\n <div>${fig([[5,90],[115,90],[60,60]],tick([5,90],[60,60],1)+tick([115,90],[60,60],1))}<br>विशालकोन + समद्विभुज<\/div>\n <div>${fig([[10,90],[110,90],[60,4]],tick([10,90],[110,90],1)+tick([10,90],[60,4],1)+tick([110,90],[60,4],1))}<br>समभुज = लघुकोन<\/div><\/div>\n ${TFQ.map((q,i)=>`<div style=\"margin:8px 0;padding:8px;border-radius:10px;background:${st.tf[i]==null?'#f8fafc':st.tf[i]==q[1]?'#dcfce7':'#fee2e2'}\">${i+1}. ${q[0]}<div class=\"chips\"><span class=\"chip ${st.tf[i]===1?'on':''}\" onclick=\"st.tf[${i}]=1;drawStep()\">सत्य<\/span><span class=\"chip ${st.tf[i]===0?'on':''}\" onclick=\"st.tf[${i}]=0;drawStep()\">असत्य<\/span><\/div>${st.tf[i]!=null?`<small>${st.tf[i]==q[1]?'✔':'✘'} ${q[1]?'सत्य':'असत्य'} – ${q[2]}<\/small>`:''}<\/div>`).join('')}<\/div>`}\n\n/* पायरी 5 : चौकोनाचे घटक */\nconst QH={os:['संमुख बाजू','PQ व SR ; QR व PS',[['P','Q',RD],['S','R',RD],['Q','R',BL],['P','S',BL]]],as:['लगतच्या बाजू','PQ व QR ; QR व RS ; RS व SP ; SP व PQ (4 जोड्या)',[['P','Q',RD],['Q','R',RD]]],\n oa:['संमुख कोन','∠P व ∠R ; ∠Q व ∠S',[]],aa:['लगतचे कोन','∠P व ∠Q ; ∠Q व ∠R ; ∠R व ∠S ; ∠S व ∠P (4 जोड्या)',[]],dg:['कर्ण','रेख PR व रेख QS',[['P','R',GR],['Q','S',OR]]]};\nfunction s4(){const V={P:[50,40],Q:[240,30],R:[265,175],S:[30,165]},h=st.qh,x=QH[h],t='चौकोनाला चार बाजू, चार कोन आणि चार शिरोबिंदू असतात. समोरासमोरच्या बाजू संमुख बाजू, एक शिरोबिंदू सामाईक असलेल्या बाजू लगतच्या बाजू. संमुख शिरोबिंदू जोडणारे रेषाखंड म्हणजे कर्ण.';\n let g=`<polygon points=\"${V.P} ${V.Q} ${V.R} ${V.S}\" fill=\"#f0fdf4\" stroke=\"#1e293b\" stroke-width=\"3\"/>`;\n x[2].forEach(([a,b,c])=>g+=ln(...V[a],...V[b],{c,w:h=='dg'?3.5:6,d:h=='dg'}));\n if(h=='oa')g+=arcAt(V.P,V.Q,V.S,24,RD)+arcAt(V.R,V.S,V.Q,24,RD)+arcAt(V.Q,V.R,V.P,24,BL)+arcAt(V.S,V.P,V.R,24,BL);\n if(h=='aa')g+=arcAt(V.P,V.Q,V.S,24,RD)+arcAt(V.Q,V.R,V.P,24,RD);\n g+=lab(V.P,'P',-12,-6)+lab(V.Q,'Q',10,-6)+lab(V.R,'R',12,14)+lab(V.S,'S',-12,14);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 5<\/div><h2>चौकोन व त्याचे घटक<\/h2>\n <div class=\"chips\">${Object.keys(QH).map(k=>`<span class=\"chip ${k==h?'on':''}\" onclick=\"st.qh='${k}';drawStep()\">${QH[k][0]}<\/span>`).join('')}<\/div>\n <div class=\"fig\">${svg(300,200,g,300)}<\/div>\n <div class=\"key\" style=\"font-size:17px\"><b>${x[0]} :<\/b> ${x[1]}<\/div>\n <table class=\"t\"><tr><th>शिरोबिंदू<\/th><th>बाजू<\/th><th>कोन<\/th><th>कर्ण<\/th><\/tr><tr><td>4<\/td><td>4<\/td><td>4<\/td><td>2<\/td><\/tr><\/table>\n <div class=\"key\">• चौकोनात संमुख बाजूंच्या 2 जोड्या, लगतच्या बाजूंच्या 4 जोड्या.<br>• संमुख कोनांच्या 2 जोड्या, लगतच्या कोनांच्या 4 जोड्या.<\/div><\/div>`}\n\n/* पायरी 6 : चौकोनाचे नाव व चौकोन कोणता नाही */\nfunction s5(){const t='चौकोनाचे नाव लिहिताना शिरोबिंदू क्रमाने, घड्याळाच्या काट्याच्या दिशेने किंवा विरुद्ध दिशेने लिहितात. म्हणून एका चौकोनाची आठ नावे होतात. ज्या आकृतीच्या बाजू एकमेकींना छेदतात ती चौकोन नाही.';\n const N=['UVWX','VWXU','WXUV','XUVW','UXWV','XWVU','WVUX','VUXW'];const k=st.qn;\n const V={U:[40,30],V:[200,30],W:[230,150],X:[20,150]},ord=N[k].split('');\n let g=`<polygon points=\"${V.U} ${V.V} ${V.W} ${V.X}\" fill=\"#eef2ff\" stroke=\"#1e293b\" stroke-width=\"3\"/>`;\n for(let i=0;i<4;i++){const a=V[ord[i]],b=V[ord[(i+1)%4]];g+=ln(...a,...b,{c:i==0?RD:'#6366f1',w:3,e:1})}\n g+=lab(V.U,'U',-10,-6)+lab(V.V,'V',10,-6)+lab(V.W,'W',12,14)+lab(V.X,'X',-12,14)+`<circle cx=\"${V[ord[0]][0]}\" cy=\"${V[ord[0]][1]}\" r=\"8\" fill=\"${OR}\"/>`;\n const bad=svg(120,100,`<polygon points=\"10,10 110,90 110,10 10,90\" fill=\"#fee2e2\" stroke=\"#dc2626\" stroke-width=\"2.5\"/>`,110);\n const good=svg(120,100,`<polygon points=\"15,15 105,10 95,90 25,80\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"2.5\"/>`,110);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 6<\/div><h2>चौकोनाची नावे आणि चौकोन कोणता नाही?<\/h2>\n <div class=\"fig\">${svg(260,180,g,280)}<\/div>\n <div class=\"big\" style=\"color:#4338ca\">□ ${N[k]}<\/div>\n <button class=\"btn\" onclick=\"st.qn=(st.qn+1)%8;drawStep()\">▶ पुढचे नाव (${k+1}/8)<\/button>\n <div class=\"key\">एका चौकोनाची नावे : ${N.slice(0,k+1).map(x=>'<b>'+x+'<\/b>').join(', ')}${k<7?', …':''}<br>4 शिरोबिंदूंपासून सुरुवात × 2 दिशा = <b>8 नावे<\/b>. UWVX असे नाव चूक (क्रम तुटतो).<\/div>\n <div class=\"fig\"><div>${good}<br>✔ चौकोन<\/div><div>${bad}<br>✘ चौकोन नाही<br><small>बाजू एकमेकींना छेदतात<\/small><\/div><\/div>\n <div class=\"key\">चौकोनात कोणतीही एक बाजू वाढवली तर उरलेले दोन शिरोबिंदू त्या रेषेच्या <b>एकाच बाजूला<\/b> असतात.<\/div><\/div>`}\n\n/* पायरी 7 : आता तुम्ही सोडवा */\nfunction newPr(){if(Math.random()<.5){const k=rnd(0,2);let s=k==0?[5,5,5].map(()=>rnd(3,8)):null;if(k==0){const v=rnd(3,8);s=[v,v,v]}else if(k==1){const v=rnd(3,8);let w=rnd(2,9);while(w==v||w>=2*v)w=rnd(2,9);s=shuf([v,v,w])}else{s=[3,4,5];while(new Set(s).size<3||s[0]+s[1]<=s[2]||s[0]+s[2]<=s[1]||s[1]+s[2]<=s[0])s=[rnd(3,9),rnd(3,9),rnd(3,9)]}\n  st.pr={k:'s',s,a:['समभुज','समद्विभुज','विषमभुज'][k],o:['समभुज','समद्विभुज','विषमभुज']}}\n else{const k=rnd(0,2);let A=k==1?90:k==2?rnd(95,150):rnd(50,85),B=k==0?rnd(Math.max(10,95-A),85):rnd(15,Math.min(75,170-A));const C=180-A-B;\n  const ang=shuf([A,B,C]);st.pr={k:'a',ang,a:['लघुकोन','काटकोन','विशालकोन'][typA(ang)],o:['लघुकोन','काटकोन','विशालकोन']}}\n st.prm='';st.hint=false}\nfunction typA(a){const m=Math.max(...a);return m==90?1:m>90?2:0}\nfunction s6(){if(!st.pr)newPr();const p=st.pr,t='त्रिकोणाचा प्रकार ओळखा.';\n const q=p.k=='s'?`त्रिकोण DEF च्या बाजू <b>${p.s.join(' सेमी, ')} सेमी<\/b> आहेत. बाजूंवरून त्रिकोणाचा प्रकार कोणता?`:`त्रिकोण PQR चे कोन <b>${p.ang.join('°, ')}°<\/b> आहेत. कोनांवरून त्रिकोणाचा प्रकार कोणता?`;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 7<\/div><h2>आता तुम्ही सोडवा<\/h2>\n <div class=\"key\" style=\"font-size:18px\">${q}<\/div>\n <div class=\"chips\">${p.o.map(x=>`<span class=\"chip\" onclick=\"st.prm=('${x}'=='${p.a}')?'<div class=&quot;msg ok&quot;>🎉 बरोबर! ${p.a} त्रिकोण<\/div>':'<div class=&quot;msg no&quot;>✘ अजून नाही. 💡 मदत पाहा.<\/div>';drawStep()\">${x} त्रिकोण<\/span>`).join('')}<\/div>\n <button class=\"btn or\" onclick=\"st.hint=!st.hint;drawStep()\">💡 मदत<\/button>\n ${st.hint?`<div class=\"key\">${p.k=='s'?'किती बाजू समान आहेत ते मोजा : 3 → समभुज, 2 → समद्विभुज, 0 → विषमभुज.':'सर्वांत मोठा कोन पाहा : 90° पेक्षा लहान → लघुकोन, 90° → काटकोन, जास्त → विशालकोन.'}<\/div>`:''}\n <div>${st.prm}<\/div><button class=\"btn ln\" onclick=\"newPr();drawStep()\">🔄 दुसरा प्रश्न<\/button><\/div>`}\n\ndrawStep();\n<\/script>\n<\/body>\n<\/html>\n";
const L={name:'पाठ 8 : त्रिकोण व चौकोन',cls:'इयत्ता : 6वी &nbsp; विषय : गणित',foot:'इ. 6वी गणित · पाठ 8'};
const SYM=[];const symGrid2=()=>'';
const SECS=[{t:'शिकू या',bare:1,say:'',h:()=>{setTimeout(()=>{const f=document.getElementById('sf');if(f&&!f.dataset.l){f.dataset.l=1;f.onload=()=>{try{const d=f.contentDocument;const st=d.createElement('style');st.textContent='html,body{min-height:0!important;height:auto!important}';d.head.appendChild(st);const fit=()=>{try{const w=d.querySelector('.wrap');const h=Math.ceil(w.getBoundingClientRect().bottom+d.defaultView.scrollY)+10;if(Math.abs(f.offsetHeight-h)>4)f.style.height=h+'px'}catch(e){}};fit();setInterval(fit,300)}catch(e){}};f.srcdoc=SCI}},50);return `<iframe id="sf" title="शिकू या" scrolling="no" style="width:100%;height:600px;border:0;background:#fff;display:block"></iframe>`}}];
function chkMt(){}

</script>
<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,R){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sx=t=>`<button class="say" onclick="say(this.dataset.t)" data-t="${esc(t).replace(/"/g,'&quot;')}">🗣 ऐका</button>`;
const LET=['अ','ब','क','ड','इ'];
let view='home';
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}draw();window.scrollTo({top:0})}
function draw(){const m=$('main');({home:vHome,learn:vLearn,mcq:vMcq,sw:vSw,hots:vHots}[view]||vHome)(m)}

/* ---------- home ---------- */
function vHome(m){m.innerHTML=`<div class="grid">
<button class="hc" onclick="go('learn')"><div class="ic">📖</div><h2>1. शिकू या</h2><p>पायरी-पायरीने पाठ समजून घ्या – कृतीसह, स्वतः तपासा</p></button>
<button class="hc" onclick="go('mcq')"><div class="ic">❓</div><h2>2. MCQ प्रश्न</h2><p>बहुपर्यायी सराव + A4 PDF (उत्तरसूचीसह)</p></button>
<button class="hc" onclick="go('sw')"><div class="ic">✍️</div><h2>3. स्वाध्याय</h2><p>अ) पुस्तकातील · ब) अधिक (पुस्तकाबाहेरील) – PDF</p></button>
<button class="hc" onclick="go('hots')"><div class="ic">🧠</div><h2>4. उपयोजनात्मक / HOTS</h2><p>विचार करायला लावणारे प्रश्न – PDF</p></button></div>`}

/* ---------- widgets ---------- */
const symGrid=()=>`<div class="sg">${SYM.map(s=>`<div class="sc" onclick="this.classList.toggle('on')"><div class="sy">${s[0]}</div><div class="sf">❓ कोणता धर्म?<br><small>(टिचकी मारा)</small></div><div class="sb"><b>${s[1]}</b><br><small>${s[2]}</small></div></div>`).join('')}</div>`;
const phGrid=(ks)=>`<div class="sg">${ks.map(k=>`<div class="sc" onclick="this.classList.toggle('on')"><img src="${IM[k[0]]}" style="width:100%;border-radius:8px"><div class="sf" style="font-size:13px">❓ हे काय आहे?</div><div class="sb"><b>${k[1]}</b></div></div>`).join('')}</div>`;
const qimg=k=>`<img src="${IM[k]}" style="width:100%;max-width:300px;border-radius:10px;display:block;margin:6px 0">`;
let WID=0;
function chipsInfo(items){const id='ci'+(++WID);return `<div class="chips" id="${id}c">${items.map((x,i)=>`<button class="chip" onclick="ci('${id}',${i})">${x[0]}</button>`).join('')}</div><div class="info" id="${id}">👆 एखाद्या शब्दावर टिचकी मारा.</div>`+`<script type="text/plain" id="${id}d">${esc(JSON.stringify(items.map(x=>x[1])))}<\/script>`}
function ci(id,i){const d=JSON.parse($(id+'d').textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'));$(id).innerHTML=d[i];[...$(id+'c').children].forEach((c,j)=>c.classList.toggle('on',i==j))}
const flip=(q,a)=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="fq">❓ ${q}</div><div class="fa">✔ ${a}</div></div>`;
function mini(q,opts,ans,why){const id='mq'+(++WID);return `<div class="mini" id="${id}"><b>🧩 स्वतः तपासा:</b> ${q}${opts.map((o,i)=>`<button class="opt" onclick="mqa('${id}',this,${i==ans},'${esc(why).replace(/'/g,"\\'")}')">${o}</button>`).join('')}<div class="mm"></div></div>`}
function mqa(id,b,ok,why){const box=$(id);if(box.dataset.done)return;b.classList.add(ok?'ok':'no');const mm=box.querySelector('.mm');
 if(ok){box.dataset.done=1;mm.innerHTML=`<div class="msg ok">🎉 बरोबर! ${why}</div>`;LS.pts++;updProg()}else mm.innerHTML='<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>'}
function ordGame(title,items){const id='og'+(++WID);const R=rng(7+WID);const sh=shuf(items.map((x,i)=>[x,i]),R);
 return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🔢 ${title}</b><div class="ord">${sh.map(([x,i])=>`<button class="opt" data-i="${i}" onclick="ogc('${id}',this)">${x}</button>`).join('')}</div><div class="mm">क्रमाने एकेक घटना निवडा.</div></div>`}
function ogc(id,b){const box=$(id);let k=+box.dataset.k;if(b.classList.contains('ok'))return;const mm=box.querySelector('.mm');
 if(+b.dataset.i===k){b.classList.add('ok');b.innerHTML=(k+1)+'. '+b.innerHTML;box.dataset.k=++k;mm.innerHTML=k==box.dataset.n?'<div class="msg ok">🎉 सर्व क्रम बरोबर!</div>':'<div class="msg in">बरोबर! पुढची घटना कोणती?</div>';if(k==box.dataset.n){LS.pts++;updProg()}}
 else mm.innerHTML='<div class="msg no">✘ ही घटना आता नाही. विचार करून पुन्हा निवडा.</div>'}


function sortGame(title,items,cats){const id='sg'+(++WID);return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🗂 ${title}</b>${items.map((x,i)=>`<div class="qcard" id="${id}_${i}"><div>${x[0]}</div><div class="chips">${cats.map((c,j)=>`<button class="chip" onclick="sgc('${id}',${i},${j},${x[1]})">${c}</button>`).join('')}</div></div>`).join('')}<div class="mm"></div></div>`}
function sgc(id,i,j,right){const r=$(id+'_'+i);if(r.dataset.d)return;const box=$(id);if(j==right){r.dataset.d=1;r.style.background='#dcfce7';r.querySelectorAll('.chip').forEach((c,k)=>{c.disabled=true;c.classList.toggle('on',k==j)});box.dataset.k=+box.dataset.k+1;LS.pts++;updProg();if(box.dataset.k==box.dataset.n)box.querySelector('.mm').innerHTML='<div class="msg ok">🎉 सर्व बरोबर!</div>'}else{r.style.background='#fee2e2';setTimeout(()=>{if(!r.dataset.d)r.style.background=''},700)}}
function matchSel(title,rows,opts){const id='ms'+(++WID);return `<div class="mini" id="${id}"><b>🧩 ${title}</b><table class="t">${rows.map((r,i)=>`<tr><td style="text-align:left">${r[0]}</td><td><select id="${id}_${i}"><option value="">–</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</table><button class="btn gr" onclick="msc('${id}',${esc(JSON.stringify(rows.map(r=>r[1]))).replace(/"/g,'&quot;')})">तपासा</button><div class="mm"></div></div>`}
function msc(id,ans){let ok=0;ans.forEach((a,i)=>{const s=$(id+'_'+i),g=s.value==a;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(id).querySelector('.mm').innerHTML=ok==ans.length?'<div class="msg ok">🎉 सर्व बरोबर!</div>':`<div class="msg in">${ok}/${ans.length} बरोबर. लाल रंगाची उत्तरे बदला.</div>`;if(ok==ans.length){LS.pts++;updProg()}}

/* ---------- नागरिकशास्त्र विशेष widgets ---------- */
function scen(title,sit,opts){const id='sc'+(++WID);return `<div class="mini" id="${id}"><b>🎭 ${title}</b><div class="key" style="margin:6px 0">${sit}</div>${opts.map((o,i)=>`<button class="opt" onclick="scc('${id}',this,${o[1]},'${esc(o[2]).replace(/'/g,"\\'")}')">${o[0]}</button>`).join('')}<div class="mm">तुम्ही काय कराल? एक पर्याय निवडा.</div></div>`}
function scc(id,b,good,why){const box=$(id);if(box.dataset.done)return;b.classList.add(good?'ok':'no');const mm=box.querySelector('.mm');mm.innerHTML=`<div class="msg ${good?'ok':'no'}">${good?'🎉 योग्य निर्णय!':'⚠ विचार करा.'} ${why}</div>`;if(good){box.dataset.done=1;LS.pts++;updProg()}}
function cloze(title,text,ans,bank){const id='cz'+(++WID);let k=0;const h=text.replace(/___/g,()=>{const i=k++;return `<select id="${id}_${i}" style="font:inherit;padding:2px;border-radius:6px"><option value="">____</option>${bank.map(o=>`<option>${o}</option>`).join('')}</select>`});
 return `<div class="mini" id="${id}"><b>✍ ${title}</b><div style="line-height:2.1;margin:8px 0">${h}</div><button class="btn gr" onclick="czc('${id}',${esc(JSON.stringify(ans)).replace(/"/g,'&quot;')})">तपासा</button><div class="mm"></div></div>`}
function czc(id,ans){let ok=0;ans.forEach((a,i)=>{const s=$(id+'_'+i),g=s.value==a;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(id).querySelector('.mm').innerHTML=ok==ans.length?'<div class="msg ok">🎉 सर्व बरोबर!</div>':`<div class="msg in">${ok}/${ans.length} बरोबर. लाल रंगाची रिकामी जागा पुन्हा भरा.</div>`;if(ok==ans.length){LS.pts++;updProg()}}
function tree(title,nodes){const r=(n)=>`<details style="margin:4px 0 4px 10px"><summary style="cursor:pointer;font-weight:700;color:#7c2d12">${n[0]}</summary><div style="margin:4px 0 4px 8px;font-size:15px">${n[1]||''}</div>${(n[2]||[]).map(r).join('')}</details>`;return `<div class="mini"><b>🌳 ${title}</b><div style="margin-top:6px">${nodes.map(r).join('')}</div><div class="mm" style="font-size:13px;color:#78716c">▶ टिचकी मारून उघडा.</div></div>`}
function voteSim(title,cands,rule){const id='vt'+(++WID);const R=rng(11+WID);const base=cands.map(()=>3+Math.floor(R()*8));return `<div class="mini" id="${id}" data-base='${JSON.stringify(base)}'><b>🗳 ${title}</b><div class="key" style="margin:6px 0">${rule}</div>${cands.map((c,i)=>`<button class="opt" onclick="vtc('${id}',${i})">${c}</button>`).join('')}<div class="mm">गुप्त मतदान – तुमचे मत नोंदवा.</div></div>`}
function vtc(id,i){const box=$(id);if(box.dataset.done)return;box.dataset.done=1;const base=JSON.parse(box.dataset.base);base[i]++;const names=[...box.querySelectorAll('.opt')].map(b=>b.textContent);const tot=base.reduce((a,b)=>a+b,0);const mx=Math.max(...base);const w=base.indexOf(mx);
 box.querySelector('.mm').innerHTML=`<div class="msg ok">तुमचे मत नोंदले. निकाल (एकूण ${tot} मते):</div>`+base.map((v,j)=>`<div style="margin:4px 0">${names[j]} — ${v} मते<div style="background:#fde68a;height:10px;border-radius:5px;width:${Math.round(v/mx*100)}%"></div></div>`).join('')+`<div class="msg in">🏆 बहुमत : <b>${names[w]}</b> विजयी. (लोकशाहीत बहुमताने निर्णय होतो.)</div>`;LS.pts++;updProg()}
/* ---------- 1. शिकू या ---------- */
let LS={s:0,pts:0};
function updProg(){const p=$('pb');if(p)p.style.width=Math.round((LS.s+1)/SECS.length*100)+'%';const s=$('pts');if(s)s.textContent='⭐ '+LS.pts}
function vLearn(m){const S=SECS[LS.s];
 if(S.bare){m.innerHTML=`<button class="back" onclick="go('home')">← मुख्य पान</button><div class="card" style="padding:0;overflow:hidden">${S.h()}</div>`;return}
 m.innerHTML=`<button class="back" onclick="go('home')">← मुख्य पान</button>
 <div class="card"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:var(--mut)">पायरी ${LS.s+1} / ${SECS.length}</span><span id="pts" style="font-weight:700">⭐ ${LS.pts}</span></div><div class="prog"><i id="pb" style="width:${Math.round((LS.s+1)/SECS.length*100)}%"></i></div>
 ${sx(S.say)}<h2>${S.t}</h2>${S.h()}
 <div class="nav"><button class="btn ln" ${LS.s==0?'disabled':''} onclick="LS.s--;draw();window.scrollTo({top:0})">◀ मागे</button><button class="btn" ${LS.s==SECS.length-1?'disabled':''} onclick="LS.s++;draw();window.scrollTo({top:0})">पुढे ▶</button></div></div>`;
 if(LS.s==SECS.length-1)$('fin').innerHTML='🏆 पाठ पूर्ण! आता ‘MCQ’ आणि ‘स्वाध्याय’ सोडवा.'}

/* ---------- print machinery ---------- */
function wrapDoc(inner,forPrint){return `<div class="doc"><table class="pg"><thead><tr><td><div class="sph"></div></td></tr></thead><tbody><tr><td>${inner}</td></tr></tbody><tfoot><tr><td><div class="spf"></div></td></tr></tfoot></table></div>`}
const WMK='<div class="wmk"><div>जी.एम.नदाफ केंद्रप्रमुख गिरगांव ता.जत</div><div>7972568986</div></div>';
const PFOOT=`<div class="pfoot"><span>रचनाकार : जी.एम.नदाफ, केंद्रप्रमुख गिरगांव ता.जत · 📞 7972568986</span><span>${L.foot}</span></div>`;
function togPdf(){const p=$('pdfp');if(!p)return;const s=p.style.display=='none';p.style.display=s?'block':'none';if(s)p.scrollIntoView({behavior:'smooth'})}
function doPrint(html){$('printHost').innerHTML=WMK+PFOOT+wrapDoc(html);window.print()}
window.addEventListener('afterprint',()=>{$('printHost').innerHTML=''});
function dHead(t,marks,sch){return `<div class="dh"><div class="r"><b>शाळा : ${sch?esc(sch):'________________________'}</b><span>${L.cls}</span></div><div class="r"><span>नाव : <i class="ln" style="min-width:55mm"></i></span><span>दिनांक : <i class="ln" style="min-width:26mm"></i></span><span>गुण : &nbsp;&nbsp;&nbsp;&nbsp;/ ${marks}</span></div></div><h3 class="dt">${t}</h3><div class="ds">${L.name}</div>`}
const wl=n=>'<div class="wl"></div>'.repeat(n);
let CURDOC='';
function showPrev(html){CURDOC=html;$('prev').innerHTML=wrapDoc(html)}
function toolbar(opts){return `<div class="card"><div class="tool">${opts}</div></div>`}
const seedBox=(v)=>`<label>संच क्र.</label><input type="number" id="seed" min="1" max="99999" value="${v}" style="width:90px" onchange="regen()"><button class="btn gr" onclick="$('seed').value=1+Math.floor(Math.random()*99999);regen()">🎲 नवा संच</button>`;
const schoolBox=`<label>शाळा:</label><input type="text" id="sch" placeholder="(ऐच्छिक)" style="width:170px" oninput="regen()">`;
const keyBox=`<label><input type="checkbox" id="ky" checked onchange="regen()"> उत्तरसूची जोडा</label>`;
const prBtn=`<button class="btn bl" onclick="doPrint(CURDOC)">📄 PDF / प्रिंट</button>`;
const prHelp=`<div class="msg in">प्रिंट विंडोमध्ये ‘Save as PDF’ निवडा, कागद A4, Margins ‘None’ ठेवा. प्रत्येक वेळी नवा संच क्र. = नवे प्रश्न; तोच क्रमांक = तोच संच.</div>`;
let REGEN=()=>{};function regen(){REGEN()}

/* ---------- 2. MCQ ---------- */
let MC={qs:[],i:0,sc:0,wrong:[],done:false};
function mcStart(){const R=rng(Date.now()%100000);MC={qs:shuf(MCQ,R).slice(0,10).map(q=>mkq(q,R)),i:0,sc:0,wrong:[],done:false};drawMc()}
function mkq(q,R){const o=shuf([[q[1],1],[q[2],0],[q[3],0],[q[4],0]],R);return{q:q[0],o:o.map(x=>x[0]),a:o.findIndex(x=>x[1]),e:q[5]}}
function vMcq(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div><div class="card" id="mcb"></div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 MCQ चाचणी (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="mn" onchange="regen()"><option>10</option><option selected>15</option><option>20</option><option>25</option></select>${seedBox(301)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genMcq;mcStart();genMcq()}
function drawMc(){const b=$('mcb');if(!b)return;
 if(MC.done){ssRep(MC);b.innerHTML=`<h2>📊 निकाल : ${MC.sc} / ${MC.qs.length}</h2><div class="msg ${MC.sc>=8?'ok':'in'}">${MC.sc>=9?'उत्तम! 🏆':MC.sc>=7?'छान! 👍':'पुन्हा सराव करा 💪'}</div>${MC.wrong.length?'<h3>चुकलेले प्रश्न:</h3>'+MC.wrong.map(w=>`<div class="qcard"><b>${w.q}</b><div class="ans show">✔ ${w.o[w.a]}\n${w.e}</div></div>`).join(''):''}<button class="btn gr" onclick="mcStart()">🔄 नवे 10 प्रश्न</button>`;return}
 const q=MC.qs[MC.i];b.innerHTML=`<h2>❓ सराव (${MC.i+1}/${MC.qs.length}) <small style="float:right">⭐ ${MC.sc}</small></h2><div class="prog"><i style="width:${MC.i/MC.qs.length*100}%"></i></div><p><b>${q.q}</b></p>${q.o.map((o,i)=>`<button class="opt" onclick="mcA(${i},this)">${LET[i]}) ${o}</button>`).join('')}<div id="mcm"></div>`}
function mcA(i,b){const q=MC.qs[MC.i];if(q.d)return;q.d=1;const bs=document.querySelectorAll('#mcb .opt');bs[q.a].classList.add('ok');if(i!=q.a)b.classList.add('no');if(i==q.a)MC.sc++;else MC.wrong.push(q);
 $('mcm').innerHTML=`<div class="msg ${i==q.a?'ok':'no'}">${i==q.a?'🎉 बरोबर!':'✘ चुकले.'} ${q.e}</div><button class="btn" onclick="MC.i++;if(MC.i>=MC.qs.length)MC.done=true;drawMc()">${MC.i==MC.qs.length-1?'निकाल पाहा':'पुढचा प्रश्न ▶'}</button>`}
function genMcq(){const n=+$('mn').value,seed=+$('seed').value||1,R=rng(seed);const qs=shuf(MCQ,R).slice(0,n).map(q=>mkq(q,R));
 let h=dHead('MCQ चाचणी',n,$('sch').value.trim())+`<div class="ds">संच क्र. ${seed} · योग्य पर्याय निवडून उत्तर कंसात लिहा.</div>`+
 qs.map((q,i)=>`<div class="qb"><div>${i+1}. ${q.q} <b>( &nbsp;&nbsp;&nbsp; )</b></div><div class="opts">${q.o.map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div></div>`).join('');
 if($('ky').checked)h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="opts" style="grid-template-columns:repeat(5,1fr);margin-left:0">${qs.map((q,i)=>`<span>${i+1}) ${LET[q.a]}</span>`).join('')}</div></div>`;
 showPrev(h)}

/* ---------- 3. स्वाध्याय ---------- */
let SWT='a';
function vSw(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><div class="chips"><button class="chip ${SWT=='a'?'on':''}" onclick="SWT='a';vSw($('main'))">अ) पुस्तकातील स्वाध्याय</button><button class="chip ${SWT=='b'?'on':''}" onclick="SWT='b';vSw($('main'))">ब) अधिक स्वाध्याय (पुस्तकाबाहेरील)</button></div></div><div id="swb"></div>`;
 SWT=='a'?swA($('swb')):swB($('swb'))}
function ansBtn(id){return `<button class="btn ln" onclick="$('${id}').classList.toggle('show')">👁 उत्तर पाहा / लपवा</button>`}
const IMG=(k,c)=>`<figure style="margin:8px 0;text-align:center"><img src="${IM[k]}" style="width:100%;max-width:420px;border-radius:14px;box-shadow:0 2px 8px #0003" alt=""><figcaption style="font-size:14px;color:#78716c">${c||''}</figcaption></figure>`;
let SWID=0;
const mk=c=>c&&typeof c=='object'?`<span class="ans2">${c.a}</span>`:(c==null?'':c);
function swBlock(b,bi){let h=`<div class="card"><h2>${b.h}</h2>`;const id=x=>`sw${bi}_${x}`;
 if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qcard" id="${id(i)}"><div>${i+1}. ${it[0]}</div>${it[1].map((o,j)=>`<button class="opt" onclick="swM('${id(i)}',this,${j==it[2]},'${esc(it[1][it[2]]).replace(/'/g,"\\'")}')">${LET[j]}) ${o}</button>`).join('')}<div class="mm"></div></div>`).join('');
 else if(b.t=='qa')h+=b.items.map((it,i)=>`<div class="qcard">${i+1}. ${it[0]}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='match')h+=`<table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${b.L.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x}</td><td><select id="${id('s'+i)}"><option value="">–</option>${b.R.map((r,j)=>`<option>${LET[j]}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${b.R.map((r,j)=>`<li>${LET[j]}) ${r}</li>`).join('')}</ul><button class="btn gr" onclick="swMt(${bi})">तपासा</button><div id="${id('m')}"></div>`;
 else if(b.t=='table')h+=`<table class="t"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</table><button class="btn ln" onclick="document.querySelectorAll('#sw${bi}c .ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`.replace('<table class="t">',`<div id="sw${bi}c"><table class="t">`).replace('</table>','</table></div>');
 else if(b.t=='order')h+=ordGame('क्रमाने लावा',b.items)+`<div class="msg in">योग्य क्रम : ${b.items.map((x,i)=>`${i+1}) ${x}`).join(' → ')}</div>`;
 else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qcard">${qimg(it[0])}${i+1}. ${it[2]||''}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='concept')h+=`<div style="text-align:center"><b>${b.center}</b><br>⬇<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${b.leaves.map(x=>`<span class="ans2" style="padding:6px 10px">${x}</span>`).join('')}</div></div><div id="sw${bi}c"></div><button class="btn ln" onclick="document.querySelectorAll('.ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`;
 else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 return h+'</div>'}
function swM(id,b,ok,a){const box=$(id);if(box.dataset.d)return;b.classList.add(ok?'ok':'no');if(ok)box.dataset.d=1;box.querySelector('.mm').innerHTML=ok?`<div class="msg ok">🎉 बरोबर!</div>`:`<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>`}
function swMt(bi){const b=SWB[bi];let ok=0;b.L.forEach((x,i)=>{const s=$(`sw${bi}_s${i}`),g=s.value===LET[b.A[i]];if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(`sw${bi}_m`).innerHTML=ok==b.L.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${b.L.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function swA(b){let h=SWB.map((x,i)=>swBlock(x,i)).join('');
 h+=`<div class="card" id="pdfp" style="display:none"><h2>🖨 पुस्तकातील स्वाध्याय – PDF</h2><div class="tool">${schoolBox}<label><input type="checkbox" id="ky" checked onchange="regen()"> आदर्श उत्तरे जोडा</label>${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 b.innerHTML=`<style>.ans2{background:#e5e7eb;color:#e5e7eb;border-radius:6px;padding:0 6px;user-select:none}.ans2.rev{background:#dcfce7;color:#166534;font-weight:700}</style>`+h;REGEN=genSwA;genSwA()}
function genSwA(){const ky=$('ky').checked,sc=$('sch').value.trim();const R=rng(11);
 let h=dHead('स्वाध्याय (पाठ्यपुस्तकातील)','—',sc);const A=t=>`<span class="a">${t}</span>`;
 SWB.forEach(b=>{h+=`<div class="qh">${b.h}</div>`;
  if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qb"><div>${i+1}. ${it[0]} <b>( &nbsp;&nbsp; )</b></div><div class="opts">${it[1].map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div>${ky?`<div class="a">उत्तर : ${LET[it[2]]}) ${it[1][it[2]]}</div>`:''}</div>`).join('');
  else if(b.t=='qa')h+=b.items.map((it,i)=>b.lines>1?`<div class="qb">${i+1}. ${it[0]}${ky?`<div class="a"><pre>${it[1]}</pre></div>`:wl(b.lines)}</div>`:`<div class="qb">${i+1}. ${it[0]} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='match')h+=`<table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${b.L.map((x,i)=>`<tr><td>${i+1}) ${x} &nbsp;&nbsp; ( ${ky?A(LET[b.A[i]]):'&nbsp;&nbsp;'} )</td><td>${b.R[i]!=null?LET[i]+') '+b.R[i]:''}</td></tr>`).join('')}</table>`;
  else if(b.t=='table')h+=`<table class="w"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&typeof c=='object'?(ky?A(c.a):'&nbsp;<br>&nbsp;'):(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if(b.t=='order'){const idx=shuf(b.items.map((x,i)=>i),R);h+=idx.map((j,i)=>`<div class="qb">${i+1}. ${b.items[j]}</div>`).join('')+(ky?A('योग्य क्रम : '+b.items.map((x,i)=>idx.indexOf(i)+1).join(' → ')):wl(2))}
  else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qb"><img src="${IM[it[0]]}" style="height:30mm;border-radius:2mm"> ${i+1}. ${it[2]||''} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='concept')h+=`<div style="text-align:center"><b style="border:1.2px solid #000;padding:2px 10px">${b.center}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px">${b.leaves.map(x=>`<span style="border:1.2px solid #000;padding:6px 12px;min-width:30mm">${ky?A(x):'&nbsp;'}</span>`).join('')}</div></div>`;
  else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.t=='qb'||b.p)h+=''; });
 showPrev(h)}

let SB=401;
function sbData(seed){const R=rng(seed);const fb=shuf(FB,R).slice(0,6),mt=shuf(MT,R).slice(0,5),mtB=shuf(mt.map((x,i)=>[x[1],i]),R),tf=shuf(TF,R).slice(0,6),os=shuf(OS,R).slice(0,5),sa=shuf(SA,R).slice(0,3);return{fb,mt,mtB,tf,os,sa}}
function swB(b){b.innerHTML=`<div id="sbq"></div><div class="card" id="pdfp" style="display:none"><h2>🖨 अधिक स्वाध्याय – PDF</h2><div class="tool">${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;REGEN=()=>{genSwB()};renderSbq();genSwB()}
function newSb(){SB=1+Math.floor(Math.random()*99999);renderSbq();genSwB()}
function sbRev(id){$(id).classList.toggle('show')}
function sbTf(i,v,t,c,b){const ok=(v==t);b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');$('tf'+i).innerHTML=ok?`<span class="msg ok">🎉 बरोबर! ${t?'हे विधान बरोबर आहे.':'हे विधान चूक आहे. बरोबर : '+c}</span>`:`<span class="msg no">✘ पुन्हा विचार करा.</span>`}
function sbMt(){const d=sbData(SB);let ok=0;d.mt.forEach((x,i)=>{const s=$('sm'+i),good=LET[d.mtB.findIndex(y=>y[1]==i)];const g=s.value===good;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$('smm').innerHTML=ok==d.mt.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${d.mt.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function renderSbq(){const d=sbData(SB);let h=`<div class="card"><h2>✍️ अधिक स्वाध्याय · संच क्र. ${SB}</h2><button class="btn gr" onclick="newSb()">🎲 नवे प्रश्न</button></div>`;
 h+=`<div class="card"><h2>प्र.1 रिकाम्या जागा भरा.</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड्या जुळवा.</h2><table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">तपासा</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 बरोबर की चूक?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ बरोबर</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ चूक</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एका वाक्यात उत्तरे लिहा.</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 थोडक्यात उत्तरे लिहा.</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक स्वाध्याय',30,sc)+`<div class="ds">संच क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिकाम्या जागा भरा. (6 गुण)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड्या जुळवा. (5 गुण)</div><table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 खालील विधाने बरोबर की चूक ते लिहा. चूक असल्यास दुरुस्त करून लिहा. (6 गुण)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एका वाक्यात उत्तरे लिहा. (5 गुण)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 थोडक्यात उत्तरे लिहा. (8 गुण)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'बरोबर':'चूक – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक मुद्दे)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

/* ---------- 4. HOTS ---------- */
function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><h2>🧠 उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न</h2><p>पाठाच्या आशयावर आधारित पण पाठ्यपुस्तकाबाहेरील प्रश्न. स्वतः उत्तर लिहून मग ‘मार्गदर्शक मुद्दे’ पाहा.</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक मुद्दे:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्रिका (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न',n*3,sc)+`<div class="ds">संच क्र. ${seed} · स्वतःच्या शब्दांत सविस्तर उत्तरे लिहा.</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 गुण)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक मुद्दे (शिक्षकांसाठी) – संच ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}

document.title=L.name;$('hdr').textContent=L.name;
const h0=location.hash.replace('#','');if(['learn','mcq','sw','hots'].includes(h0))view=h0;
draw();
