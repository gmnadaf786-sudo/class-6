:700;background:#f8fafc}\ntable.t tr.hi td{background:#fef9c3}\ninput.n{width:70px;font:inherit;font-size:17px;text-align:center;padding:5px;border:2px solid #94a3b8;border-radius:8px}\n.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}\n.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}\n.say{float:right;border:0;background:#eff6ff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}\n.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}\n.big{font-size:22px;font-weight:800;text-align:center}\ninput[type=range]{width:100%}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<div id=\"stepBox\"><\/div>\n<\/div>\n<script>\n/* ---------- common ---------- */\nfunction say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;\n const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}\nconst C='#1e293b',BL='#2563eb',RD='#dc2626',GR='#16a34a',OR='#ea580c';\nconst f=v=>(+v).toFixed(1);\nfunction ah(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),L=12,W=6;const bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a);\n return `<polygon points=\"${f(x2)},${f(y2)} ${f(bx-W*Math.sin(a))},${f(by+W*Math.cos(a))} ${f(bx+W*Math.sin(a))},${f(by-W*Math.cos(a))}\" fill=\"${col||C}\"/>`}\nfunction ln(x1,y1,x2,y2,o){o=o||{};const col=o.c||C;let s=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${col}\" stroke-width=\"${o.w||3}\" stroke-linecap=\"round\"${o.d?' stroke-dasharray=\"6 5\"':''}/>`;\n if(o.e)s+=ah(x1,y1,x2,y2,col);if(o.s)s+=ah(x2,y2,x1,y1,col);return s}\nfunction dot(x,y,lab,dx,dy,col){return `<circle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"5\" fill=\"${col||C}\"/>`+(lab?`<text x=\"${f(x+(dx||0))}\" y=\"${f(y+(dy==null?-10:dy))}\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${col||C}\">${lab}<\/text>`:'')}\nconst svg=(w,h,inner,pw)=>`<svg viewBox=\"0 0 ${w} ${h}\" width=\"${pw||w}\">${inner}<\/svg>`;\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}\nfunction shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\n\n/* ---------- steps : संख्यांच्या जगात ---------- */\nlet S=0;const SN=7;\nconst st={pv:null,pvm:'',pvq:null,cmp:null,cmpm:'',cmph:false,ad:null,adk:0,cl:null,clm:'',nl:3,nlq:null,nlm:'',a:-3,b:5,op:'+',pr:null,prm:'',hint:false};\nfunction sx(t){return `<button class=\"say\" onclick=\"say(this.dataset.t)\" data-t=\"${t.replace(/\"/g,'&quot;')}\">🗣 ऐका<\/button>`}\nfunction nav(){return `<div class=\"nav\"><button class=\"btn ln\" ${S==0?'disabled':''} onclick=\"go(-1)\">◀ मागे<\/button><span class=\"step\">${S+1} / ${SN}<\/span><button class=\"btn\" ${S==SN-1?'disabled':''} onclick=\"go(1)\">पुढे ▶<\/button><\/div>`}\nfunction go(d){S=Math.max(0,Math.min(SN-1,S+d));drawStep();try{window.parent.document.getElementById('sf').scrollIntoView()}catch(x){}}\nfunction drawStep(){document.getElementById('stepBox').innerHTML=[s0,s1,s2,s3,s4,s5,s6][S]()+nav()}\nconst ind=n=>{const neg=n<0;let s=String(Math.abs(n));if(s.length>3){const l=s.slice(-3);let r=s.slice(0,-3);r=r.replace(/\\B(?=(\\d{2})+(?!\\d))/g,',');s=r+','+l}return (neg?'−':'')+s};\nconst intl=n=>(n<0?'−':'')+String(Math.abs(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g,',');\nconst sg=n=>n<0?`(−${-n})`:String(n);\nconst PI=['एकक','दशक','शतक','हजार','दशहजार','लाख','दशलाख','कोटी','दशकोटी'];\nconst PW=['Ones','Tens','Hundreds','Thousand','Ten Th.','Hundred Th.','Million','Ten M.','Hundred M.'];\n\n/* पायरी 1 : स्थानिक किंमत, भारतीय व आंतरराष्ट्रीय पद्धत */\nfunction newPV(){const d=rnd(7,9);let s=String(rnd(1,9));for(let i=1;i<d;i++)s+=rnd(0,9);st.pv=s;const k=rnd(0,d-1);st.pvq=k;st.pvm=''}\nfunction s0(){if(!st.pv)newPV();const s=st.pv,d=s.length,n=+s,t='मोठ्या संख्या वाचताना भारतीय पद्धतीत एकक, हजार, लाख, कोटी असे गट पाडतात. आंतरराष्ट्रीय पद्धतीत तीन तीन अंकांचे गट पाडतात – हजार, मिलियन.';\n const cols=[...Array(d)].map((_,i)=>d-1-i);\n const k=st.pvq,dig=s[d-1-k];\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 1<\/div><h2>मोठ्या संख्या : स्थानिक किंमत<\/h2>\n <div class=\"big\">${ind(n)}<\/div>\n <div style=\"overflow-x:auto\"><table class=\"t\" style=\"font-size:12px;table-layout:fixed;min-width:300px\"><tr>${cols.map(i=>`<th style=\"padding:3px 1px;${i==k?'background:#fde68a':''}\">${PI[i]}<\/th>`).join('')}<\/tr>\n <tr>${cols.map(i=>`<td style=\"font-size:20px;font-weight:800;${i==k?'background:#fef9c3;color:#b45309':''}\">${s[d-1-i]}<\/td>`).join('')}<\/tr>\n <tr>${cols.map(i=>`<td style=\"font-size:9px;color:#64748b;padding:2px\">${PW[i]}<\/td>`).join('')}<\/tr><\/table><\/div>\n <div class=\"key\"><b>भारतीय पद्धत :<\/b> ${ind(n)} &nbsp; (उजवीकडून 3, मग 2-2 अंकांचे गट)<br><b>आंतरराष्ट्रीय पद्धत :<\/b> ${intl(n)} &nbsp; (3-3 अंकांचे गट)<br>1 लाख = 100 हजार · 10 लाख = 1 मिलियन · 1 कोटी = 10 मिलियन<\/div>\n <b>🧩 स्वतः तपासा:<\/b> पिवळ्या स्तंभातील अंक <b>${dig}<\/b> ची स्थानिक किंमत किती?\n <div><input class=\"n\" id=\"pva\" style=\"width:150px\" inputmode=\"numeric\"> <button class=\"btn gr\" onclick=\"chkPV()\">तपासा<\/button><\/div><div>${st.pvm}<\/div>\n <button class=\"btn ln\" onclick=\"newPV();drawStep()\">🔄 नवी संख्या<\/button><\/div>`}\nfunction chkPV(){const s=st.pv,k=st.pvq,dig=+s[s.length-1-k],ans=dig*10**k;const v=+document.getElementById('pva').value.replace(/[, ]/g,'');\n st.pvm=v===ans?`<div class=\"msg ok\">✔ बरोबर! ${dig} × ${ind(10**k)} = ${ind(ans)} (${PI[k]} स्थान)<\/div>`:`<div class=\"msg no\">✘ नाही. अंक × स्थानाची किंमत (${PI[k]} = ${ind(10**k)}) करून पाहा.<\/div>`;drawStep()}\n\n/* पायरी 2 : लहान-मोठेपणा */\nfunction newCmp(){const d=rnd(5,8);let a=String(rnd(1,9));for(let i=1;i<d;i++)a+=rnd(0,9);let b;\n const r=Math.random();if(r<.25){b=String(rnd(1,9));for(let i=1;i<d-1;i++)b+=rnd(0,9)}else if(r<.35)b=a;else{const p=rnd(0,d-1);b=a.slice(0,p)+((+a[p]+rnd(1,9))%10)+a.slice(p+1);if(b[0]=='0')b='1'+b.slice(1)}\n if(Math.random()<.5)[a,b]=[b,a];st.cmp=[a,b];st.cmpm='';st.cmph=false}\nfunction s1(){if(!st.cmp)newCmp();const [a,b]=st.cmp,t='ज्या संख्येत अंक जास्त ती संख्या मोठी. अंक सारखे असतील तर डावीकडून पहिला वेगळा अंक पाहा; जो मोठा ती संख्या मोठी.';\n let hint='';if(st.cmph){if(a.length!=b.length)hint=`अंकांची संख्या : ${a.length} आणि ${b.length}. जास्त अंक असलेली संख्या मोठी.`;\n  else{const p=[...a].findIndex((c,i)=>c!=b[i]);hint=p<0?'दोन्ही संख्या सारख्याच आहेत.':`अंक सारखे (${a.length}). डावीकडून ${p+1} वा अंक वेगळा : ${a[p]} आणि ${b[p]}.`}}\n const hl=(x,y)=>{const p=x.length==y.length?[...x].findIndex((c,i)=>c!=y[i]):-1;return [...x].map((c,i)=>st.cmph&&i==p?`<span style=\"background:#fde68a;border-radius:4px\">${c}<\/span>`:c).join('')};\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 2<\/div><h2>संख्यांचा लहान-मोठेपणा<\/h2>\n <div class=\"key\">1) जास्त अंक असलेली संख्या मोठी.<br>2) अंक सारखे असतील तर डावीकडून तुलना करा; पहिला वेगळा अंक जिथे मोठा ती संख्या मोठी.<br>3) संख्यारेषेवर उजवीकडची संख्या नेहमी मोठी.<\/div>\n <div class=\"big\" style=\"font-size:24px;letter-spacing:1px\">${hl(a,b)} &nbsp; ⬜ &nbsp; ${hl(b,a)}<\/div>\n <div class=\"chips\" style=\"justify-content:center\">${['>','<','='].map(c=>`<span class=\"chip\" style=\"font-size:22px;padding:6px 22px\" onclick=\"chkC('${c}')\">${c}<\/span>`).join('')}<\/div>\n <button class=\"btn or\" onclick=\"st.cmph=!st.cmph;drawStep()\">💡 मदत<\/button>${st.cmph?`<div class=\"msg in\">${hint}<\/div>`:''}<div>${st.cmpm}<\/div>\n <button class=\"btn ln\" onclick=\"newCmp();drawStep()\">🔄 नव्या संख्या<\/button><\/div>`}\nfunction chkC(c){const [a,b]=st.cmp,r=+a>+b?'>':+a<+b?'<':'=';st.cmpm=c==r?`<div class=\"msg ok\">✔ बरोबर! ${ind(+a)} ${r} ${ind(+b)}<\/div>`:'<div class=\"msg no\">✘ नाही. 💡 मदत पाहा.<\/div>';drawStep()}\n\n/* पायरी 3 : बेरीज-वजाबाकी (हातचा) */\nfunction newAd(){const op=Math.random()<.5?'+':'−';let a=rnd(100000,9999999),b=rnd(10000,999999);if(op=='−'&&b>a)[a,b]=[b,a];st.ad={a,b,op};st.adk=0}\nfunction s2(){if(!st.ad)newAd();const {a,b,op}=st.ad,t='एककापासून सुरुवात करा. बेरीज दहापेक्षा जास्त झाली तर हातचा पुढच्या स्तंभात न्या. वजाबाकीत वरचा अंक लहान असेल तर शेजारच्या स्थानाकडून दहा घ्या.';\n const res=op=='+'?a+b:a-b;const L=Math.max(String(a).length,String(res).length);const A=String(a).padStart(L,' '),B=String(b).padStart(L,' '),R=String(res).padStart(L,' ');\n const k=st.adk;let carry=Array(L).fill('');let msg='';\n // compute carries/borrows up to k columns\n let c=0;const ad=String(a).split('').reverse().map(Number),bd=String(b).split('').reverse().map(Number);\n for(let i=0;i<Math.min(k,L);i++){const x=ad[i]||0,y=bd[i]||0;\n  if(op=='+'){const s=x+y+c;if(i==k-1)msg=`${PI[i]||''} स्तंभ : ${x} + ${y}${c?' + '+c+' (हातचा)':''} = ${s}${s>9?` → ${s%10} लिहा, 1 हातचा पुढे`:''}`;c=s>9?1:0;if(c&&i+1<L)carry[L-2-i]='1'}\n  else{let x2=x-c;if(x2<y){if(i==k-1)msg=`${PI[i]||''} स्तंभ : ${x2} मधून ${y} जात नाहीत → 10 घेऊन ${x2+10} − ${y} = ${x2+10-y}`;c=1;carry[L-2-i]='−1'}else{if(i==k-1)msg=`${PI[i]||''} स्तंभ : ${x2} − ${y} = ${x2-y}`;c=0}}}\n const cell=(ch,cls)=>`<td style=\"width:30px;font-size:22px;font-weight:700;${cls||''}\">${ch.trim()}<\/td>`;\n const shown=R.split('').map((ch,i)=>i>=L-k?ch:' ');\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 3<\/div><h2>मोठ्या संख्यांची ${op=='+'?'बेरीज':'वजाबाकी'}<\/h2>\n <div class=\"chips\"><span class=\"chip ${op=='+'?'on':''}\" onclick=\"setOp('+')\">➕ बेरीज<\/span><span class=\"chip ${op=='−'?'on':''}\" onclick=\"setOp('−')\">➖ वजाबाकी<\/span><\/div>\n <div style=\"display:flex;justify-content:center\"><table style=\"border-collapse:collapse;text-align:center\">\n <tr>${carry.map(x=>`<td style=\"font-size:13px;color:${op=='+'?'#dc2626':'#2563eb'};font-weight:700;height:16px\">${x}<\/td>`).join('')}<td><\/td><\/tr>\n <tr>${A.split('').map(ch=>cell(ch)).join('')}<td><\/td><\/tr>\n <tr>${B.split('').map(ch=>cell(ch)).join('')}<td style=\"font-size:22px;font-weight:700;padding-left:6px\">${op}<\/td><\/tr>\n <tr>${shown.map((ch,i)=>cell(ch,'border-top:3px solid #1e293b;color:#15803d')).join('')}<td><\/td><\/tr><\/table><\/div>\n ${msg?`<div class=\"msg in\">${msg}<\/div>`:'<div class=\"msg in\">‘पुढचा स्तंभ’ दाबा – एककापासून सुरुवात.<\/div>'}\n ${k>=L?`<div class=\"msg ok\">🎉 उत्तर : ${ind(a)} ${op} ${ind(b)} = <b>${ind(res)}<\/b><\/div>`:''}\n <button class=\"btn\" ${k>=L?'disabled':''} onclick=\"st.adk++;drawStep()\">▶ पुढचा स्तंभ<\/button><button class=\"btn ln\" onclick=\"newAd();drawStep()\">🔄 नवे उदाहरण<\/button>\n <div class=\"key\">वहीत मांडताना एककाखाली एकक, दशकाखाली दशक असे अंक बरोबर स्तंभात लिहा.<\/div><\/div>`}\n\nfunction setOp(o){do{newAd()}while(st.ad.op!=o);drawStep()}\n\n/* पायरी 4 : नैसर्गिक, पूर्ण, पूर्णांक संख्या */\nconst CLS=['नैसर्गिक संख्या','पूर्ण संख्या (0 सह)','फक्त पूर्णांक (ऋण)'];\nfunction newCl(){const pool=shuf([0,1,7,25,100,-1,-4,-12,-50,3,0,-8]).slice(0,6);st.cl=pool.map(n=>({n,a:n>0?0:n==0?1:2,d:null}));st.clm=''}\nfunction s3(){if(!st.cl)newCl();const t='एक, दोन, तीन अशा मोजण्याच्या संख्या नैसर्गिक संख्या. नैसर्गिक संख्या आणि शून्य मिळून पूर्ण संख्या. धन संख्या, शून्य आणि ऋण संख्या मिळून पूर्णांक.';\n const ring=`<svg viewBox=\"0 0 300 190\" width=\"300\"><ellipse cx=\"150\" cy=\"95\" rx=\"145\" ry=\"90\" fill=\"#dbeafe\" stroke=\"#1d4ed8\" stroke-width=\"2\"/><ellipse cx=\"185\" cy=\"105\" rx=\"100\" ry=\"62\" fill=\"#dcfce7\" stroke=\"#15803d\" stroke-width=\"2\"/><ellipse cx=\"205\" cy=\"112\" rx=\"68\" ry=\"40\" fill=\"#fef9c3\" stroke=\"#b45309\" stroke-width=\"2\"/>\n <text x=\"22\" y=\"70\" font-size=\"13\" font-weight=\"700\" fill=\"#1d4ed8\">पूर्णांक<\/text><text x=\"22\" y=\"96\" font-size=\"14\" fill=\"#1d4ed8\">…, −3, −2, −1<\/text>\n <text x=\"100\" y=\"80\" font-size=\"13\" font-weight=\"700\" fill=\"#15803d\">पूर्ण संख्या<\/text><text x=\"110\" y=\"118\" font-size=\"16\" fill=\"#15803d\">0<\/text>\n <text x=\"160\" y=\"100\" font-size=\"13\" font-weight=\"700\" fill=\"#b45309\">नैसर्गिक<\/text><text x=\"160\" y=\"124\" font-size=\"14\" fill=\"#b45309\">1, 2, 3, …<\/text><\/svg>`;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 4<\/div><h2>नैसर्गिक, पूर्ण संख्या आणि पूर्णांक<\/h2>\n <div class=\"fig\">${ring}<\/div>\n <div class=\"key\">• <b>नैसर्गिक संख्या<\/b> : 1, 2, 3, … (सर्वांत लहान 1)<br>• <b>पूर्ण संख्या<\/b> : 0, 1, 2, 3, … (सर्वांत लहान 0)<br>• <b>पूर्णांक<\/b> : …, −3, −2, −1, 0, 1, 2, 3, …<br>सर्व नैसर्गिक संख्या पूर्ण संख्या आहेत; पण 0 नैसर्गिक संख्या नाही.<\/div>\n <b>🗂 वर्गीकरण करा:<\/b> प्रत्येक संख्येसाठी <u>सर्वांत लहान योग्य गट<\/u> निवडा.\n ${st.cl.map((x,i)=>`<div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;padding:4px 8px;border-radius:10px;background:${x.d==null?'#f8fafc':x.d==x.a?'#dcfce7':'#fee2e2'}\"><b style=\"min-width:44px;font-size:20px\">${x.n<0?'−'+(-x.n):x.n}<\/b>${CLS.map((c,j)=>`<span class=\"chip ${x.d==j?'on':''}\" style=\"font-size:14px;padding:5px 10px\" onclick=\"st.cl[${i}].d=${j};drawStep()\">${c}<\/span>`).join('')}<\/div>`).join('')}\n ${st.cl.every(x=>x.d===x.a)?'<div class=\"msg ok\">🎉 सर्व बरोबर!<\/div>':''}\n <button class=\"btn ln\" onclick=\"newCl();drawStep()\">🔄 नव्या संख्या<\/button><\/div>`}\n\n/* पायरी 5 : संख्यारेषा, धन-ऋण, विरुद्ध संख्या */\nfunction nline(o){o=o||{};const W=320,y=60,u=W/24,X=v=>W/2+v*u;let g=ln(4,y,W-4,y,{e:1,s:1,w:2.5});\n for(let v=-10;v<=10;v++){g+=`<line x1=\"${f(X(v))}\" y1=\"${y-6}\" x2=\"${f(X(v))}\" y2=\"${y+6}\" stroke=\"${C}\" stroke-width=\"${v==0?2.5:1.5}\"/>`;if(v%2==0||o.all)g+=`<text x=\"${f(X(v))}\" y=\"${y+24}\" font-size=\"${o.all?9:11}\" text-anchor=\"middle\" fill=\"${v<0?RD:v>0?GR:C}\">${v<0?'−'+(-v):v}<\/text>`;\n  if(o.click)g+=`<rect x=\"${f(X(v)-u/2)}\" y=\"${y-22}\" width=\"${f(u)}\" height=\"50\" fill=\"transparent\" style=\"cursor:pointer\" onclick=\"${o.click}(${v})\"/>`}\n g+=`<text x=\"${f(X(-5))}\" y=\"${y-30}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${RD}\" font-weight=\"700\">← ऋण संख्या<\/text><text x=\"${f(X(5))}\" y=\"${y-30}\" font-size=\"12\" text-anchor=\"middle\" fill=\"${GR}\" font-weight=\"700\">धन संख्या →<\/text>`;\n (o.pts||[]).forEach(p=>g+=`<circle cx=\"${f(X(p[0]))}\" cy=\"${y}\" r=\"7\" fill=\"${p[1]}\" stroke=\"#fff\" stroke-width=\"2\"/>`);\n if(o.extra)g+=o.extra(X,y);\n return svg(W,o.H||100,g,o.pw||340)}\nfunction s4(){const v=st.nl,t='शून्याच्या उजवीकडील संख्या धन संख्या आणि डावीकडील संख्या ऋण संख्या. शून्यापासून समान अंतरावर पण विरुद्ध बाजूंना असणाऱ्या संख्या एकमेकींच्या विरुद्ध संख्या. शून्य धनही नाही आणि ऋणही नाही.';\n if(st.nlq==null)st.nlq=rnd(-9,9);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 5<\/div><h2>संख्यारेषा : धन, ऋण व विरुद्ध संख्या<\/h2>\n <div>संख्यारेषेवर कोणत्याही खुणेवर टिचकी मारा:<\/div>\n <div class=\"fig\">${nline({click:'pickNL',pts:v?[[v,BL],[-v,OR]]:[[0,BL]],extra:(X,y)=>v?`<path d=\"M${f(X(0))},${y-8} Q${f(X(v/2))},${y-40} ${f(X(v))},${y-8}\" fill=\"none\" stroke=\"${BL}\" stroke-dasharray=\"4 3\"/><path d=\"M${f(X(0))},${y-8} Q${f(X(-v/2))},${y-40} ${f(X(-v))},${y-8}\" fill=\"none\" stroke=\"${OR}\" stroke-dasharray=\"4 3\"/>`:''})}<\/div>\n <div class=\"key\" style=\"font-size:18px\">${v==0?'<b>0<\/b> : शून्य धनही नाही, ऋणही नाही. 0 ची विरुद्ध संख्या 0.':`<b style=\"color:${BL}\">${v<0?'−'+(-v):v}<\/b> ही ${v>0?'धन':'ऋण'} संख्या. ती 0 पासून ${Math.abs(v)} एकक ${v>0?'उजवीकडे':'डावीकडे'} आहे.<br>तिची विरुद्ध संख्या : <b style=\"color:${OR}\">${-v<0?'−'+v:-v}<\/b> &nbsp; (${sg(v)} + ${sg(-v)} = 0)`}<\/div>\n <div class=\"key\">• विरुद्ध संख्यांची <b>बेरीज शून्य<\/b> असते.<br>• संख्यारेषेवर उजवीकडची संख्या मोठी : −2 &gt; −7, 0 &gt; −1.<\/div>\n <b>🧩 स्वतः तपासा:<\/b> संख्यारेषेवर <b>${st.nlq<0?'−'+(-st.nlq):st.nlq}<\/b> कोठे आहे? <button class=\"chip\" style=\"margin-left:6px\" onclick=\"st.nlmode=1;drawStep()\">उत्तर देण्यासाठी येथे टिचकी मारा, मग रेषेवर निवडा<\/button>\n ${st.nlmode?`<div class=\"fig\">${nline({click:'ansNL',pts:st.nlg!=null?[[st.nlg,st.nlg==st.nlq?GR:RD]]:[]})}<\/div>`:''}<div>${st.nlm}<\/div><\/div>`}\nfunction pickNL(v){st.nl=v;drawStep()}\nfunction ansNL(v){st.nlg=v;if(v==st.nlq){st.nlm=`<div class=\"msg ok\">🎉 बरोबर! <button class=\"btn ln\" onclick=\"st.nlq=rnd(-9,9);st.nlg=null;st.nlm='';drawStep()\">🔄 दुसरी संख्या<\/button><\/div>`}else st.nlm='<div class=\"msg no\">✘ नाही. ऋण संख्या 0 च्या डावीकडे, धन उजवीकडे.<\/div>';drawStep()}\n\n/* पायरी 6 : पूर्णांकांची बेरीज-वजाबाकी संख्यारेषेवर */\nfunction s5(){const {a,b,op}=st,t='धन संख्या मिळवताना उजवीकडे आणि ऋण संख्या मिळवताना डावीकडे जा. एखादी संख्या वजा करणे म्हणजे तिची विरुद्ध संख्या मिळवणे.';\n const bb=op=='+'?b:-b,res=a+bb;\n const extra=(X,y)=>{let g=`<circle cx=\"${f(X(a))}\" cy=\"${y}\" r=\"6\" fill=\"${BL}\"/>`;const stp=bb>0?1:-1;let cur=a;\n  for(let i=0;i<Math.abs(bb);i++){const n=cur+stp;if(Math.abs(n)<=11)g+=`<path d=\"M${f(X(cur))},${y-6} Q${f((X(cur)+X(n))/2)},${y-28} ${f(X(n))},${y-6}\" fill=\"none\" stroke=\"${OR}\" stroke-width=\"2\"/>`;cur=n}\n  if(Math.abs(res)<=10)g+=`<circle cx=\"${f(X(res))}\" cy=\"${y}\" r=\"7\" fill=\"${GR}\" stroke=\"#fff\" stroke-width=\"2\"/>`;return g};\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 6<\/div><h2>पूर्णांकांची बेरीज व वजाबाकी<\/h2>\n <div>पहिली संख्या a = <b>${sg(a)}<\/b><\/div><input type=\"range\" min=\"-8\" max=\"8\" value=\"${a}\" oninput=\"st.a=+this.value;drawStep()\">\n <div class=\"chips\"><span class=\"chip ${op=='+'?'on':''}\" onclick=\"st.op='+';drawStep()\">➕ मिळवा<\/span><span class=\"chip ${op=='−'?'on':''}\" onclick=\"st.op='−';drawStep()\">➖ वजा करा<\/span><\/div>\n <div>दुसरी संख्या b = <b>${sg(b)}<\/b><\/div><input type=\"range\" min=\"-8\" max=\"8\" value=\"${b}\" oninput=\"st.b=+this.value;drawStep()\">\n <div class=\"fig\">${nline({all:1,extra,H:95})}<\/div>\n <div class=\"big\">${sg(a)} ${op} ${sg(b)} ${op=='−'?`= ${sg(a)} + ${sg(-b)} `:''}= <span style=\"color:#15803d\">${sg(res)}<\/span><\/div>\n <div class=\"msg in\">🔵 ${sg(a)} पासून सुरुवात → ${Math.abs(bb)} उड्या ${bb>=0?'उजवीकडे ▶':'◀ डावीकडे'} → 🟢 ${sg(res)}<\/div>\n <div class=\"key\">• धन मिळवा → उजवीकडे; ऋण मिळवा → डावीकडे.<br>• <b>वजाबाकी = विरुद्ध संख्येची बेरीज<\/b> : 7 − (−3) = 7 + 3 = 10.<br>• दोन्ही ऋण : (−4) + (−5) = −9 (बेरीज करून ऋण चिन्ह).<br>• चिन्ह वेगळे : मोठ्यातून लहान वजा करा, मोठ्या संख्येचे चिन्ह द्या : (−7) + 2 = −5.<\/div><\/div>`}\n\n/* पायरी 7 : आता तुम्ही सोडवा */\nfunction newPr(){const a=rnd(-30,30)||5,b=rnd(-30,30)||-4,op=Math.random()<.5?'+':'−';st.pr={a,b,op,r:op=='+'?a+b:a-b};st.prm='';st.hint=false}\nfunction s6(){if(!st.pr)newPr();const p=st.pr,t='पूर्णांकांची बेरीज किंवा वजाबाकी करा.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 7<\/div><h2>आता तुम्ही सोडवा<\/h2>\n <div class=\"big\" style=\"font-size:26px\">${sg(p.a)} ${p.op} ${sg(p.b)} = <input class=\"n\" id=\"pra\" style=\"width:90px;font-size:22px\" inputmode=\"text\" placeholder=\"?\"><\/div>\n <div class=\"msg in\" style=\"font-weight:400\">ऋण उत्तरासाठी आधी − (वजा) चिन्ह टाइप करा. उदा. -12<\/div>\n <button class=\"btn gr\" onclick=\"chkPr()\">तपासा<\/button><button class=\"btn or\" onclick=\"st.hint=!st.hint;drawStep()\">💡 मदत<\/button>\n ${st.hint?`<div class=\"key\">${p.op=='−'?`वजाबाकी = विरुद्ध संख्येची बेरीज : ${sg(p.a)} − ${sg(p.b)} = ${sg(p.a)} + ${sg(-p.b)}<br>`:''}${(()=>{const x=p.a,y=p.op=='+'?p.b:-p.b;return (x<0)==(y<0)?`दोन्ही संख्यांचे चिन्ह सारखे → ${Math.abs(x)} + ${Math.abs(y)} करून तेच चिन्ह द्या.`:`चिन्ह वेगळे → मोठ्या संख्येतून लहान वजा करा (${Math.max(Math.abs(x),Math.abs(y))} − ${Math.min(Math.abs(x),Math.abs(y))}), मोठ्या संख्येचे चिन्ह द्या.`})()}<\/div>`:''}\n <div>${st.prm}<\/div><button class=\"btn ln\" onclick=\"newPr();drawStep()\">🔄 दुसरा प्रश्न<\/button><\/div>`}\nfunction chkPr(){const raw=document.getElementById('pra').value.trim().replace('−','-').replace(/[()]/g,'');const v=raw===''?NaN:+raw;const p=st.pr;\n st.prm=v===p.r?`<div class=\"msg ok\">🎉 बरोबर! ${sg(p.a)} ${p.op} ${sg(p.b)} = ${sg(p.r)}<\/div>`:'<div class=\"msg no\">✘ अजून नाही. 💡 मदत पाहा किंवा मागच्या पायरीतील संख्यारेषा वापरा.<\/div>';\n const keep=document.getElementById('pra').value;drawStep();document.getElementById('pra').value=keep}\n\ndrawStep();\n<\/script>\n<\/body>\n<\/html>\n";
const L={name:'पाठ 3 : संख्यांच्या जगात',cls:'इयत्ता : 6वी &nbsp; विषय : गणित',foot:'इ. 6वी गणित · पाठ 3'};
const SYM=[];const symGrid2=()=>'';
const SECS=[{t:'शिकू या',bare:1,say:'',h:()=>{setTimeout(()=>{const f=document.getElementById('sf');if(f&&!f.dataset.l){f.dataset.l=1;f.onload=()=>{try{const d=f.contentDocument;const st=d.createElement('style');st.textContent='html,body{min-height:0!important;height:auto!important}';d.head.appendChild(st);const fit=()=>{try{const w=d.querySelector('.wrap');const h=Math.ceil(w.getBoundingClientRect().bottom+d.defaultView.scrollY)+10;if(Math.abs(f.offsetHeight-h)>4)f.style.height=h+'px'}catch(e){}};fit();setInterval(fit,300)}catch(e){}};f.srcdoc=SCI}},50);return `<iframe id="sf" title="शिकू या" scrolling="no" style="width:100%;height:600px;border:0;background:#fff;display:block"></iframe>`}}];

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,R){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sx=t=>`<button class="say" onclick="say(this.dataset.t)" data-t="${esc(t).replace(/"/g,'&quot;')}">🗣 ऐका</button>`;
const LET=['अ','ब','क','ड','इ'];
let view='home';
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}draw();window.scrollTo({top:0})}
function draw(){const m=$('main');({home:vHome,learn:vLearn,mcq:vMcq,sw:vSw,hots:vHots}[view]||vHome)(m)}

/* ---------- home ---------- */
function vHome(m){m.innerHTML=`<div class="grid">
<button class="hc" onclick="go('learn')"><div class="ic">📖</div><h2>1. शिकू या</h2><p>पायरी-पायरीने पाठ समजून घ्या – कृतीसह, स्वतः तपासा</p></button>
<button class="hc" onclick="go('mcq')"><div class="ic">❓</div><h2>2. MCQ प्रश्न</h2><p>बहुपर्यायी सराव + A4 PDF (उत्तरसूचीसह)</p></button>
<button class="hc" onclick="go('sw')"><div class="ic">✍️</div><h2>3. स्वाध्याय</h2><p>अ) पुस्तकातील · ब) अधिक (पुस्तकाबाहेरील) – PDF</p></button>
<button class="hc" onclick="go('hots')"><div class="ic">🧠</div><h2>4. उपयोजनात्मक / HOTS</h2><p>विचार करायला लावणारे प्रश्न – PDF</p></button></div>`}

/* ---------- widgets ---------- */
const symGrid=()=>`<div class="sg">${SYM.map(s=>`<div class="sc" onclick="this.classList.toggle('on')"><div class="sy">${s[0]}</div><div class="sf">❓ कोणता धर्म?<br><small>(टिचकी मारा)</small></div><div class="sb"><b>${s[1]}</b><br><small>${s[2]}</small></div></div>`).join('')}</div>`;
const phGrid=(ks)=>`<div class="sg">${ks.map(k=>`<div class="sc" onclick="this.classList.toggle('on')"><img src="${IM[k[0]]}" style="width:100%;border-radius:8px"><div class="sf" style="font-size:13px">❓ हे काय आहे?</div><div class="sb"><b>${k[1]}</b></div></div>`).join('')}</div>`;
const qimg=k=>`<img src="${IM[k]}" style="width:100%;max-width:300px;border-radius:10px;display:block;margin:6px 0">`;
let WID=0;
function chipsInfo(items){const id='ci'+(++WID);return `<div class="chips" id="${id}c">${items.map((x,i)=>`<button class="chip" onclick="ci('${id}',${i})">${x[0]}</button>`).join('')}</div><div class="info" id="${id}">👆 एखाद्या शब्दावर टिचकी मारा.</div>`+`<script type="text/plain" id="${id}d">${esc(JSON.stringify(items.map(x=>x[1])))}<\/script>`}
function ci(id,i){const d=JSON.parse($(id+'d').textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'));$(id).innerHTML=d[i];[...$(id+'c').children].forEach((c,j)=>c.classList.toggle('on',i==j))}
const flip=(q,a)=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="fq">❓ ${q}</div><div class="fa">✔ ${a}</div></div>`;
function mini(q,opts,ans,why){const id='mq'+(++WID);return `<div class="mini" id="${id}"><b>🧩 स्वतः तपासा:</b> ${q}${opts.map((o,i)=>`<button class="opt" onclick="mqa('${id}',this,${i==ans},'${esc(why).replace(/'/g,"\\'")}')">${o}</button>`).join('')}<div class="mm"></div></div>`}
function mqa(id,b,ok,why){const box=$(id);if(box.dataset.done)return;b.classList.add(ok?'ok':'no');const mm=box.querySelector('.mm');
 if(ok){box.dataset.done=1;mm.innerHTML=`<div class="msg ok">🎉 बरोबर! ${why}</div>`;LS.pts++;updProg()}else mm.innerHTML='<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>'}
function ordGame(title,items){const id='og'+(++WID);const R=rng(7+WID);const sh=shuf(items.map((x,i)=>[x,i]),R);
 return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🔢 ${title}</b><div class="ord">${sh.map(([x,i])=>`<button class="opt" data-i="${i}" onclick="ogc('${id}',this)">${x}</button>`).join('')}</div><div class="mm">क्रमाने एकेक घटना निवडा.</div></div>`}
function ogc(id,b){const box=$(id);let k=+box.dataset.k;if(b.classList.contains('ok'))return;const mm=box.querySelector('.mm');
 if(+b.dataset.i===k){b.classList.add('ok');b.innerHTML=(k+1)+'. '+b.innerHTML;box.dataset.k=++k;mm.innerHTML=k==box.dataset.n?'<div class="msg ok">🎉 सर्व क्रम बरोबर!</div>':'<div class="msg in">बरोबर! पुढची घटना कोणती?</div>';if(k==box.dataset.n){LS.pts++;updProg()}}
 else mm.innerHTML='<div class="msg no">✘ ही घटना आता नाही. विचार करून पुन्हा निवडा.</div>'}


function sortGame(title,items,cats){const id='sg'+(++WID);return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🗂 ${title}</b>${items.map((x,i)=>`<div class="qcard" id="${id}_${i}"><div>${x[0]}</div><div class="chips">${cats.map((c,j)=>`<button class="chip" onclick="sgc('${id}',${i},${j},${x[1]})">${c}</button>`).join('')}</div></div>`).join('')}<div class="mm"></div></div>`}
function sgc(id,i,j,right){const r=$(id+'_'+i);if(r.dataset.d)return;const box=$(id);if(j==right){r.dataset.d=1;r.style.background='#dcfce7';r.querySelectorAll('.chip').forEach((c,k)=>{c.disabled=true;c.classList.toggle('on',k==j)});box.dataset.k=+box.dataset.k+1;LS.pts++;updProg();if(box.dataset.k==box.dataset.n)box.querySelector('.mm').innerHTML='<div class="msg ok">🎉 सर्व बरोबर!</div>'}else{r.style.background='#fee2e2';setTimeout(()=>{if(!r.dataset.d)r.style.background=''},700)}}
function matchSel(title,rows,opts){const id='ms'+(++WID);return `<div class="mini" id="${id}"><b>🧩 ${title}</b><table class="t">${rows.map((r,i)=>`<tr><td style="text-align:left">${r[0]}</td><td><select id="${id}_${i}"><option value="">–</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</table><button class="btn gr" onclick="msc('${id}',${esc(JSON.stringify(rows.map(r=>r[1]))).replace(/"/g,'&quot;')})">तपासा</button><div class="mm"></div></div>`}
function msc(id,ans){let ok=0;ans.forEach((a,i)=>{const s=$(id+'_'+i),g=s.value==a;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(id).querySelector('.mm').innerHTML=ok==ans.length?'<div class="msg ok">🎉 सर्व बरोबर!</div>':`<div class="msg in">${ok}/${ans.length} बरोबर. लाल रंगाची उत्तरे बदला.</div>`;if(ok==ans.length){LS.pts++;updProg()}}

/* ---------- नागरिकशास्त्र विशेष widgets ---------- */
function scen(title,sit,opts){const id='sc'+(++WID);return `<div class="mini" id="${id}"><b>🎭 ${title}</b><div class="key" style="margin:6px 0">${sit}</div>${opts.map((o,i)=>`<button class="opt" onclick="scc('${id}',this,${o[1]},'${esc(o[2]).replace(/'/g,"\\'")}')">${o[0]}</button>`).join('')}<div class="mm">तुम्ही काय कराल? एक पर्याय निवडा.</div></div>`}
function scc(id,b,good,why){const box=$(id);if(box.dataset.done)return;b.classList.add(good?'ok':'no');const mm=box.querySelector('.mm');mm.innerHTML=`<div class="msg ${good?'ok':'no'}">${good?'🎉 योग्य निर्णय!':'⚠ विचार करा.'} ${why}</div>`;if(good){box.dataset.done=1;LS.pts++;updProg()}}
function cloze(title,text,ans,bank){const id='cz'+(++WID);let k=0;const h=text.replace(/___/g,()=>{const i=k++;return `<select id="${id}_${i}" style="font:inherit;padding:2px;border-radius:6px"><option value="">____</option>${bank.map(o=>`<option>${o}</option>`).join('')}</select>`});
 return `<div class="mini" id="${id}"><b>✍ ${title}</b><div style="line-height:2.1;margin:8px 0">${h}</div><button class="btn gr" onclick="czc('${id}',${esc(JSON.stringify(ans)).replace(/"/g,'&quot;')})">तपासा</button><div class="mm"></div></div>`}

 h+=`<div class="card"><h2>प्र.1 रिकाम्या जागा भरा.</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड्या जुळवा.</h2><table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">तपासा</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 बरोबर की चूक?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ बरोबर</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ चूक</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एका वाक्यात उत्तरे लिहा.</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 थोडक्यात उत्तरे लिहा.</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक स्वाध्याय',30,sc)+`<div class="ds">संच क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिकाम्या जागा भरा. (6 गुण)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड्या जुळवा. (5 गुण)</div><table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 खालील विधाने बरोबर की चूक ते लिहा. चूक असल्यास दुरुस्त करून लिहा. (6 गुण)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एका वाक्यात उत्तरे लिहा. (5 गुण)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 थोडक्यात उत्तरे लिहा. (8 गुण)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'बरोबर':'चूक – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक मुद्दे)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><h2>🧠 उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न</h2><p>पाठाच्या आशयावर आधारित पण पाठ्यपुस्तकाबाहेरील प्रश्न. स्वतः उत्तर लिहून मग ‘मार्गदर्शक मुद्दे’ पाहा.</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक मुद्दे:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्रिका (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न',n*3,sc)+`<div class="ds">संच क्र. ${seed} · स्वतःच्या शब्दांत सविस्तर उत्तरे लिहा.</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 गुण)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक मुद्दे (शिक्षकांसाठी) – संच ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}
