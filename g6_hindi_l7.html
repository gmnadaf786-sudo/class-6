<!DOCTYPE html>
<html lang="hi">
<head>

<title>हिंदी</title>
<style>
:root{--b:#7c2d12;--b2:#c2410c;--g:#15803d;--bl:#1d4ed8;--bg:#fff7ed;--ink:#1c1917;--mut:#78716c;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:linear-gradient(135deg,#9a3412,#c2410c 55%,#b45309);color:#fff;padding:14px 14px 12px}
header h1{margin:0;font-size:20px;line-height:1.3}header small{opacity:.92}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.hc{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 8px #0002;cursor:pointer;border:2px solid transparent;text-align:left;font:inherit;color:inherit}
.hc:active{transform:scale(.98)}.hc:hover{border-color:var(--b2)}
.hc .ic{font-size:34px}.hc h2{margin:4px 0 2px;font-size:20px;color:var(--b)}.hc p{margin:0;color:var(--mut);font-size:14.5px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 6px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:var(--b)}
.card h3{margin:10px 0 4px;font-size:17px;color:var(--b2)}
.back{border:0;background:#fed7aa;color:#7c2d12;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:0 0 10px}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;background:var(--b2);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
.btn.gr{background:var(--g)}.btn.bl{background:var(--bl)}.btn.ln{background:#e7e5e4;color:#292524}.btn:disabled{opacity:.4}

.chip.on{background:#fff;border-color:var(--b2)}
.info{background:#fef3c7;border-left:5px solid #f59e0b;border-radius:8px;padding:8px 10px;margin:6px 0;min-height:44px}
.key{background:#ecfccb;border-left:5px solid #65a30d;border-radius:8px;padding:8px 10px;margin:8px 0}
.say{float:right;border:0;background:#ffedd5;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}
.prog{height:8px;background:#fed7aa;border-radius:99px;overflow:hidden;margin:4px 0 10px}.prog i{display:block;height:100%;background:var(--g);transition:width .3s}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px;align-items:center}
.flip{background:#e0f2fe;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;border:2px dashed #38bdf8}
.flip .fa{display:none;margin-top:6px;font-weight:700;color:#0c4a6e}.flip.on .fa{display:block}.flip .fq{font-weight:700}
.opt{display:block;width:100%;text-align:left;border:2px solid #d6d3d1;background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.no{background:#fee2e2;border-color:#dc2626}
.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}
.mini{border:2px solid #fdba74;border-radius:14px;padding:10px;margin-top:12px;background:#fffbeb}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}table.t th,table.t td{border:1.5px solid #a8a29e;padding:6px;text-align:center}table.t th{background:#ffedd5}
select,input[type=text],input[type=number]{font:inherit;padding:6px;border-radius:8px;border:2px solid #a8a29e;max-width:100%}
.ord{display:flex;flex-direction:column;gap:6px;margin:6px 0}.ord button{text-align:left}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.tool label{font-weight:700}

.qcard{border:1.5px solid #e7e5e4;border-radius:12px;padding:10px;margin:8px 0}
.tag{display:inline-block;background:#fde68a;color:#78350f;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:6px}

.appfoot{text-align:center;font-size:13px;color:#57534e;padding:14px 8px 24px;border-top:1px solid #d6d3d1;margin-top:10px}

.doc{font-size:11.5pt;color:#000;line-height:1.4}
.doc .dh{border:1.5px solid #000;padding:5px 8px;margin-bottom:6px}.doc .r{display:flex;justify-content:space-between;gap:10px;margin:3px 0;flex-wrap:wrap}
.doc .ln{display:inline-block;border-bottom:1px solid #000;min-width:30mm;height:1em}
.doc .dt{margin:4px 0 0;text-align:center;font-size:15pt}.doc .ds{text-align:center;font-size:10pt;margin-bottom:6px}
.doc .qh{font-weight:700;margin:9px 0 3px}.doc .qb{break-inside:avoid;margin:4px 0}
.doc .wl{border-bottom:1px solid #777;height:8mm}
.doc table.w{border-collapse:collapse;width:100%}.doc table.w th,.doc table.w td{border:1.2px solid #000;padding:3px 6px;text-align:left}.doc table.w th{background:#eee}
.doc .opts{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin:2px 0 0 18px}
.doc .key{background:none;border:0;border-top:2px dashed #000;border-radius:0;margin-top:12px;padding-top:6px}
.doc .a{color:#14532d;font-weight:700}
.doc pre{font:inherit;white-space:pre-wrap;margin:2px 0}
table.pg{width:100%;border-collapse:collapse}table.pg td{padding:0;border:0}
.sph,.spf{height:0}
#printHost{display:none}
.wmk,.pfoot{display:none}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}

}
</style>

function spt(id,b){const box=$(id);if(box.dataset.done||b.disabled)return;b.disabled=true;b.style.opacity=.3;box.dataset.a+=b.textContent;$(id+'o').textContent=box.dataset.a;if(box.dataset.a.length==box.dataset.w.length){const ok=box.dataset.a==box.dataset.w;box.querySelector('.mm').innerHTML=ok?'<div class="msg ok">🎉 सही!</div>':'<div class="msg no">✘ Not correct. Press ↺ and try again.</div>';if(ok){box.dataset.done=1;LS.pts++;updProg();EN(box.dataset.w)}}}

function pron(id,w){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mm=$(id).querySelector('.mm');if(!SR){mm.innerHTML='<div class="msg in">बोलने की जाँच केवल Chrome में चलती है। सुनें और ज़ोर से बोलें।</div>';return}try{const r=new SR();r.lang='hi-IN';r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();const ok=t.indexOf(w.toLowerCase())>=0;mm.innerHTML=`<div class="msg ${ok?'ok':'no'}">आपने कहा: “${esc(t)}” — ${ok?'🎉 बहुत अच्छा!':'फिर सुनें और बोलें।'}</div>`;if(ok){LS.pts++;updProg()}};r.onerror=()=>{mm.innerHTML='<div class="msg in">माइक की अनुमति दें और फिर कोशिश करें।</div>'};r.start();mm.innerHTML='<div class="msg in">🎤 अब बोलिए…</div>'}catch(e){mm.innerHTML='<div class="msg in">माइक चालू नहीं हुआ।</div>'}}
function pr(w,mr){const id='pr'+(++WID);return `<div class="mini" id="${id}"><b>${enb(w)} ${w}</b> <small>(${mr})</small> <button class="btn gr" style="margin:0 0 0 6px" onclick="pron('${id}','${w.replace(/'/g,"\\'")}')">🎤 मैं बोलता/ती हूँ</button><div class="mm"></div></div>`}
function memo(pairs){const id='mm'+(++WID);const R=rng(9+WID);const cs=shuf(pairs.flatMap((p,i)=>[[p[0],i],[p[1],i]]),R);return `<div class="mini" id="${id}" data-left="${pairs.length}"><b>🃏 जोड़ियाँ खोजें</b> <small>दो कार्ड खोलें; शब्द और अर्थ मिलाएँ।</small><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0">${cs.map(([t,i])=>`<button class="opt" style="margin:0;min-height:54px;text-align:center;font-size:14px" data-i="${i}" data-t="${esc(t).replace(/"/g,'&quot;')}" onclick="mmc('${id}',this)">❓</button>`).join('')}</div><div class="mm"></div></div>`}
function mmc(id,b){const box=$(id);if(box.dataset.lock||b.classList.contains('ok')||b.dataset.up)return;b.textContent=b.dataset.t;b.dataset.up=1;b.style.background='#fef3c7';const up=[...box.querySelectorAll('button[data-up]')];if(up.length==2){box.dataset.lock=1;if(up[0].dataset.i==up[1].dataset.i){up.forEach(x=>{x.classList.add('ok');delete x.dataset.up;x.style.background='#dcfce7'});box.dataset.lock='';box.dataset.left--;if(box.dataset.left==0){box.querySelector('.mm').innerHTML='<div class="msg ok">🎉 सभी जोड़ियाँ मिल गईं!</div>';LS.pts++;updProg()}}else setTimeout(()=>{up.forEach(x=>{x.textContent='❓';delete x.dataset.up;x.style.background=''});box.dataset.lock=''},900)}}
function scr(sent){const id='sr'+(++WID);const w=sent.split(' ');const R=rng(13+WID);const sh=shuf(w.map((x,i)=>[x,i]),R);return `<div class="mini" id="${id}" data-s="${esc(sent).replace(/"/g,'&quot;')}" data-a=""><b>🧩 वाक्य बनाएँ</b> ${enb(sent)}<div id="${id}o" style="min-height:40px;border-bottom:3px dashed #fb923c;margin:8px 0;font-weight:700"></div><div style="display:flex;gap:6px;flex-wrap:wrap">${sh.map(([x])=>`<button class="chip" onclick="srt('${id}',this)">${esc(x)}</button>`).join('')}</div><button class="btn ln" onclick="srr('${id}')">↺ फिर से</button><div class="mm"></div></div>`}
function srt(id,b){const box=$(id);if(box.dataset.done||b.disabled)return;b.disabled=true;b.style.opacity=.3;box.dataset.a+=(box.dataset.a?' ':'')+b.textContent;$(id+'o').textContent=box.dataset.a;const n=box.dataset.s.split(' ').length;if(box.dataset.a.split(' ').length==n){const ok=box.dataset.a==box.dataset.s;box.querySelector('.mm').innerHTML=ok?'<div class="msg ok">🎉 सही वाक्य!</div>':'<div class="msg no">✘ गलत। ↺ दबाकर फिर कोशिश करें।</div>';if(ok){box.dataset.done=1;LS.pts++;updProg();EN(box.dataset.s)}}}
function srr(id){const box=$(id);if(box.dataset.done)return;box.dataset.a='';$(id+'o').textContent='';box.querySelectorAll('.chip').forEach(b=>{b.disabled=false;b.style.opacity=1});box.querySelector('.mm').innerHTML=''}
function pick(instr,sent,targets){const id='pk'+(++WID);return `<div class="mini" id="${id}" data-t="${esc(JSON.stringify(targets.map(x=>x.toLowerCase()))).replace(/"/g,'&quot;')}"><b>👆 ${instr}</b><div style="line-height:2.3;margin:8px 0;font-size:17px">${sent.replace(TOK,m=>`<span class="pk" data-k="${m.toLowerCase()}" onclick="this.classList.toggle('sel');this.style.background=this.classList.contains('sel')?'#fde68a':''" style="padding:2px 4px;border-radius:6px;cursor:pointer">${m}</span>`)}</div><button class="btn gr" onclick="pkc('${id}')">जाँचें</button><div class="mm"></div></div>`}
function pkc(id){const box=$(id);const t=JSON.parse(box.dataset.t);let ok=true;box.querySelectorAll('.pk').forEach(s=>{const want=t.includes(s.dataset.k),got=s.classList.contains('sel');if(want!=got){ok=false;s.style.background='#fecaca'}else if(got)s.style.background='#bbf7d0'});box.querySelector('.mm').innerHTML=ok?'<div class="msg ok">🎉 सही!</div>':'<div class="msg in">लाल शब्द गलत/छूटे हैं। फिर करें।</div>';if(ok){LS.pts++;updProg()}}
const shw=(a,seed)=>shuf(a,rng(seed));
const miniS=(q,opts,ans,why)=>{const o=opts.map((x,i)=>[x,i]);const s=shuf(o,rng(q.length+7));return mini(q,s.map(x=>x[0]),s.findIndex(x=>x[1]==ans),why)};
const ACT={
read:()=>({t:'सुनें और पढ़ें',say:'पाठ सुनें। किसी भी शब्द पर दबाएँ — उच्चारण और अर्थ दिखेगा।',h:()=>`<style>.pw{cursor:pointer}.pm{border-bottom:2px dotted #ea580c;color:#9a3412;font-weight:700}.pl{font-size:17px;line-height:1.85;margin:2px 0}.st{background:#fff7ed;border-radius:14px;padding:10px 12px;margin:10px 0}</style><div class="key">🎧 🔊 दबाकर सुनें। शब्द पर दबाएँ।</div><button class="btn bl" onclick="EN(S.text.join(' '),.75)">▶ सब सुनें</button><div id="wm" class="msg in" style="position:sticky;top:4px;z-index:5;min-height:24px">👆 किसी शब्द पर दबाएँ</div>${S.text.map(p=>`<div class="st">${enb(p.replace(/\n/g,' '))}${p.split('\n').map(l=>`<div class="pl">${pw(l)}</div>`).join('')}</div>`).join('')}${S.author?`<p style="text-align:right"><i>– ${S.author}</i></p>`:''}`}),
basket:()=>({t:'शब्द-भंडार',say:'नए शब्द सीखें। कार्ड दबाकर अर्थ देखें।',h:()=>`<div class="key">कार्ड दबाएँ — अर्थ दिखेगा।</div><div class="sg">${S.words.map(w=>`<div class="sc" onclick="this.classList.toggle('on');EN('${w[0].replace(/'/g,"\\'")}')"><div class="sy" style="font-size:19px">${w[0]}</div><div class="sf">👆 meaning?</div><div class="sb"><b>${w[1]}</b></div></div>`).join('')}</div>`}),
listen:()=>({t:'सुनें और चुनें',say:'शब्द सुनें और अर्थ चुनें।',h:()=>{const W=S.words;return W.slice(0,6).map((w,i)=>{const o=W.filter((_,j)=>j!=i).map(x=>x[1]);return lqe(w[0],w[1],shw(o,i+3).slice(0,2))}).join('')}}),
memory:()=>({t:'जोड़ियाँ खोजें',say:'शब्द और अर्थ मिलाएँ।',h:()=>memo(S.words.slice(0,6).map(w=>[w[0],w[1]]))}),
spell:()=>({t:'Spelling Game',say:'सुनें।',h:()=>S.words.filter(w=>/^[A-Za-z]{4,10}$/.test(w[0])).slice(0,5).map(w=>spell(w[0],w[2])).join('')}),
scramble:()=>({t:'वाक्य रचना',say:'शब्द सही क्रम में दबाकर वाक्य बनाएँ।',h:()=>S.sents.map(s=>scr(s)).join('')}),
order:()=>({t:'क्रम लगाएँ',say:'घटनाओं को सही क्रम में लगाएँ।',h:()=>ordGame('घटनाओं को घटित क्रम में दबाएँ',S.order)}),
who:()=>({t:'यह किसने कहा?',say:'वाक्य और बोलने वाले को मिलाएँ।',h:()=>matchSel('किसने कहा?',S.who.map(x=>[`“${x[0]}”`,x[1]]),[...new Set(S.who.map(x=>x[1]))])}),
tf:()=>({t:'सही या गलत',say:'वाक्य सही है या गलत, बताएँ।',h:()=>sortGame('सही या गलत?',S.tf.slice(0,7).map(x=>[x[0],x[1]?0:1]),['सही ✔','गलत ✘'])}),
cloze:()=>({t:'रिक्त स्थान भरें',say:'सही शब्द चुनें।',h:()=>cloze('रिक्त स्थान भरें',S.blanks.slice(0,6).map((b,i)=>`${i+1}. ${b[0]}`).join('<br>'),S.blanks.slice(0,6).map(b=>b[1]),shw([...new Set(S.blanks.map(b=>b[1]).concat(S.xbank||[]))],5))}),
opp:()=>({t:'विलोम शब्द',say:'विलोम जोड़ियाँ मिलाएँ।',h:()=>matchSel('विलोम खोजें',S.opp.map(x=>[x[0],x[1]]),shw(S.opp.map(x=>x[1]),4))}),
qa:()=>({t:'फटाफट प्रश्न',say:'पाठ पर आधारित प्रश्न हल करें।',h:()=>S.qa.slice(0,6).map(q=>miniS(q[0],[q[1],q[2],q[3],q[4]],0,q[5])).join('')}),
gram:()=>({t:S.gramT||'व्याकरण',say:'सीखें और अभ्यास करें।',h:()=>(S.gramNote?`<div class="key">${S.gramNote}</div>`:'')+S.gram.map(g=>miniS(g[0],g[1],g[2],g[3])).join('')}),
pick:()=>({t:'शब्द खोजें',say:'सही शब्दों पर दबाएँ।',h:()=>S.pick.map(p=>pick(p[0],p[1],p[2])).join('')}),
match:()=>({t:S.matchT||'जोड़ियाँ मिलाएँ',say:'जोड़ियाँ मिलाएँ.',h:()=>matchSel(S.matchH||'Match',S.match.map(x=>[x[0],x[1]]),shw([...new Set(S.match.map(x=>x[1]))],8))}),
sort:()=>({t:S.sortT||'समूह बनाएँ',say:'सही समूह चुनें।',h:()=>sortGame(S.sortH||'कौन-सा समूह?',S.sort,S.sortC)}),
rhyme:()=>({t:'तुक मिलाएँ',say:'तुक मिलने वाले शब्द जोड़ें।',h:()=>matchSel('कौन-से शब्द तुक मिलाते हैं?',S.rhyme.map(x=>[x[0],x[1]]),shw(S.rhyme.map(x=>x[1]),6))}),
dialog:()=>({t:'आप क्या करेंगे?',say:'सबसे अच्छा उत्तर चुनें।',h:()=>S.dialog.map(d=>scen(d[0],d[1],d[2])).join('')}),
riddle:()=>({t:'पहचानें',say:'संकेत देखकर पहचानें।',h:()=>S.riddles.map(r=>miniS(r[0],r[1],r[2],r[3])).join('')}),
speak:()=>({t:'बोलकर देखें',say:'पहले सुनें; फिर ज़ोर से बोलें।',h:()=>`<div class="key">🔊 सुनें, फिर 🎤 दबाकर शब्द बोलें। (माइक केवल वेबसाइट पर Chrome में चलता है।)</div>${S.words.slice(0,5).map(w=>pr(w[0],w[1])).join('')}`})
};
const SECS=S.acts.map(a=>ACT[a]());
{const lh=SECS[SECS.length-1].h;SECS[SECS.length-1].h=()=>lh()+'<div class="key" id="fin"></div>'}
function chkMt(){}

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,R){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sx=t=>`<button class="say" onclick="say(this.dataset.t)" data-t="${esc(t).replace(/"/g,'&quot;')}">🗣 सुनें</button>`;
const LET=['अ','ब','क','ड','इ'];
let view='home';
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}draw();window.scrollTo({top:0})}
function draw(){const m=$('main');({home:vHome,learn:vLearn,mcq:vMcq,sw:vSw,hots:vHots}[view]||vHome)(m)}

/* ---------- home ---------- */
function vHome(m){m.innerHTML=`<div class="grid">
<button class="hc" onclick="go('learn')"><div class="ic">📖</div><h2>1. सीखें</h2><p>चरण-दर-चरण पाठ समझें – गतिविधियों के साथ, खुद जाँचें</p></button>
<button class="hc" onclick="go('mcq')"><div class="ic">❓</div><h2>2. MCQ प्रश्न</h2><p>बहुविकल्पी अभ्यास + A4 PDF (उत्तरसूची सहित)</p></button>
<button class="hc" onclick="go('sw')"><div class="ic">✍️</div><h2>3. अभ्यास</h2><p>अ) पुस्तक के · ब) अधिक (पुस्तक से बाहर) – PDF</p></button>
<button class="hc" onclick="go('hots')"><div class="ic">🧠</div><h2>4. HOTS / उपयोग</h2><p>सोचने पर मजबूर करने वाले प्रश्न – PDF</p></button></div>`}

/* ---------- widgets ---------- */
const symGrid=()=>`<div class="sg">${SYM.map(s=>`<div class="sc" onclick="this.classList.toggle('on')"><div class="sy">${s[0]}</div><div class="sf">❓ कौन-सा धर्म?<br><small>(क्लिक करें)</small></div><div class="sb"><b>${s[1]}</b><br><small>${s[2]}</small></div></div>`).join('')}</div>`;
const phGrid=(ks)=>`<div class="sg">${ks.map(k=>`<div class="sc" onclick="this.classList.toggle('on')"><img src="${IM[k[0]]}" style="width:100%;border-radius:8px"><div class="sf" style="font-size:13px">❓ यह क्या है?</div><div class="sb"><b>${k[1]}</b></div></div>`).join('')}</div>`;
const qimg=k=>`<img src="${IM[k]}" style="width:100%;max-width:300px;border-radius:10px;display:block;margin:6px 0">`;
let WID=0;
function chipsInfo(items){const id='ci'+(++WID);return `<div class="chips" id="${id}c">${items.map((x,i)=>`<button class="chip" onclick="ci('${id}',${i})">${x[0]}</button>`).join('')}</div><div class="info" id="${id}">👆 किसी शब्द पर क्लिक करें।</div>`+`<script type="text/plain" id="${id}d">${esc(JSON.stringify(items.map(x=>x[1])))}<\/script>`}
function ci(id,i){const d=JSON.parse($(id+'d').textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'));$(id).innerHTML=d[i];[...$(id+'c').children].forEach((c,j)=>c.classList.toggle('on',i==j))}
const flip=(q,a)=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="fq">❓ ${q}</div><div class="fa">✔ ${a}</div></div>`;
function mini(q,opts,ans,why){const id='mq'+(++WID);return `<div class="mini" id="${id}"><b>🧩 खुद जाँचें:</b> ${q}${opts.map((o,i)=>`<button class="opt" onclick="mqa('${id}',this,${i==ans},'${esc(why).replace(/'/g,"\\'")}')">${o}</button>`).join('')}<div class="mm"></div></div>`}
function mqa(id,b,ok,why){const box=$(id);if(box.dataset.done)return;b.classList.add(ok?'ok':'no');const mm=box.querySelector('.mm');
 if(ok){box.dataset.done=1;mm.innerHTML=`<div class="msg ok">🎉 सही! ${why}</div>`;LS.pts++;updProg()}else mm.innerHTML='<div class="msg no">✘ फिर कोशिश करें।</div>'}
function ordGame(title,items){const id='og'+(++WID);const R=rng(7+WID);const sh=shuf(items.map((x,i)=>[x,i]),R);
 return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🔢 ${title}</b><div class="ord">${sh.map(([x,i])=>`<button class="opt" data-i="${i}" onclick="ogc('${id}',this)">${x}</button>`).join('')}</div><div class="mm">क्रम से एक-एक घटना चुनें।</div></div>`}
function ogc(id,b){const box=$(id);let k=+box.dataset.k;if(b.classList.contains('ok'))return;const mm=box.querySelector('.mm');
 if(+b.dataset.i===k){b.classList.add('ok');b.innerHTML=(k+1)+'. '+b.innerHTML;box.dataset.k=++k;mm.innerHTML=k==box.dataset.n?'<div class="msg ok">🎉 पूरा क्रम सही!</div>':'<div class="msg in">सही! अगली घटना कौन-सी?</div>';if(k==box.dataset.n){LS.pts++;updProg()}}
 else mm.innerHTML='<div class="msg no">✘ यह घटना अभी नहीं। सोचकर फिर चुनें।</div>'}


function sortGame(title,items,cats){const id='sg'+(++WID);return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🗂 ${title}</b>${items.map((x,i)=>`<div class="qcard" id="${id}_${i}"><div>${x[0]}</div><div class="chips">${cats.map((c,j)=>`<button class="chip" onclick="sgc('${id}',${i},${j},${x[1]})">${c}</button>`).join('')}</div></div>`).join('')}<div class="mm"></div></div>`}
function sgc(id,i,j,right){const r=$(id+'_'+i);if(r.dataset.d)return;const box=$(id);if(j==right){r.dataset.d=1;r.style.background='#dcfce7';r.querySelectorAll('.chip').forEach((c,k)=>{c.disabled=true;c.classList.toggle('on',k==j)});box.dataset.k=+box.dataset.k+1;LS.pts++;updProg();if(box.dataset.k==box.dataset.n)box.querySelector('.mm').innerHTML='<div class="msg ok">🎉 सब सही!</div>'}else{r.style.background='#fee2e2';setTimeout(()=>{if(!r.dataset.d)r.style.background=''},700)}}
function matchSel(title,rows,opts){const id='ms'+(++WID);return `<div class="mini" id="${id}"><b>🧩 ${title}</b><table class="t">${rows.map((r,i)=>`<tr><td style="text-align:left">${r[0]}</td><td><select id="${id}_${i}"><option value="">–</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select></td></tr>`).join('')}</table><button class="btn gr" onclick="msc('${id}',${esc(JSON.stringify(rows.map(r=>r[1]))).replace(/"/g,'&quot;')})">जाँचें</button><div class="mm"></div></div>`}
function msc(id,ans){let ok=0;ans.forEach((a,i)=>{const s=$(id+'_'+i),g=s.value==a;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(id).querySelector('.mm').innerHTML=ok==ans.length?'<div class="msg ok">🎉 सब सही!</div>':`<div class="msg in">${ok}/${ans.length} सही। लाल उत्तर बदलें।</div>`;if(ok==ans.length){LS.pts++;updProg()}}

/* ---------- नागरिकशास्त्र विशेष widgets ---------- */
function scen(title,sit,opts){const id='sc'+(++WID);return `<div class="mini" id="${id}"><b>🎭 ${title}</b><div class="key" style="margin:6px 0">${sit}</div>${opts.map((o,i)=>`<button class="opt" onclick="scc('${id}',this,${o[1]},'${esc(o[2]).replace(/'/g,"\\'")}')">${o[0]}</button>`).join('')}<div class="mm">आप क्या करेंगे? एक विकल्प चुनें।</div></div>`}
function scc(id,b,good,why){const box=$(id);if(box.dataset.done)return;b.classList.add(good?'ok':'no');const mm=box.querySelector('.mm');mm.innerHTML=`<div class="msg ${good?'ok':'no'}">${good?'🎉 सही निर्णय!':'⚠ सोचिए।'} ${why}</div>`;if(good){box.dataset.done=1;LS.pts++;updProg()}}
function cloze(title,text,ans,bank){const id='cz'+(++WID);let k=0;const h=text.replace(/___/g,()=>{const i=k++;return `<select id="${id}_${i}" style="font:inherit;padding:2px;border-radius:6px"><option value="">____</option>${bank.map(o=>`<option>${o}</option>`).join('')}</select>`});
 return `<div class="mini" id="${id}"><b>✍ ${title}</b><div style="line-height:2.1;margin:8px 0">${h}</div><button class="btn gr" onclick="czc('${id}',${esc(JSON.stringify(ans)).replace(/"/g,'&quot;')})">जाँचें</button><div class="mm"></div></div>`}
function czc(id,ans){let ok=0;ans.forEach((a,i)=>{const s=$(id+'_'+i),g=s.value==a;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(id).querySelector('.mm').innerHTML=ok==ans.length?'<div class="msg ok">🎉 सब सही!</div>':`<div class="msg in">${ok}/${ans.length} सही। लाल रिक्त स्थान फिर भरें।</div>`;if(ok==ans.length){LS.pts++;updProg()}}
function tree(title,nodes){const r=(n)=>`<details style="margin:4px 0 4px 10px"><summary style="cursor:pointer;font-weight:700;color:#7c2d12">${n[0]}</summary><div style="margin:4px 0 4px 8px;font-size:15px">${n[1]||''}</div>${(n[2]||[]).map(r).join('')}</details>`;return `<div class="mini"><b>🌳 ${title}</b><div style="margin-top:6px">${nodes.map(r).join('')}</div><div class="mm" style="font-size:13px;color:#78716c">▶ क्लिक करके खोलें।</div></div>`}
function voteSim(title,cands,rule){const id='vt'+(++WID);const R=rng(11+WID);const base=cands.map(()=>3+Math.floor(R()*8));return `<div class="mini" id="${id}" data-base='${JSON.stringify(base)}'><b>🗳 ${title}</b><div class="key" style="margin:6px 0">${rule}</div>${cands.map((c,i)=>`<button class="opt" onclick="vtc('${id}',${i})">${c}</button>`).join('')}<div class="mm">गुप्त मतदान – अपना मत दर्ज करें।</div></div>`}
function vtc(id,i){const box=$(id);if(box.dataset.done)return;box.dataset.done=1;const base=JSON.parse(box.dataset.base);base[i]++;const names=[...box.querySelectorAll('.opt')].map(b=>b.textContent);const tot=base.reduce((a,b)=>a+b,0);const mx=Math.max(...base);const w=base.indexOf(mx);
 box.querySelector('.mm').innerHTML=`<div class="msg ok">आपका मत दर्ज हुआ। परिणाम (कुल ${tot} मत):</div>`+base.map((v,j)=>`<div style="margin:4px 0">${names[j]} — ${v} मत<div style="background:#fde68a;height:10px;border-radius:5px;width:${Math.round(v/mx*100)}%"></div></div>`).join('')+`<div class="msg in">🏆 बहुमत : <b>${names[w]}</b> विजयी। (लोकतंत्र में बहुमत से निर्णय होता है।)</div>`;LS.pts++;updProg()}
/* ---------- 1. सीखें ---------- */
let LS={s:0,pts:0};
function updProg(){const p=$('pb');if(p)p.style.width=Math.round((LS.s+1)/SECS.length*100)+'%';const s=$('pts');if(s)s.textContent='⭐ '+LS.pts}
function vLearn(m){const S=SECS[LS.s];
 if(S.bare){m.innerHTML=`<button class="back" onclick="go('home')">← मुख्य पृष्ठ</button><div class="card" style="padding:0;overflow:hidden">${S.h()}</div>`;return}
 m.innerHTML=`<button class="back" onclick="go('home')">← मुख्य पृष्ठ</button>
 <div class="card"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:var(--mut)">चरण ${LS.s+1} / ${SECS.length}</span><span id="pts" style="font-weight:700">⭐ ${LS.pts}</span></div><div class="prog"><i id="pb" style="width:${Math.round((LS.s+1)/SECS.length*100)}%"></i></div>
 ${sx(S.say)}<h2>${S.t}</h2>${S.h()}
 <div class="nav"><button class="btn ln" ${LS.s==0?'disabled':''} onclick="LS.s--;draw();window.scrollTo({top:0})">◀ पीछे</button><button class="btn" ${LS.s==SECS.length-1?'disabled':''} onclick="LS.s++;draw();window.scrollTo({top:0})">आगे ▶</button></div></div>`;
 if(LS.s==SECS.length-1)$('fin').innerHTML='🏆 पाठ पूर्ण! अब ‘MCQ’ और ‘अभ्यास’ हल करें।'}

/* ---------- print machinery ---------- */
function wrapDoc(inner,forPrint){return `<div class="doc"><table class="pg"><thead><tr><td><div class="sph"></div></td></tr></thead><tbody><tr><td>${inner}</td></tr></tbody><tfoot><tr><td><div class="spf"></div></td></tr></tfoot></table></div>`}
const WMK='<div class="wmk"><div>जी.एम.नदाफ केंद्रप्रमुख गिरगांव ता.जत</div><div>7972568986</div></div>';
const PFOOT=`<div class="pfoot"><span>रचनाकार : जी.एम.नदाफ, केंद्रप्रमुख गिरगांव ता.जत · 📞 7972568986</span><span>${L.foot}</span></div>`;
function togPdf(){const p=$('pdfp');if(!p)return;const s=p.style.display=='none';p.style.display=s?'block':'none';if(s)p.scrollIntoView({behavior:'smooth'})}
function doPrint(html){$('printHost').innerHTML=WMK+PFOOT+wrapDoc(html);window.print()}
window.addEventListener('afterprint',()=>{$('printHost').innerHTML=''});
function dHead(t,marks,sch){return `<div class="dh"><div class="r"><b>${sch?esc(sch):'विद्यालय: ________________________'}</b><span>${L.cls}</span></div><div class="r"><span>नाम : <i class="ln" style="min-width:55mm"></i></span><span>दिनांक : <i class="ln" style="min-width:26mm"></i></span><span>अंक : &nbsp;&nbsp;&nbsp;&nbsp;/ ${marks}</span></div></div><h3 class="dt">${t}</h3><div class="ds">${L.name}</div>`}
const wl=n=>'<div class="wl"></div>'.repeat(n);
let CURDOC='';
function showPrev(html){CURDOC=html;$('prev').innerHTML=wrapDoc(html)}
function toolbar(opts){return `<div class="card"><div class="tool">${opts}</div></div>`}
const seedBox=(v)=>`<label>सेट क्र.</label><input type="number" id="seed" min="1" max="99999" value="${v}" style="width:90px" onchange="regen()"><button class="btn gr" onclick="$('seed').value=1+Math.floor(Math.random()*99999);regen()">🎲 नया सेट</button>`;
const schoolBox=`<label>विद्यालय:</label><input type="text" id="sch" placeholder="(वैकल्पिक)" style="width:170px" oninput="regen()">`;
const keyBox=`<label><input type="checkbox" id="ky" checked onchange="regen()"> उत्तरसूची जोड़ें</label>`;
const prBtn=`<button class="btn bl" onclick="doPrint(CURDOC)">📄 PDF / प्रिंट</button>`;
const prHelp=`<div class="msg in">प्रिंट विंडो में ‘Save as PDF’ चुनें, कागज़ A4, Margins ‘None’ रखें। हर बार नया सेट क्र. = नए प्रश्न; वही क्रमांक = वही सेट।</div>`;
let REGEN=()=>{};function regen(){REGEN()}

/* ---------- 2. MCQ ---------- */
let MC={qs:[],i:0,sc:0,wrong:[],done:false};
function mcStart(){const R=rng(Date.now()%100000);MC={qs:shuf(MCQ,R).slice(0,10).map(q=>mkq(q,R)),i:0,sc:0,wrong:[],done:false};drawMc()}
function mkq(q,R){const o=shuf([[q[1],1],[q[2],0],[q[3],0],[q[4],0]],R);return{q:q[0],o:o.map(x=>x[0]),a:o.findIndex(x=>x[1]),e:q[5]}}
function vMcq(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पृष्ठ</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF बनाएँ</button></div><div class="card" id="mcb"></div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 MCQ परीक्षा (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="mn" onchange="regen()"><option>10</option><option selected>15</option><option>20</option><option>25</option></select>${seedBox(301)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genMcq;mcStart();genMcq()}
function drawMc(){const b=$('mcb');if(!b)return;
 if(MC.done){b.innerHTML=`<h2>📊 परिणाम : ${MC.sc} / ${MC.qs.length}</h2><div class="msg ${MC.sc>=8?'ok':'in'}">${MC.sc>=9?'उत्तम! 🏆':MC.sc>=7?'बहुत अच्छा! 👍':'फिर अभ्यास करें 💪'}</div>${MC.wrong.length?'<h3>गलत प्रश्न:</h3>'+MC.wrong.map(w=>`<div class="qcard"><b>${w.q}</b><div class="ans show">✔ ${w.o[w.a]}\n${w.e}</div></div>`).join(''):''}<button class="btn gr" onclick="mcStart()">🔄 नए 10 प्रश्न</button>`;return}
 const q=MC.qs[MC.i];b.innerHTML=`<h2>❓ अभ्यास (${MC.i+1}/${MC.qs.length}) <small style="float:right">⭐ ${MC.sc}</small></h2><div class="prog"><i style="width:${MC.i/MC.qs.length*100}%"></i></div><p><b>${q.q}</b></p>${q.o.map((o,i)=>`<button class="opt" onclick="mcA(${i},this)">${LET[i]}) ${o}</button>`).join('')}<div id="mcm"></div>`}
function mcA(i,b){const q=MC.qs[MC.i];if(q.d)return;q.d=1;const bs=document.querySelectorAll('#mcb .opt');bs[q.a].classList.add('ok');if(i!=q.a)b.classList.add('no');if(i==q.a)MC.sc++;else MC.wrong.push(q);
 $('mcm').innerHTML=`<div class="msg ${i==q.a?'ok':'no'}">${i==q.a?'🎉 सही!':'✘ गलत।'} ${q.e}</div><button class="btn" onclick="MC.i++;if(MC.i>=MC.qs.length)MC.done=true;drawMc()">${MC.i==MC.qs.length-1?'परिणाम देखें':'अगला प्रश्न ▶'}</button>`}
function genMcq(){const n=+$('mn').value,seed=+$('seed').value||1,R=rng(seed);const qs=shuf(MCQ,R).slice(0,n).map(q=>mkq(q,R));
 let h=dHead('MCQ परीक्षा',n,$('sch').value.trim())+`<div class="ds">सेट क्र. ${seed} · सही विकल्प चुनकर उत्तर कोष्ठक में लिखें।</div>`+
 qs.map((q,i)=>`<div class="qb"><div>${i+1}. ${q.q} <b>( &nbsp;&nbsp;&nbsp; )</b></div><div class="opts">${q.o.map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div></div>`).join('');
 if($('ky').checked)h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकों के लिए) – सेट ${seed}</b><div class="opts" style="grid-template-columns:repeat(5,1fr);margin-left:0">${qs.map((q,i)=>`<span>${i+1}) ${LET[q.a]}</span>`).join('')}</div></div>`;
 showPrev(h)}

/* ---------- 3. अभ्यास ---------- */
let SWT='a';
function vSw(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पृष्ठ</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF बनाएँ</button></div>
 <div class="card"><div class="chips"><button class="chip ${SWT=='a'?'on':''}" onclick="SWT='a';vSw($('main'))">अ) पुस्तक का अभ्यास</button><button class="chip ${SWT=='b'?'on':''}" onclick="SWT='b';vSw($('main'))">ब) अधिक अभ्यास (पुस्तक से बाहर)</button></div></div><div id="swb"></div>`;
 SWT=='a'?swA($('swb')):swB($('swb'))}
function ansBtn(id){return `<button class="btn ln" onclick="$('${id}').classList.toggle('show')">👁 उत्तर देखें / छिपाएँ</button>`}
const IMG=(k,c)=>`<figure style="margin:8px 0;text-align:center"><img src="${IM[k]}" style="width:100%;max-width:420px;border-radius:14px;box-shadow:0 2px 8px #0003" alt=""><figcaption style="font-size:14px;color:#78716c">${c||''}</figcaption></figure>`;
let SWID=0;
const mk=c=>c&&typeof c=='object'?`<span class="ans2">${c.a}</span>`:(c==null?'':c);
function swBlock(b,bi){let h=`<div class="card"><h2>${b.h}</h2>`;const id=x=>`sw${bi}_${x}`;
 if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qcard" id="${id(i)}"><div>${i+1}. ${it[0]}</div>${it[1].map((o,j)=>`<button class="opt" onclick="swM('${id(i)}',this,${j==it[2]},'${esc(it[1][it[2]]).replace(/'/g,"\\'")}')">${LET[j]}) ${o}</button>`).join('')}<div class="mm"></div></div>`).join('');
 else if(b.t=='qa')h+=b.items.map((it,i)=>`<div class="qcard">${i+1}. ${it[0]}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='match')h+=`<table class="t"><tr><th>‘अ’ समूह</th><th>उत्तर</th></tr>${b.L.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x}</td><td><select id="${id('s'+i)}"><option value="">–</option>${b.R.map((r,j)=>`<option>${LET[j]}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ समूह :</b><ul style="list-style:none;padding-left:4px">${b.R.map((r,j)=>`<li>${LET[j]}) ${r}</li>`).join('')}</ul><button class="btn gr" onclick="swMt(${bi})">जाँचें</button><div id="${id('m')}"></div>`;
 else if(b.t=='table')h+=`<table class="t"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</table><button class="btn ln" onclick="document.querySelectorAll('#sw${bi}c .ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तर दिखाएँ</button>`.replace('<table class="t">',`<div id="sw${bi}c"><table class="t">`).replace('</table>','</table></div>');
 else if(b.t=='order')h+=ordGame('क्रम से लगाएँ',b.items)+`<div class="msg in">सही क्रम : ${b.items.map((x,i)=>`${i+1}) ${x}`).join(' → ')}</div>`;
 else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qcard">${qimg(it[0])}${i+1}. ${it[2]||''}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='concept')h+=`<div style="text-align:center"><b>${b.center}</b><br>⬇<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${b.leaves.map(x=>`<span class="ans2" style="padding:6px 10px">${x}</span>`).join('')}</div></div><div id="sw${bi}c"></div><button class="btn ln" onclick="document.querySelectorAll('.ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तर दिखाएँ</button>`;
 else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 return h+'</div>'}
function swM(id,b,ok,a){const box=$(id);if(box.dataset.d)return;b.classList.add(ok?'ok':'no');if(ok)box.dataset.d=1;box.querySelector('.mm').innerHTML=ok?`<div class="msg ok">🎉 सही!</div>`:`<div class="msg no">✘ फिर कोशिश करें।</div>`}
function swMt(bi){const b=SWB[bi];let ok=0;b.L.forEach((x,i)=>{const s=$(`sw${bi}_s${i}`),g=s.value===LET[b.A[i]];if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(`sw${bi}_m`).innerHTML=ok==b.L.length?'<div class="msg ok">🎉 सभी जोड़ियाँ सही!</div>':`<div class="msg in">${ok}/${b.L.length} सही। लाल जोड़ियाँ बदलें।</div>`}
function swA(b){let h=SWB.map((x,i)=>swBlock(x,i)).join('');
 h+=`<div class="card" id="pdfp" style="display:none"><h2>🖨 पुस्तक का अभ्यास – PDF</h2><div class="tool">${schoolBox}<label><input type="checkbox" id="ky" checked onchange="regen()"> आदर्श उत्तर जोड़ें</label>${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 b.innerHTML=`<style>.ans2{background:#e5e7eb;color:#e5e7eb;border-radius:6px;padding:0 6px;user-select:none}.ans2.rev{background:#dcfce7;color:#166534;font-weight:700}</style>`+h;REGEN=genSwA;genSwA()}
function genSwA(){const ky=$('ky').checked,sc=$('sch').value.trim();const R=rng(11);
 let h=dHead('अभ्यास (पाठ्यपुस्तक से)','—',sc);const A=t=>`<span class="a">${t}</span>`;
 SWB.forEach(b=>{h+=`<div class="qh">${b.h}</div>`;
  if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qb"><div>${i+1}. ${it[0]} <b>( &nbsp;&nbsp; )</b></div><div class="opts">${it[1].map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div>${ky?`<div class="a">उत्तर : ${LET[it[2]]}) ${it[1][it[2]]}</div>`:''}</div>`).join('');
  else if(b.t=='qa')h+=b.items.map((it,i)=>b.lines>1?`<div class="qb">${i+1}. ${it[0]}${ky?`<div class="a"><pre>${it[1]}</pre></div>`:wl(b.lines)}</div>`:`<div class="qb">${i+1}. ${it[0]} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='match')h+=`<table class="w"><tr><th style="width:50%">‘अ’ समूह</th><th>‘ब’ समूह</th></tr>${b.L.map((x,i)=>`<tr><td>${i+1}) ${x} &nbsp;&nbsp; ( ${ky?A(LET[b.A[i]]):'&nbsp;&nbsp;'} )</td><td>${b.R[i]!=null?LET[i]+') '+b.R[i]:''}</td></tr>`).join('')}</table>`;
  else if(b.t=='table')h+=`<table class="w"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&typeof c=='object'?(ky?A(c.a):'&nbsp;<br>&nbsp;'):(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if(b.t=='order'){const idx=shuf(b.items.map((x,i)=>i),R);h+=idx.map((j,i)=>`<div class="qb">${i+1}. ${b.items[j]}</div>`).join('')+(ky?A('सही क्रम : '+b.items.map((x,i)=>idx.indexOf(i)+1).join(' → ')):wl(2))}
  else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qb"><img src="${IM[it[0]]}" style="height:30mm;border-radius:2mm"> ${i+1}. ${it[2]||''} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='concept')h+=`<div style="text-align:center"><b style="border:1.2px solid #000;padding:2px 10px">${b.center}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px">${b.leaves.map(x=>`<span style="border:1.2px solid #000;padding:6px 12px;min-width:30mm">${ky?A(x):'&nbsp;'}</span>`).join('')}</div></div>`;
  else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.t=='qb'||b.p)h+=''; });
 showPrev(h)}

let SB=401;
function sbData(seed){const R=rng(seed);const fb=shuf(FB,R).slice(0,6),mt=shuf(MT,R).slice(0,5),mtB=shuf(mt.map((x,i)=>[x[1],i]),R),tf=shuf(TF,R).slice(0,6),os=shuf(OS,R).slice(0,5),sa=shuf(SA,R).slice(0,3);return{fb,mt,mtB,tf,os,sa}}
function swB(b){b.innerHTML=`<div id="sbq"></div><div class="card" id="pdfp" style="display:none"><h2>🖨 अधिक अभ्यास – PDF</h2><div class="tool">${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;REGEN=()=>{genSwB()};renderSbq();genSwB()}
function newSb(){SB=1+Math.floor(Math.random()*99999);renderSbq();genSwB()}
function sbRev(id){$(id).classList.toggle('show')}
function sbTf(i,v,t,c,b){const ok=(v==t);b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');$('tf'+i).innerHTML=ok?`<span class="msg ok">🎉 सही! ${t?'यह कथन सही है।':'यह कथन गलत है। सही : '+c}</span>`:`<span class="msg no">✘ फिर सोचिए।</span>`}
function sbMt(){const d=sbData(SB);let ok=0;d.mt.forEach((x,i)=>{const s=$('sm'+i),good=LET[d.mtB.findIndex(y=>y[1]==i)];const g=s.value===good;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$('smm').innerHTML=ok==d.mt.length?'<div class="msg ok">🎉 सभी जोड़ियाँ सही!</div>':`<div class="msg in">${ok}/${d.mt.length} सही। लाल जोड़ियाँ बदलें।</div>`}
function renderSbq(){const d=sbData(SB);let h=`<div class="card"><h2>✍️ अधिक अभ्यास · सेट क्र. ${SB}</h2><button class="btn gr" onclick="newSb()">🎲 नए प्रश्न</button></div>`;
 h+=`<div class="card"><h2>प्र.1 रिक्त स्थान भरें।</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड़ियाँ मिलाएँ।</h2><table class="t"><tr><th>‘अ’ समूह</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ समूह :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">जाँचें</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 सही या गलत?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ सही</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ गलत</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एक वाक्य में उत्तर लिखें।</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 संक्षेप में उत्तर लिखें।</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक अभ्यास',30,sc)+`<div class="ds">सेट क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिक्त स्थान भरें। (6 अंक)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड़ियाँ मिलाएँ। (5 अंक)</div><table class="w"><tr><th style="width:50%">‘अ’ समूह</th><th>‘ब’ समूह</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 निम्नलिखित कथन सही हैं या गलत, लिखें। गलत हो तो सुधारकर लिखें। (6 अंक)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एक वाक्य में उत्तर लिखें। (5 अंक)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 संक्षेप में उत्तर लिखें। (8 अंक)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकों के लिए) – सेट ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'सही':'गलत – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक बिंदु)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

/* ---------- 4. HOTS ---------- */
function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पृष्ठ</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF बनाएँ</button></div>
 <div class="card"><h2>🧠 उपयोग / उच्चस्तरीय चिंतन प्रश्न</h2><p>पाठ की विषयवस्तु पर आधारित परंतु पाठ्यपुस्तक से बाहर के प्रश्न। पहले खुद उत्तर लिखें, फिर ‘मार्गदर्शक बिंदु’ देखें।</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक बिंदु:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्र (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोग / उच्चस्तरीय चिंतन प्रश्न',n*3,sc)+`<div class="ds">सेट क्र. ${seed} · अपने शब्दों में विस्तार से उत्तर लिखें।</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 अंक)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक बिंदु (शिक्षकों के लिए) – सेट ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}

/* ---------- boot ---------- */
document.title=L.name;$('hdr').textContent=L.name;
const h0=location.hash.replace('#','');if(['learn','mcq','sw','hots'].includes(h0))view=h0;
draw();
</script>
