<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>इतिहास</title>
<style>
:root{--b:#7c2d12;--b2:#c2410c;--g:#15803d;--bl:#1d4ed8;--bg:#fff7ed;--ink:#1c1917;--mut:#78716c;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:linear-gradient(135deg,#9a3412,#c2410c 55%,#b45309);color:#fff;padding:14px 14px 12px}
header h1{margin:0;font-size:20px;line-height:1.3}header small{opacity:.92}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.hc{padding:12px 10px}.hc .ic{font-size:28px}.hc h2{font-size:16px}.hc p{font-size:12.5px}}
.hc{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 8px #0002;cursor:pointer;border:2px solid transparent;text-align:left;font:inherit;color:inherit}
.hc:active{transform:scale(.98)}.hc:hover{border-color:var(--b2)}
.hc .ic{font-size:34px}.hc h2{margin:4px 0 2px;font-size:20px;color:var(--b)}.hc p{margin:0;color:var(--mut);font-size:14.5px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:0 1px 6px #0001}
.card h2{margin:0 0 6px;font-size:20px;color:var(--b)}
.card h3{margin:10px 0 4px;font-size:17px;color:var(--b2)}
.back{border:0;background:#fed7aa;color:#7c2d12;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer;margin:0 0 10px}
.btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;background:var(--b2);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
.btn.gr{background:var(--g)}.btn.bl{background:var(--bl)}.btn.ln{background:#e7e5e4;color:#292524}.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:7px 13px;border-radius:999px;background:#ffedd5;font-weight:700;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:700;color:#7c2d12}
.chip.on{background:#fff;border-color:var(--b2)}
.info{background:#fef3c7;border-left:5px solid #f59e0b;border-radius:8px;padding:8px 10px;margin:6px 0;min-height:44px}
.key{background:#ecfccb;border-left:5px solid #65a30d;border-radius:8px;padding:8px 10px;margin:8px 0}
.say{float:right;border:0;background:#ffedd5;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}
.prog{height:8px;background:#fed7aa;border-radius:99px;overflow:hidden;margin:4px 0 10px}.prog i{display:block;height:100%;background:var(--g);transition:width .3s}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px;align-items:center}
.flip{background:#e0f2fe;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer;border:2px dashed #38bdf8}
.flip .fa{display:none;margin-top:6px;font-weight:700;color:#0c4a6e}.flip.on .fa{display:block}.flip .fq{font-weight:700}
.opt{display:block;width:100%;text-align:left;border:2px solid #d6d3d1;background:#fff;border-radius:12px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer}
.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.no{background:#fee2e2;border-color:#dc2626}
.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}
.mini{border:2px solid #fdba74;border-radius:14px;padding:10px;margin-top:12px;background:#fffbeb}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}table.t th,table.t td{border:1.5px solid #a8a29e;padding:6px;text-align:center}table.t th{background:#ffedd5}
select,input[type=text],input[type=number]{font:inherit;padding:6px;border-radius:8px;border:2px solid #a8a29e;max-width:100%}
.ord{display:flex;flex-direction:column;gap:6px;margin:6px 0}.ord button{text-align:left}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.tool label{font-weight:700}
.ans{background:#f0fdf4;border-left:5px solid #22c55e;border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-line;display:none}
.ans.show{display:block}
.qcard{border:1.5px solid #e7e5e4;border-radius:12px;padding:10px;margin:8px 0}
.tag{display:inline-block;background:#fde68a;color:#78350f;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:6px}
.paper{background:#fff;border:1px solid #a8a29e;box-shadow:0 2px 10px #0003;margin:10px auto 0;padding:8px 10px;max-width:210mm;overflow:auto;font-size:14px;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='260'><text x='20' y='150' font-size='20' font-weight='700' fill='%23000' fill-opacity='0.055' transform='rotate(-28 180 130)' font-family='sans-serif'>जी.एम.नदाफ केंद्रप्रमुख गिरगांव ता.जत 7972568986</text></svg>")}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.sc{background:#fff;border:2px dashed #f59e0b;border-radius:14px;padding:8px;text-align:center;cursor:pointer;min-height:110px}.sc .sy{font-size:44px;line-height:1.2}.sc .sb{display:none}.sc.on .sf{display:none}.sc.on .sb{display:block;color:#14532d}.sc.on{border-style:solid;border-color:#16a34a;background:#f0fdf4}.sf{color:#78716c;font-weight:700}
.appfoot{text-align:center;font-size:13px;color:#57534e;padding:14px 8px 24px;border-top:1px solid #d6d3d1;margin-top:10px}
/* document (preview + print) */
.doc{font-size:11.5pt;color:#000;line-height:1.4}
.doc .dh{border:1.5px solid #000;padding:5px 8px;margin-bottom:6px}.doc .r{display:flex;justify-content:space-between;gap:10px;margin:3px 0;flex-wrap:wrap}
.doc .ln{display:inline-block;border-bottom:1px solid #000;min-width:30mm;height:1em}
.doc .dt{margin:4px 0 0;text-align:center;font-size:15pt}.doc .ds{text-align:center;font-size:10pt;margin-bottom:6px}
.doc .qh{font-weight:700;margin:9px 0 3px}.doc .qb{break-inside:avoid;margin:4px 0}
.doc .wl{border-bottom:1px solid #777;height:8mm}
.doc table.w{border-collapse:collapse;width:100%}.doc table.w th,.doc table.w td{border:1.2px solid #000;padding:3px 6px;text-align:left}.doc table.w th{background:#eee}
.doc .opts{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin:2px 0 0 18px}
.doc .key{background:none;border:0;border-top:2px dashed #000;border-radius:0;margin-top:12px;padding-top:6px}
.doc .a{color:#14532d;font-weight:700}
.doc pre{font:inherit;white-space:pre-wrap;margin:2px 0}
table.pg{width:100%;border-collapse:collapse}table.pg td{padding:0;border:0}
.sph,.spf{height:0}
#printHost{display:none}
.wmk,.pfoot{display:none}
@page{size:A4;margin:0}
@media print{
 body{background:#fff}
 .app{display:none!important}
 #printHost{display:block}
 #printHost .doc{padding:0 14mm}
 .sph{height:13mm}.spf{height:18mm}
 .wmk{display:block;position:fixed;left:0;right:0;top:46%;transform:translateY(-50%) rotate(-30deg);text-align:center;font-size:30pt;font-weight:700;line-height:1.3;color:#000;opacity:.08;z-index:-1;pointer-events:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap}
 .wmk div:last-child{font-size:24pt}
 .pfoot{display:flex;justify-content:space-between;gap:10px;position:fixed;left:14mm;right:14mm;bottom:6mm;font-size:8.5pt;color:#333;border-top:1px solid #777;padding-top:2px;background:#fff}
}
</style>
</head>

d:#ef6c00}.btn[disabled]{opacity:.4}\n.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;z-index:5}\n.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}\n.chip{background:#fff;border:2px solid var(--line);border-radius:22px;padding:6px 12px;font:inherit;cursor:pointer}\n.chip.sel{background:#fff9c4;border-color:#f9a825;box-shadow:0 0 0 3px #f9a82544}\n.chip.ok{background:#c8e6c9;border-color:var(--ok)}.chip.used{opacity:.35;pointer-events:none}\n.bk{border:3px dashed var(--g2);border-radius:14px;padding:8px;margin:8px 0;min-height:62px;background:#f9fff4;cursor:pointer}\n.bk b{display:block;color:var(--g);margin-bottom:4px}\n.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n.ord{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}\n.oc{position:relative;background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer;font:inherit}\n.oc img{margin:0 auto}.oc .n{position:absolute;top:-10px;left:-8px;background:var(--g);color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;font-weight:700}\n.oc.done{border-color:var(--ok);background:#e8f5e9}\n.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.mt .col{display:flex;flex-direction:column;gap:8px}\n.mt .opt{margin:0;font-size:15px}.mt .opt.sel{background:#fff9c4;border-color:#f9a825}.mt .opt.done{background:#c8e6c9;border-color:var(--ok);pointer-events:none}\n.sent{font-size:18px;line-height:2.1}.slot{display:inline-block;min-width:92px;border-bottom:3px solid var(--g2);text-align:center;color:var(--g);font-weight:700;cursor:pointer;padding:0 6px}\n.slot.ok{background:#c8e6c9}.slot.no{background:#ffcdd2}\n.res{text-align:center}.res .sc{font-size:44px;font-weight:800;color:var(--g)}\n.sim{background:#e3f2fd;border-radius:14px;padding:8px;text-align:center}\n.sim svg{width  REGEN=genMcq;mcStart();genMcq()}
function drawMc(){const b=$('mcb');if(!b)return;
 if(MC.done){b.innerHTML=`<h2>📊 निकाल : ${MC.sc} / ${MC.qs.length}</h2><div class="msg ${MC.sc>=8?'ok':'in'}">${MC.sc>=9?'उत्तम! 🏆':MC.sc>=7?'छान! 👍':'पुन्हा सराव करा 💪'}</div>${MC.wrong.length?'<h3>चुकलेले प्रश्न:</h3>'+MC.wrong.map(w=>`<div class="qcard"><b>${w.q}</b><div class="ans show">✔ ${w.o[w.a]}\n${w.e}</div></div>`).join(''):''}<button class="btn gr" onclick="mcStart()">🔄 नवे 10 प्रश्न</button>`;return}
 const q=MC.qs[MC.i];b.innerHTML=`<h2>❓ सराव (${MC.i+1}/${MC.qs.length}) <small style="float:right">⭐ ${MC.sc}</small></h2><div class="prog"><i style="width:${MC.i/MC.qs.length*100}%"></i></div><p><b>${q.q}</b></p>${q.o.map((o,i)=>`<button class="opt" onclick="mcA(${i},this)">${LET[i]}) ${o}</button>`).join('')}<div id="mcm"></div>`}
function mcA(i,b){const q=MC.qs[MC.i];if(q.d)return;q.d=1;const bs=document.querySelectorAll('#mcb .opt');bs[q.a].classList.add('ok');if(i!=q.a)b.classList.add('no');if(i==q.a)MC.sc++;else MC.wrong.push(q);
 $('mcm').innerHTML=`<div class="msg ${i==q.a?'ok':'no'}">${i==q.a?'🎉 बरोबर!':'✘ चुकले.'} ${q.e}</div><button class="btn" onclick="MC.i++;if(MC.i>=MC.qs.length)MC.done=true;drawMc()">${MC.i==MC.qs.length-1?'निकाल पाहा':'पुढचा प्रश्न ▶'}</button>`}
function genMcq(){const n=+$('mn').value,seed=+$('seed').value||1,R=rng(seed);const qs=shuf(MCQ,R).slice(0,n).map(q=>mkq(q,R));
 let h=dHead('MCQ चाचणी',n,$('sch').value.trim())+`<div class="ds">संच क्र. ${seed} · योग्य पर्याय निवडून उत्तर कंसात लिहा.</div>`+
 qs.map((q,i)=>`<div class="qb"><div>${i+1}. ${q.q} <b>( &nbsp;&nbsp;&nbsp; )</b></div><div class="opts">${q.o.map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div></div>`).join('');
 if($('ky').checked)h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="opts" style="grid-template-columns:repeat(5,1fr);margin-left:0">${qs.map((q,i)=>`<span>${i+1}) ${LET[q.a]}</span>`).join('')}</div></div>`;
 showPrev(h)}

/* ---------- 3. स्वाध्याय ---------- */
let SWT='a';
function vSw(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><div class="chips"><button class="chip ${SWT=='a'?'on':''}" onclick="SWT='a';vSw($('main'))">अ) पुस्तकातील स्वाध्याय</button><button class="chip ${SWT=='b'?'on':''}" onclick="SWT='b';vSw($('main'))">ब) अधिक स्वाध्याय (पुस्तकाबाहेरील)</button></div></div><div id="swb"></div>`;
 SWT=='a'?swA($('swb')):swB($('swb'))}
function ansBtn(id){return `<button class="btn ln" onclick="$('${id}').classList.toggle('show')">👁 उत्तर पाहा / लपवा</button>`}
const IMG=(k,c)=>`<figure style="margin:8px 0;text-align:center"><img src="${IM[k]}" style="width:100%;max-width:420px;border-radius:14px;box-shadow:0 2px 8px #0003" alt=""><figcaption style="font-size:14px;color:#78716c">${c||''}</figcaption></figure>`;
let SWID=0;
const mk=c=>c&&typeof c=='object'?`<span class="ans2">${c.a}</span>`:(c==null?'':c);
function swBlock(b,bi){let h=`<div class="card"><h2>${b.h}</h2>`;const id=x=>`sw${bi}_${x}`;
 if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qcard" id="${id(i)}"><div>${i+1}. ${it[0]}</div>${it[1].map((o,j)=>`<button class="opt" onclick="swM('${id(i)}',this,${j==it[2]},'${esc(it[1][it[2]]).replace(/'/g,"\\'")}')">${LET[j]}) ${o}</button>`).join('')}<div class="mm"></div></div>`).join('');
 else if(b.t=='qa')h+=b.items.map((it,i)=>`<div class="qcard">${i+1}. ${it[0]}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='match')h+=`<table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${b.L.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x}</td><td><select id="${id('s'+i)}"><option value="">–</option>${b.R.map((r,j)=>`<option>${LET[j]}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${b.R.map((r,j)=>`<li>${LET[j]}) ${r}</li>`).join('')}</ul><button class="btn gr" onclick="swMt(${bi})">तपासा</button><div id="${id('m')}"></div>`;
 else if(b.t=='table')h+=`<table class="t"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</table><button class="btn ln" onclick="document.querySelectorAll('#sw${bi}c .ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`.replace('<table class="t">',`<div id="sw${bi}c"><table class="t">`).replace('</table>','</table></div>');
 else if(b.t=='order')h+=ordGame('क्रमाने लावा',b.items)+`<div class="msg in">योग्य क्रम : ${b.items.map((x,i)=>`${i+1}) ${x}`).join(' → ')}</div>`;
 else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qcard">${qimg(it[0])}${i+1}. ${it[2]||''}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='concept')h+=`<div style="text-align:center"><b>${b.center}</b><br>⬇<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${b.leaves.map(x=>`<span class="ans2" style="padding:6px 10px">${x}</span>`).join('')}</div></div><div id="sw${bi}c"></div><button class="btn ln" onclick="document.querySelectorAll('.ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`;
 else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 return h+'</div>'}
function swM(id,b,ok,a){const box=$(id);if(box.dataset.d)return;b.classList.add(ok?'ok':'no');if(ok)box.dataset.d=1;box.querySelector('.mm').innerHTML=ok?`<div class="msg ok">🎉 बरोबर!</div>`:`<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>`}
function swMt(bi){const b=SWB[bi];let ok=0;b.L.forEach((x,i)=>{const s=$(`sw${bi}_s${i}`),g=s.value===LET[b.A[i]];if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$(`sw${bi}_m`).innerHTML=ok==b.L.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${b.L.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function swA(b){let h=SWB.map((x,i)=>swBlock(x,i)).join('');
 h+=`<div class="card" id="pdfp" style="display:none"><h2>🖨 पुस्तकातील स्वाध्याय – PDF</h2><div class="tool">${schoolBox}<label><input type="checkbox" id="ky" checked onchange="regen()"> आदर्श उत्तरे जोडा</label>${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 b.innerHTML=`<style>.ans2{background:#e5e7eb;color:#e5e7eb;border-radius:6px;padding:0 6px;user-select:none}.ans2.rev{background:#dcfce7;color:#166534;font-weight:700}</style>`+h;REGEN=genSwA;genSwA()}
function genSwA(){const ky=$('ky').checked,sc=$('sch').value.trim();const R=rng(11);
 let h=dHead('स्वाध्याय (पाठ्यपुस्तकातील)','—',sc);const A=t=>`<span class="a">${t}</span>`;
 SWB.forEach(b=>{h+=`<div class="qh">${b.h}</div>`;
  if(b.t=='mcq')h+=b.items.map((it,i)=>`<div class="qb"><div>${i+1}. ${it[0]} <b>( &nbsp;&nbsp; )</b></div><div class="opts">${it[1].map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div>${ky?`<div class="a">उत्तर : ${LET[it[2]]}) ${it[1][it[2]]}</div>`:''}</div>`).join('');
  else if(b.t=='qa')h+=b.items.map((it,i)=>b.lines>1?`<div class="qb">${i+1}. ${it[0]}${ky?`<div class="a"><pre>${it[1]}</pre></div>`:wl(b.lines)}</div>`:`<div class="qb">${i+1}. ${it[0]} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='match')h+=`<table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${b.L.map((x,i)=>`<tr><td>${i+1}) ${x} &nbsp;&nbsp; ( ${ky?A(LET[b.A[i]]):'&nbsp;&nbsp;'} )</td><td>${b.R[i]!=null?LET[i]+') '+b.R[i]:''}</td></tr>`).join('')}</table>`;
  else if(b.t=='table')h+=`<table class="w"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&typeof c=='object'?(ky?A(c.a):'&nbsp;<br>&nbsp;'):(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if(b.t=='order'){const idx=shuf(b.items.map((x,i)=>i),R);h+=idx.map((j,i)=>`<div class="qb">${i+1}. ${b.items[j]}</div>`).join('')+(ky?A('योग्य क्रम : '+b.items.map((x,i)=>idx.indexOf(i)+1).join(' → ')):wl(2))}
  else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qb"><img src="${IM[it[0]]}" style="height:30mm;border-radius:2mm"> ${i+1}. ${it[2]||''} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='concept')h+=`<div style="text-align:center"><b style="border:1.2px solid #000;padding:2px 10px">${b.center}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px">${b.leaves.map(x=>`<span style="border:1.2px solid #000;padding:6px 12px;min-width:30mm">${ky?A(x):'&nbsp;'}</span>`).join('')}</div></div>`;
  else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.t=='qb'||b.p)h+=''; });
 showPrev(h)}

let SB=401;
function sbData(seed){const R=rng(seed);const fb=shuf(FB,R).slice(0,6),mt=shuf(MT,R).slice(0,5),mtB=shuf(mt.map((x,i)=>[x[1],i]),R),tf=shuf(TF,R).slice(0,6),os=shuf(OS,R).slice(0,5),sa=shuf(SA,R).slice(0,3);return{fb,mt,mtB,tf,os,sa}}
function swB(b){b.innerHTML=`<div id="sbq"></div><div class="card" id="pdfp" style="display:none"><h2>🖨 अधिक स्वाध्याय – PDF</h2><div class="tool">${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;REGEN=()=>{genSwB()};renderSbq();genSwB()}
function newSb(){SB=1+Math.floor(Math.random()*99999);renderSbq();genSwB()}
function sbRev(id){$(id).classList.toggle('show')}
function sbTf(i,v,t,c,b){const ok=(v==t);b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');$('tf'+i).innerHTML=ok?`<span class="msg ok">🎉 बरोबर! ${t?'हे विधान बरोबर आहे.':'हे विधान चूक आहे. बरोबर : '+c}</span>`:`<span class="msg no">✘ पुन्हा विचार करा.</span>`}
function sbMt(){const d=sbData(SB);let ok=0;d.mt.forEach((x,i)=>{const s=$('sm'+i),good=LET[d.mtB.findIndex(y=>y[1]==i)];const g=s.value===good;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$('smm').innerHTML=ok==d.mt.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${d.mt.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function renderSbq(){const d=sbData(SB);let h=`<div class="card"><h2>✍️ अधिक स्वाध्याय · संच क्र. ${SB}</h2><button class="btn gr" onclick="newSb()">🎲 नवे प्रश्न</button></div>`;
 h+=`<div class="card"><h2>प्र.1 रिकाम्या जागा भरा.</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड्या जुळवा.</h2><table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">तपासा</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 बरोबर की चूक?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ बरोबर</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ चूक</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एका वाक्यात उत्तरे लिहा.</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 थोडक्यात उत्तरे लिहा.</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक स्वाध्याय',30,sc)+`<div class="ds">संच क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिकाम्या जागा भरा. (6 गुण)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड्या जुळवा. (5 गुण)</div><table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 खालील विधाने बरोबर की चूक ते लिहा. चूक असल्यास दुरुस्त करून लिहा. (6 गुण)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एका वाक्यात उत्तरे लिहा. (5 गुण)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 थोडक्यात उत्तरे लिहा. (8 गुण)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'बरोबर':'चूक – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक मुद्दे)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

/* ---------- 4. HOTS ---------- */
function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><h2>🧠 उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न</h2><p>पाठाच्या आशयावर आधारित पण पाठ्यपुस्तकाबाहेरील प्रश्न. स्वतः उत्तर लिहून मग ‘मार्गदर्शक मुद्दे’ पाहा.</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक मुद्दे:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्रिका (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न',n*3,sc)+`<div class="ds">संच क्र. ${seed} · स्वतःच्या शब्दांत सविस्तर उत्तरे लिहा.</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 गुण)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक मुद्दे (शिक्षकांसाठी) – संच ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}

document.title=L.name;$('hdr').textContent=L.name;
const h0=location.hash.replace('#','');if(['learn','mcq','sw','hots'].includes(h0))view=h0;
draw();
