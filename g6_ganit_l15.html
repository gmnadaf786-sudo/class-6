const SCI="<!DOCTYPE html>\n<html lang=\"mr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>6वी गणित – परिमिती व क्षेत्रफळ<\/title>\n<style>\n:root{--b:#1d4ed8;--g:#15803d;--o:#ea580c;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:#fff;color:var(--ink);font-family:\"Noto Sans Devanagari\",\"Mukta\",\"Segoe UI\",system-ui,sans-serif;font-size:17px;line-height:1.5}\n.wrap{max-width:760px;margin:0 auto;padding:12px}\n.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}\nh2{margin:0 0 6px;font-size:20px;color:var(--b)}\n.step{font-size:13px;color:var(--mut);font-weight:700}\n.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0}\n.btn.gr{background:var(--g)}.btn.or{background:var(--o)}.btn.ln{background:#e2e8f0;color:#1e293b}\n.btn:disabled{opacity:.4}\n.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.chip{padding:8px 14px;border-radius:999px;background:#e2e8f0;font-weight:700;border:2px solid transparent;cursor:pointer;user-select:none}\n.chip.on{background:#dbeafe;border-color:var(--b);color:var(--b)}\n.chip.ok{background:#dcfce7;border-color:#16a34a;color:#166534}.chip.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}\nsvg{max-width:100%;height:auto}\n.fig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;margin:6px 0}\n.fig>div{text-align:center;font-size:14px;font-weight:700;min-width:100px}\ntable.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}\ntable.t th,table.t td{border:1.5px solid #94a3b8;padding:6px;text-align:center}\ntable.t th{background:#dbeafe}\ntable.t td.l{text-align:left;font-weight:700;background:#f8fafc}\ntable.t tr.hi td{background:#fef9c3}\ninput.n{width:70px;font:inherit;font-size:17px;text-align:center;padding:5px;border:2px solid #94a3b8;border-radius:8px}\n.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}\n.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}\n.say{float:right;border:0;background:#eff6ff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}\n.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}\n.big{font-size:22px;font-weight:800;text-align:center}\ninput[type=range]{width:100%}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<div id=\"stepBox\"><\/div>\n<\/div>\n<script>\n/* ---------- common ---------- */\nfunction say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;\n const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}\nconst C='#1e293b',BL='#2563eb',RD='#dc2626',GR='#16a34a',OR='#ea580c';\nconst f=v=>(+v).toFixed(1);\nfunction ah(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),L=12,W=6;const bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a);\n return `<polygon points=\"${f(x2)},${f(y2)} ${f(bx-W*Math.sin(a))},${f(by+W*Math.cos(a))} ${f(bx+W*Math.sin(a))},${f(by-W*Math.cos(a))}\" fill=\"${col||C}\"/>`}\nfunction ln(x1,y1,x2,y2,o){o=o||{};const col=o.c||C;let s=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${col}\" stroke-width=\"${o.w||3}\" stroke-linecap=\"round\"${o.d?' stroke-dasharray=\"6 5\"':''}/>`;\n if(o.e)s+=ah(x1,y1,x2,y2,col);if(o.s)s+=ah(x2,y2,x1,y1,col);return s}\nfunction dot(x,y,lab,dx,dy,col){return `<circle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"5\" fill=\"${col||C}\"/>`+(lab?`<text x=\"${f(x+(dx||0))}\" y=\"${f(y+(dy==null?-10:dy))}\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${col||C}\">${lab}<\/text>`:'')}\nconst svg=(w,h,inner,pw)=>`<svg viewBox=\"0 0 ${w} ${h}\" width=\"${pw||w}\">${inner}<\/svg>`;\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}\nfunction shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\n\n/* ---------- steps : परिमिती व क्षेत्रफळ ---------- */\nlet S=0;const SN=7;\nconst st={sh:0,wk:0,l:8,b:5,iv:0,ik:0,al:4,ab:3,pp:10,ex:0,ek:0,pr:null,prm:'',hint:false};\nfunction sx(t){return `<button class=\"say\" onclick=\"say(this.dataset.t)\" data-t=\"${t.replace(/\"/g,'&quot;')}\">🗣 ऐका<\/button>`}\nfunction nav(){return `<div class=\"nav\"><button class=\"btn ln\" ${S==0?'disabled':''} onclick=\"go(-1)\">◀ मागे<\/button><span class=\"step\">${S+1} / ${SN}<\/span><button class=\"btn\" ${S==SN-1?'disabled':''} onclick=\"go(1)\">पुढे ▶<\/button><\/div>`}\nfunction go(d){S=Math.max(0,Math.min(SN-1,S+d));drawStep();try{window.parent.document.getElementById('sf').scrollIntoView()}catch(x){}}\nfunction drawStep(){document.getElementById('stepBox').innerHTML=[s0,s1,s2,s3,s4,s5,s6][S]()+nav()}\nconst BOX=a=>`<div style=\"border:2px solid #cbd5e1;border-radius:12px;padding:8px 14px;font-size:18px;line-height:2;font-weight:600\">${a}<\/div>`;\nconst lab=(x,y,t,c,s)=>`<text x=\"${f(x)}\" y=\"${f(y)}\" font-size=\"${s||14}\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${c||C}\">${t}<\/text>`;\nconst nf=v=>+(+v).toFixed(2);\nfunction stepper(list,idx,kk,lab_){const e=list[st[idx]],k=st[kk];\n return `<div class=\"chips\">${list.map((x,i)=>`<span class=\"chip ${i==st[idx]?'on':''}\" onclick=\"st.${idx}=${i};st.${kk}=0;drawStep()\">${lab_(x,i)}<\/span>`).join('')}<\/div>\n <div class=\"key\" style=\"font-size:17px\">${e.q}<\/div>${e.fig||''}\n ${BOX(e.s.slice(0,k).map((s,i)=>`<div style=\"${i==e.s.length-1?'color:#15803d;font-weight:800':''}\">${s}<\/div>`).join('')||'<span style=\"color:#94a3b8;font-size:15px\">‘पुढची पायरी’ दाबा.<\/span>')}\n <button class=\"btn\" ${k>=e.s.length?'disabled':''} onclick=\"st.${kk}++;drawStep()\">▶ पुढची पायरी<\/button><button class=\"btn ln\" onclick=\"st.${kk}=0;drawStep()\">↺ पुन्हा<\/button>`}\n\n/* पायरी 1 : परिमिती म्हणजे काय */\nconst SH=[['त्रिकोण',[[40,170],[260,170],[150,40]],[12,7,5]],['आयत',[[40,60],[260,60],[260,170],[40,170]],[20,10,20,10]],['चौरस',[[80,40],[220,40],[220,180],[80,180]],[7,7,7,7]],['पंचकोन',[[150,30],[270,100],[230,190],[70,190],[30,100]],[6,5,8,5,6]]];\nfunction s0(){const [nm,P,L]=SH[st.sh],k=st.wk,n=P.length,t='आकृतीच्या सर्व बाजूंच्या लांबीची बेरीज म्हणजे परिमिती. आकृतीभोवती एक फेरी मारली तर कापलेले अंतर म्हणजे परिमिती.';\n let g=`<polygon points=\"${P.map(p=>p.join(',')).join(' ')}\" fill=\"#f0fdf4\" stroke=\"#94a3b8\" stroke-width=\"2\"/>`;\n for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];if(i<k)g+=ln(...a,...b,{c:RD,w:5});g+=lab((a[0]+b[0])/2+((a[1]+b[1])/2>110?0:0),(a[1]+b[1])/2+((a[1]==b[1])?(a[1]<110?-8:20):5)+((a[0]==b[0])?0:0),L[i]+(nm=='आयत'?' मी':' सेमी'),BL)}\n if(k<n)g+=`<text x=\"${P[k][0]}\" y=\"${P[k][1]+6}\" font-size=\"20\" text-anchor=\"middle\">🐜<\/text>`;\n const U=nm=='आयत'?'मी':'सेमी',sum=L.slice(0,k).reduce((a,b)=>a+b,0);\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 1<\/div><h2>परिमिती म्हणजे काय?<\/h2>\n <div class=\"chips\">${SH.map((x,i)=>`<span class=\"chip ${i==st.sh?'on':''}\" onclick=\"st.sh=${i};st.wk=0;drawStep()\">${x[0]}<\/span>`).join('')}<\/div>\n <div class=\"fig\">${svg(300,220,g,300)}<\/div>\n <div class=\"big\">🐜 कापलेले अंतर = ${L.slice(0,k).join(' + ')||'0'} = ${sum} ${U}<\/div>\n <button class=\"btn\" ${k>=n?'disabled':''} onclick=\"st.wk++;drawStep()\">🐜 पुढची बाजू चाल<\/button><button class=\"btn ln\" onclick=\"st.wk=0;drawStep()\">↺ पुन्हा<\/button>\n ${k>=n?`<div class=\"msg ok\">🎉 एक फेरी पूर्ण! ${nm}ची परिमिती = <b>${sum} ${U}<\/b><\/div>`:''}\n <div class=\"key\">परिमिती = सर्व बाजूंच्या लांबींची बेरीज. परिमितीचे एकक लांबीचेच : सेमी, मी, किमी.<\/div><\/div>`}\n\n/* पायरी 2 : आयत व चौरस परिमिती सूत्र */\nfunction s1(){const {l,b}=st,t='आयताची परिमिती म्हणजे दोन गुणिले लांबी अधिक रुंदी. चौरसाची परिमिती म्हणजे चार गुणिले बाजू.';\n const u=Math.min(28,260/Math.max(l,1),150/Math.max(b,1));let g=`<rect x=\"20\" y=\"20\" width=\"${l*u}\" height=\"${b*u}\" fill=\"#e0f2fe\" stroke=\"${BL}\" stroke-width=\"3\"/>`+lab(20+l*u/2,14,'लांबी '+l,BL)+`<text x=\"${12}\" y=\"${20+b*u/2}\" font-size=\"13\" font-weight=\"700\" fill=\"${RD}\" transform=\"rotate(-90 12 ${20+b*u/2})\" text-anchor=\"middle\">रुंदी ${b}<\/text>`;\n const sq=l==b;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 2<\/div><h2>आयत व चौरस यांची परिमिती<\/h2>\n <div>लांबी : <b>${l} सेमी<\/b><\/div><input type=\"range\" min=\"1\" max=\"12\" value=\"${l}\" oninput=\"st.l=+this.value;drawStep()\">\n <div>रुंदी : <b>${b} सेमी<\/b><\/div><input type=\"range\" min=\"1\" max=\"8\" value=\"${b}\" oninput=\"st.b=+this.value;drawStep()\">\n <div class=\"fig\">${svg(Math.max(300,l*u+40),b*u+40,g,300)}<\/div>\n ${BOX(sq?`चौरसाची परिमिती = 4 × बाजू<br>= 4 × ${l}<br>= <span style=\"color:#15803d\">${4*l} सेमी<\/span>`:`आयताची परिमिती = 2 × (लांबी + रुंदी)<br>= 2 × (${l} + ${b})<br>= 2 × ${l+b}<br>= <span style=\"color:#15803d\">${2*(l+b)} सेमी<\/span>`)}\n <div class=\"key\">• आयत : ${l} + ${b} + ${l} + ${b} = 2 × (${l} + ${b}) – समोरासमोरच्या बाजू समान.<br>• चौरस : चारही बाजू समान → 4 × बाजू. (लांबी = रुंदी करून पाहा!)<\/div><\/div>`}\n\n/* पायरी 3 : परिमितीवरून बाजू */\nconst IV=[{q:'आयताची परिमिती 64 सेमी व लांबी 17 सेमी. रुंदी किती?',s:['आयताची परिमिती = 2 × (लांबी + रुंदी)','64 = 2 × (लांबी + रुंदी)','लांबी + रुंदी = 64 ÷ 2 = 32','रुंदी = 32 − 17 = 15 सेमी']},\n {q:'त्रिकोणाची परिमिती 55 सेमी; दोन बाजू 20 सेमी व 14 सेमी. तिसरी बाजू?',s:['दोन बाजूंची बेरीज = 20 + 14 = 34 सेमी','तिसरी बाजू = परिमिती − दोन बाजूंची बेरीज','= 55 − 34 = 21 सेमी']},\n {q:'36 सेमी दोरीपासून चौरस केला. बाजू किती?',s:['चौरसाची परिमिती = 4 × बाजू','36 = 4 × बाजू','बाजू = 36 ÷ 4 = 9 सेमी']},\n {q:'36 सेमी दोरीपासून 10 सेमी लांबीचा आयत केला. रुंदी किती?',s:['लांबी + रुंदी = 36 ÷ 2 = 18 सेमी','रुंदी = 18 − 10 = 8 सेमी']},\n {q:'5 सेमी × 3 सेमी आयताची तार वाकवून चौरस केला. चौरसाची बाजू?',s:['आयताची परिमिती = 2 × (5 + 3) = 16 सेमी','तारेची लांबी तीच → चौरसाची परिमिती = 16 सेमी','चौरसाची बाजू = 16 ÷ 4 = 4 सेमी']}];\nfunction s2(){const t='परिमिती दिली असेल तर सूत्र उलट वापरून बाजू काढता येते.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 3<\/div><h2>परिमितीवरून बाजू काढणे<\/h2>${stepper(IV,'iv','ik',(x,i)=>['आयत','त्रिकोण','दोरी-चौरस','दोरी-आयत','तार'][i])}\n <div class=\"key\">• आयत : लांबी + रुंदी = परिमिती ÷ 2.<br>• चौरस : बाजू = परिमिती ÷ 4.<br>• तार/दोरी वाकवून नवा आकार केला तरी परिमिती (लांबी) बदलत नाही.<\/div><\/div>`}\n\n/* पायरी 4 : क्षेत्रफळ म्हणजे काय */\nfunction s3(){const {al,ab}=st,u=30,t='आकृतीने व्यापलेल्या पृष्ठभागाला क्षेत्रफळ म्हणतात. एक सेमी बाजूच्या चौरसाचे क्षेत्रफळ एक चौरस सेंटिमीटर. आयतात मावणारे असे चौरस मोजा.';\n let g='';for(let i=0;i<10;i++)for(let j=0;j<6;j++)g+=`<rect x=\"${10+i*u}\" y=\"${10+j*u}\" width=\"${u}\" height=\"${u}\" fill=\"${i<al&&j<ab?(((i+j)%2)?'#fdba74':'#fed7aa'):'#fff'}\" stroke=\"#cbd5e1\"/>`;\n g+=`<rect x=\"10\" y=\"10\" width=\"${al*u}\" height=\"${ab*u}\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"3\"/>`;\n for(let i=0;i<al;i++)for(let j=0;j<ab;j++)g+=`<text x=\"${25+i*u}\" y=\"${30+j*u}\" font-size=\"11\" text-anchor=\"middle\" fill=\"#7c2d12\">${j*al+i+1}<\/text>`;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 4<\/div><h2>क्षेत्रफळ म्हणजे काय?<\/h2>\n <div>लांबी : <b>${al} सेमी<\/b><\/div><input type=\"range\" min=\"1\" max=\"10\" value=\"${al}\" oninput=\"st.al=+this.value;drawStep()\">\n <div>रुंदी : <b>${ab} सेमी<\/b><\/div><input type=\"range\" min=\"1\" max=\"6\" value=\"${ab}\" oninput=\"st.ab=+this.value;drawStep()\">\n <div class=\"fig\">${svg(320,200,g,320)}<\/div>\n <div class=\"msg in\">प्रत्येक लहान चौरस = 1 चौ.सेमी. मोजा : ${al*ab} चौरस → ${ab} ओळी × ${al} चौरस<\/div>\n ${BOX(`आयताचे क्षेत्रफळ = लांबी × रुंदी<br>= ${al} × ${ab}<br>= <span style=\"color:#15803d\">${al*ab} चौ.सेमी<\/span>`)}\n <div class=\"key\">• क्षेत्रफळाची एकके : चौ.सेमी, चौ.मी, चौ.किमी (तालुका, जिल्हा, राज्य).<br>• बाजू मीटरमध्ये → क्षेत्रफळ चौरस मीटरमध्ये.<br>• चौरसाचे क्षेत्रफळ = बाजू × बाजू.<\/div><\/div>`}\n\n/* पायरी 5 : परिमिती समान, क्षेत्रफळ वेगळे */\nfunction s4(){const P=20,L=st.pp/1,B=P/2-L,t='दोन आयतांची परिमिती समान असली तरी त्यांची क्षेत्रफळे वेगवेगळी असू शकतात. लांबी आणि रुंदी जवळजवळ समान असताना क्षेत्रफळ सर्वांत जास्त असते.';\n const u=24;const g=`<rect x=\"10\" y=\"10\" width=\"${L*u}\" height=\"${B*u}\" fill=\"#ddd6fe\" stroke=\"#6d28d9\" stroke-width=\"3\"/>`+lab(10+L*u/2,B*u+28,L+' सेमी','#6d28d9');\n const rows=[[9,1],[8,2],[7,3],[6,4],[5,5]];\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 5<\/div><h2>परिमिती समान, क्षेत्रफळ वेगळे!<\/h2>\n <div class=\"msg in\">20 सेमी लांबीच्या दोरीने आयत करा.<\/div>\n <div>लांबी : <b>${L} सेमी<\/b>, रुंदी : <b>${B} सेमी<\/b><\/div><input type=\"range\" min=\"5\" max=\"9\" value=\"${L}\" oninput=\"st.pp=+this.value;drawStep()\">\n <div class=\"fig\">${svg(250,Math.max(70,B*u+40),g,240)}<\/div>\n <table class=\"t\"><tr><th>लांबी<\/th><th>रुंदी<\/th><th>परिमिती<\/th><th>क्षेत्रफळ<\/th><\/tr>${rows.map(r=>`<tr style=\"${r[0]==L?'background:#fef9c3':''}\"><td>${r[0]}<\/td><td>${r[1]}<\/td><td>20<\/td><td><b>${r[0]*r[1]}<\/b> चौ.सेमी<\/td><\/tr>`).join('')}<\/table>\n <div class=\"key\">• परिमिती सर्वांची 20 सेमी, पण क्षेत्रफळ 9 ते 25 चौ.सेमी.<br>• चौरस (5 × 5) चे क्षेत्रफळ सर्वांत जास्त.<br>• काटकोन त्रिकोण = आयताचा अर्धा भाग → त्रिकोणाचे क्षेत्रफळ = ½ × पाया × उंची (उदा. ½ × 8 × 5 = 20).<\/div><\/div>`}\n\n/* पायरी 6 : व्यवहारी उदाहरणे */\nconst EX=[{q:'आंब्याची बाग 100 मी × 50 मी. प्रत्येक झाडाला 25 चौ.मी जागा. जास्तीत जास्त किती झाडे?',s:['बागेचे क्षेत्रफळ = लांबी × रुंदी = 100 × 50 = 5000 चौ.मी','झाडांची संख्या = 5000 ÷ 25 = 200 झाडे']},\n {q:'हॉल 5 मी × 4 मी; 3 मी बाजूचा चौरसाकृती गालिचा अंथरला. न झाकलेले क्षेत्रफळ?',s:['हॉलचे क्षेत्रफळ = 5 × 4 = 20 चौ.मी','गालिच्याचे क्षेत्रफळ = 3 × 3 = 9 चौ.मी','न झाकलेले क्षेत्रफळ = 20 − 9 = 11 चौ.मी'],fig:`<div class=\"fig\">${svg(220,180,`<rect x=\"10\" y=\"10\" width=\"200\" height=\"160\" fill=\"#fef3c7\" stroke=\"#92400e\" stroke-width=\"2\"/><rect x=\"50\" y=\"30\" width=\"120\" height=\"120\" fill=\"#c4b5fd\" stroke=\"#6d28d9\"/><text x=\"110\" y=\"95\" text-anchor=\"middle\" font-size=\"13\">गालिचा 3×3<\/text>`,200)}<\/div>`},\n {q:'12 मी × 10 मी जमिनीच्या चार कोपऱ्यांत 4 मी बाजूचे चौरसाकृती वाफे. फुलझाडे नसलेली जमीन?',s:['जमिनीचे क्षेत्रफळ = 12 × 10 = 120 चौ.मी','एका वाफ्याचे क्षेत्रफळ = 4 × 4 = 16 चौ.मी','चार वाफे = 4 × 16 = 64 चौ.मी','उरलेली जमीन = 120 − 64 = 56 चौ.मी'],fig:`<div class=\"fig\">${svg(260,220,`<rect x=\"10\" y=\"10\" width=\"240\" height=\"200\" fill=\"#dcfce7\" stroke=\"#166534\" stroke-width=\"2\"/>${[[10,10],[170,10],[10,130],[170,130]].map(p=>`<rect x=\"${p[0]}\" y=\"${p[1]}\" width=\"80\" height=\"80\" fill=\"#f9a8d4\" stroke=\"#be185d\"/>`).join('')}`,220)}<\/div>`},\n {q:'अंजू आतल्या ट्रॅकवर (40 मी × 20 मी) 7 फेऱ्या, मंजू बाहेरच्या (60 मी × 40 मी) 4 फेऱ्या धावल्या. जास्त अंतर कोणी?',s:['आतल्या ट्रॅकची परिमिती = 2 × (40 + 20) = 120 मी','अंजू : 7 × 120 = 840 मी','बाहेरच्या ट्रॅकची परिमिती = 2 × (60 + 40) = 200 मी','मंजू : 4 × 200 = 800 मी','840 > 800, म्हणून अंजूने जास्त अंतर कापले']},\n {q:'1 मी बाजूच्या चौरस कापडाचे 50 सेमी बाजूचे 4 रुमाल केले. सर्व रुमालांना लेस किती?',s:['एका रुमालाची परिमिती = 4 × 50 = 200 सेमी','चार रुमालांची लेस = 4 × 200 = 800 सेमी (8 मी)']}];\nfunction s5(){const t='परिमिती कुंपण, लेस, धावण्याचे अंतर यांसाठी वापरतात. क्षेत्रफळ जमीन, फरशी, गालिचा, झाडांची जागा यांसाठी वापरतात.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 6<\/div><h2>व्यवहारातील परिमिती व क्षेत्रफळ<\/h2>${stepper(EX,'ex','ek',(x,i)=>['🌳 बाग','🟪 गालिचा','🌸 वाफे','🏃 ट्रॅक','🧣 रुमाल'][i])}\n <div class=\"key\">• कडेने/भोवती (कुंपण, लेस, फेरी) → <b>परिमिती<\/b>.<br>• पृष्ठभाग झाकणे (फरशी, रंग, गालिचा, जागा) → <b>क्षेत्रफळ<\/b>.<\/div><\/div>`}\n\n/* पायरी 7 : आता तुम्ही सोडवा */\nfunction newPr(){const k=rnd(0,3),l=rnd(3,20),b=rnd(2,Math.max(2,l-1)),a=rnd(3,15);\n if(k==0)st.pr={q:`आयत : लांबी ${l} मी, रुंदी ${b} मी. परिमिती किती मीटर?`,a:2*(l+b),h:`2 × (${l} + ${b})`};\n else if(k==1)st.pr={q:`आयत : लांबी ${l} मी, रुंदी ${b} मी. क्षेत्रफळ किती चौ.मी?`,a:l*b,h:`${l} × ${b}`};\n else if(k==2)st.pr={q:`चौरसाची बाजू ${a} सेमी. ${Math.random()<.5?'परिमिती किती सेमी?':'क्षेत्रफळ किती चौ.सेमी?'}`,a:0,h:''};\n else st.pr={q:`आयताची परिमिती ${2*(l+b)} सेमी व लांबी ${l} सेमी. रुंदी किती सेमी?`,a:b,h:`${2*(l+b)} ÷ 2 − ${l}`};\n if(k==2){const per=st.pr.q.includes('परिमिती');st.pr.a=per?4*a:a*a;st.pr.h=per?`4 × ${a}`:`${a} × ${a}`}\n st.prm='';st.hint=false}\nfunction s6(){if(!st.pr)newPr();const p=st.pr,t='उदाहरण सोडवा.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 7<\/div><h2>आता तुम्ही सोडवा<\/h2>\n <div class=\"key\" style=\"font-size:18px\">${p.q}<\/div><div class=\"big\"><input class=\"n\" id=\"pra\" style=\"width:110px;font-size:22px\" inputmode=\"decimal\"><\/div>\n <button class=\"btn gr\" onclick=\"chkPr()\">तपासा<\/button><button class=\"btn or\" onclick=\"st.hint=!st.hint;drawStep()\">💡 मदत<\/button>\n ${st.hint?`<div class=\"key\">${p.h}<\/div>`:''}<div>${st.prm}<\/div><button class=\"btn ln\" onclick=\"newPr();drawStep()\">🔄 दुसरे उदाहरण<\/button><\/div>`}\nfunction chkPr(){const raw=document.getElementById('pra').value.trim(),p=st.pr;st.prm=raw!==''&&+raw===p.a?`<div class=\"msg ok\">🎉 बरोबर! ${p.a}<\/div>`:'<div class=\"msg no\">✘ अजून नाही. 💡 मदत पाहा.<\/div>';drawStep();document.getElementById('pra').value=raw}\n\ndrawStep();\n<\/script>\n<\/body>\n<\/html>\n";
const L={name:'पाठ 15 : परिमिती व क्षेत्रफळ',cls:'इयत्ता : 6वी &nbsp; विषय : गणित',foot:'इ. 6वी गणित · पाठ 15'};
const SYM=[];const symGrid2=()=>'';
const SECS=[{t:'शिकू या',bare:1,say:'',h:()=>{setTimeout(()=>{const f=document.getElementById('sf');if(f&&!f.dataset.l){f.dataset.l=1;f.onload=()=>{try{const d=f.contentDocument;const st=d.createElement('style');st.textContent='html,body{min-height:0!important;height:auto!important}';d.head.appendChild(st);const fit=()=>{try{const w=d.querySelector('.wrap');const h=Math.ceil(w.getBoundingClientRect().bottom+d.defaultView.scrollY)+10;if(Math.abs(f.offsetHeight-h)>4)f.style.height=h+'px'}catch(e){}};fit();setInterval(fit,300)}catch(e){}};f.srcdoc=SCI}},50);return `<iframe id="sf" title="शिकू या" scrolling="no" style="width:100%;height:600px;border:0;background:#fff;display:block"></iframe>`}}];

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,R){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sx=t=>`<button class="say" onclick="say(this.dataset.t)" data-t="${esc(t).replace(/"/g,'&quot;')}">🗣 ऐका</button>`;
const LET=['अ','ब','क','ड','इ'];
let view='home';
function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){}draw();window.scrollTo({top:0})}
function draw(){const m=$('main');({home:vHome,learn:vLearn,mcq:vMcq,sw:vSw,hots:vHots}[view]||vHome)(m)}

/* ---------- home ---------- */
function vHome(m){m.innerHTML=`<div class="grid">
<button class="hc" onclick="go('learn')"><div class="ic">📖</div><h2>1. शिकू या</h2><p>पायरी-पायरीने पाठ समजून घ्या – कृतीसह, स्वतः तपासा</p></button>
<button class="hc" onclick="go('mcq')"><div class="ic">❓</div><h2>2. MCQ प्रश्न</h2><p>बहुपर्यायी सराव + A4 PDF (उत्तरसूचीसह)</p></button>
<button class="hc" onclick="go('sw')"><div class="ic">✍️</div><h2>3. स्वाध्याय</h2><p>अ) पुस्तकातील · ब) अधिक (पुस्तकाबाहेरील) – PDF</p></button>
<button class="hc" onclick="go('hots')"><div class="ic">🧠</div><h2>4. उपयोजनात्मक / HOTS</h2><p>विचार करायला लावणारे प्रश्न – PDF</p></button></div>`}

/* ---------- widgets ---------- */
const symGrid=()=>`<div class="sg">${SYM.map(s=>`<div class="sc" onclick="this.classList.toggle('on')"><div class="sy">${s[0]}</div><div class="sf">❓ कोणता धर्म?<br><small>(टिचकी मारा)</small></div><div class="sb"><b>${s[1]}</b><br><small>${s[2]}</small></div></div>`).join('')}</div>`;
const phGrid=(ks)=>`<div class="sg">${ks.map(k=>`<div class="sc" onclick="this.classList.toggle('on')"><img src="${IM[k[0]]}" style="width:100%;border-radius:8px"><div class="sf" style="font-size:13px">❓ हे काय आहे?</div><div class="sb"><b>${k[1]}</b></div></div>`).join('')}</div>`;
const qimg=k=>`<img src="${IM[k]}" style="width:100%;max-width:300px;border-radius:10px;display:block;margin:6px 0">`;
let WID=0;
function chipsInfo(items){const id='ci'+(++WID);return `<div class="chips" id="${id}c">${items.map((x,i)=>`<button class="chip" onclick="ci('${id}',${i})">${x[0]}</button>`).join('')}</div><div class="info" id="${id}">👆 एखाद्या शब्दावर टिचकी मारा.</div>`+`<script type="text/plain" id="${id}d">${esc(JSON.stringify(items.map(x=>x[1])))}<\/script>`}
function ci(id,i){const d=JSON.parse($(id+'d').textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'));$(id).innerHTML=d[i];[...$(id+'c').children].forEach((c,j)=>c.classList.toggle('on',i==j))}
const flip=(q,a)=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="fq">❓ ${q}</div><div class="fa">✔ ${a}</div></div>`;
function mini(q,opts,ans,why){const id='mq'+(++WID);return `<div class="mini" id="${id}"><b>🧩 स्वतः तपासा:</b> ${q}${opts.map((o,i)=>`<button class="opt" onclick="mqa('${id}',this,${i==ans},'${esc(why).replace(/'/g,"\\'")}')">${o}</button>`).join('')}<div class="mm"></div></div>`}
function mqa(id,b,ok,why){const box=$(id);if(box.dataset.done)return;b.classList.add(ok?'ok':'no');const mm=box.querySelector('.mm');
 if(ok){box.dataset.done=1;mm.innerHTML=`<div class="msg ok">🎉 बरोबर! ${why}</div>`;LS.pts++;updProg()}else mm.innerHTML='<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>'}
function ordGame(title,items){const id='og'+(++WID);const R=rng(7+WID);const sh=shuf(items.map((x,i)=>[x,i]),R);
 return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🔢 ${title}</b><div class="ord">${sh.map(([x,i])=>`<button class="opt" data-i="${i}" onclick="ogc('${id}',this)">${x}</button>`).join('')}</div><div class="mm">क्रमाने एकेक घटना निवडा.</div></div>`}
function ogc(id,b){const box=$(id);let k=+box.dataset.k;if(b.classList.contains('ok'))return;const mm=box.querySelector('.mm');
 if(+b.dataset.i===k){b.classList.add('ok');b.innerHTML=(k+1)+'. '+b.innerHTML;box.dataset.k=++k;mm.innerHTML=k==box.dataset.n?'<div class="msg ok">🎉 सर्व क्रम बरोबर!</div>':'<div class="msg in">बरोबर! पुढची घटना कोणती?</div>';if(k==box.dataset.n){LS.pts++;updProg()}}
 else mm.innerHTML='<div class="msg no">✘ ही घटना आता नाही. विचार करून पुन्हा निवडा.</div>'}

function genMcq(){const n=+$('mn').value,seed=+$('seed').value||1,R=rng(seed);const qs=shuf(MCQ,R).slice(0,n).map(q=>mkq(q,R));

 else if(b.t=='match')h+=`<table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${b.L.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x}</td><td><select id="${id('s'+i)}"><option value="">–</option>${b.R.map((r,j)=>`<option>${LET[j]}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${b.R.map((r,j)=>`<li>${LET[j]}) ${r}</li>`).join('')}</ul><button class="btn gr" onclick="swMt(${bi})">तपासा</button><div id="${id('m')}"></div>`;
 else if(b.t=='table')h+=`<table class="t"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</table><button class="btn ln" onclick="document.querySelectorAll('#sw${bi}c .ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`.replace('<table class="t">',`<div id="sw${bi}c"><table class="t">`).replace('</table>','</table></div>');

 else if(b.t=='concept')h+=`<div style="text-align:center"><b>${b.center}</b><br>⬇<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${b.leaves.map(x=>`<span class="ans2" style="padding:6px 10px">${x}</span>`).join('')}</div></div><div id="sw${bi}c"></div><button class="btn ln" onclick="document.querySelectorAll('.ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`;
 else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;

  else if(b.t=='match')h+=`<table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${b.L.map((x,i)=>`<tr><td>${i+1}) ${x} &nbsp;&nbsp; ( ${ky?A(LET[b.A[i]]):'&nbsp;&nbsp;'} )</td><td>${b.R[i]!=null?LET[i]+') '+b.R[i]:''}</td></tr>`).join('')}</table>`;
  else if(b.t=='table')h+=`<table class="w"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&typeof c=='object'?(ky?A(c.a):'&nbsp;<br>&nbsp;'):(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if(b.t=='order'){const idx=shuf(b.items.map((x,i)=>i),R);h+=idx.map((j,i)=>`<div class="qb">${i+1}. ${b.items[j]}</div>`).join('')+(ky?A('योग्य क्रम : '+b.items.map((x,i)=>idx.indexOf(i)+1).join(' → ')):wl(2))}
  else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qb"><img src="${IM[it[0]]}" style="height:30mm;border-radius:2mm"> ${i+1}. ${it[2]||''} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='concept')h+=`<div style="text-align:center"><b style="border:1.2px solid #000;padding:2px 10px">${b.center}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px">${b.leaves.map(x=>`<span style="border:1.2px solid #000;padding:6px 12px;min-width:30mm">${ky?A(x):'&nbsp;'}</span>`).join('')}</div></div>`;
  else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.t=='qb'||b.p)h+=''; });
 showPrev(h)}

let SB=401;
function sbData(seed){const R=rng(seed);const fb=shuf(FB,R).slice(0,6),mt=shuf(MT,R).slice(0,5),mtB=shuf(mt.map((x,i)=>[x[1],i]),R),tf=shuf(TF,R).slice(0,6),os=shuf(OS,R).slice(0,5),sa=shuf(SA,R).slice(0,3);return{fb,mt,mtB,tf,os,sa}}
function swB(b){b.innerHTML=`<div id="sbq"></div><div class="card" id="pdfp" style="display:none"><h2>🖨 अधिक स्वाध्याय – PDF</h2><div class="tool">${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;REGEN=()=>{genSwB()};renderSbq();genSwB()}
function newSb(){SB=1+Math.floor(Math.random()*99999);renderSbq();genSwB()}
function sbRev(id){$(id).classList.toggle('show')}
function sbTf(i,v,t,c,b){const ok=(v==t);b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');$('tf'+i).innerHTML=ok?`<span class="msg ok">🎉 बरोबर! ${t?'हे विधान बरोबर आहे.':'हे विधान चूक आहे. बरोबर : '+c}</span>`:`<span class="msg no">✘ पुन्हा विचार करा.</span>`}
function sbMt(){const d=sbData(SB);let ok=0;d.mt.forEach((x,i)=>{const s=$('sm'+i),good=LET[d.mtB.findIndex(y=>y[1]==i)];const g=s.value===good;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$('smm').innerHTML=ok==d.mt.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${d.mt.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function renderSbq(){const d=sbData(SB);let h=`<div class="card"><h2>✍️ अधिक स्वाध्याय · संच क्र. ${SB}</h2><button class="btn gr" onclick="newSb()">🎲 नवे प्रश्न</button></div>`;
 h+=`<div class="card"><h2>प्र.1 रिकाम्या जागा भरा.</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड्या जुळवा.</h2><table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">तपासा</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 बरोबर की चूक?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ बरोबर</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ चूक</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एका वाक्यात उत्तरे लिहा.</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 थोडक्यात उत्तरे लिहा.</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक स्वाध्याय',30,sc)+`<div class="ds">संच क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिकाम्या जागा भरा. (6 गुण)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड्या जुळवा. (5 गुण)</div><table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 खालील विधाने बरोबर की चूक ते लिहा. चूक असल्यास दुरुस्त करून लिहा. (6 गुण)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एका वाक्यात उत्तरे लिहा. (5 गुण)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 थोडक्यात उत्तरे लिहा. (8 गुण)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'बरोबर':'चूक – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक मुद्दे)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

/* ---------- 4. HOTS ---------- */
function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><h2>🧠 उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न</h2><p>पाठाच्या आशयावर आधारित पण पाठ्यपुस्तकाबाहेरील प्रश्न. स्वतः उत्तर लिहून मग ‘मार्गदर्शक मुद्दे’ पाहा.</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक मुद्दे:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्रिका (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न',n*3,sc)+`<div class="ds">संच क्र. ${seed} · स्वतःच्या शब्दांत सविस्तर उत्तरे लिहा.</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 गुण)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक मुद्दे (शिक्षकांसाठी) – संच ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}
