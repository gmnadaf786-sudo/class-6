500 = ₹ 5000\nप्रत्येकीला = 5000 ÷ 10 = ₹ 500"]]}, {"h": "सरावसंच 12.2 – शाब्दिक उदाहरणे सोडवा", "t": "qa", "lines": 5, "items": [["इक्बालने जुनी गाडी ₹ 2,75,000 ला घेतली, दुरुस्तीवर ₹ 65,000 खर्च केला व ₹ 3,89,000 ला विकली. नफा झाला की तोटा? किती?", "एकूण खरेदी किंमत = 275000 + 65000 = ₹ 340000\nविक्री किंमत = ₹ 389000\nविक्री > खरेदी, म्हणून नफा\nनफा = 389000 − 340000 = ₹ 49000"], ["कुसुमने ₹ 4,750 खर्चून कांद्याच्या गोण्या घेतल्या. विकून ₹ 450 तोटा झाला. गोण्या किती रुपयांना विकल्या?", "खरेदी किंमत = ₹ 4750, तोटा = ₹ 450\nविक्री किंमत = खरेदी किंमत − तोटा\n= 4750 − 450 = ₹ 4300"], ["साराने चित्रकला साहित्य विकून ₹ 1,285 मिळवले. तिला ₹ 375 नफा झाला. साहित्याची खरेदी किंमत किती?", "विक्री किंमत = ₹ 1285, नफा = ₹ 375\nखरेदी किंमत = विक्री किंमत − नफा\n= 1285 − 375 = ₹ 910"], ["प्रियाने हस्तकला वस्तूंच्या साहित्यासाठी ₹ 2,505 व पॅकिंगसाठी ₹ 455 खर्च केले. सर्व वस्तू ₹ 3,480 ला विकल्या. नफा/तोटा किती?", "एकूण खरेदी किंमत = 2505 + 455 = ₹ 2960\nविक्री किंमत = ₹ 3480\nविक्री > खरेदी, म्हणून नफा\nनफा = 3480 − 2960 = ₹ 520"], ["आकाशने मेथीसाठी बियाणे ₹ 850, शेणखत व औषधे ₹ 1,250, मजुरी ₹ 1,650, वाहतूक ₹ 800 खर्च केले. 450 जुड्या ₹ 25 प्रमाणे विकल्या. नफा किती?", "एकूण खरेदी किंमत = 850 + 1250 + 1650 + 800 = ₹ 4550\nविक्री किंमत = 450 × 25 = ₹ 11250\nनफा = 11250 − 4550 = ₹ 6700"], ["संगीताने 12 साड्या जीएसटीसह ₹ 10,800 ला घेतल्या, वाहतूक ₹ 750. सर्व साड्या विकून ₹ 5,250 नफा झाला. एका साडीची विक्री किंमत किती?", "एकूण खरेदी किंमत = 10800 + 750 = ₹ 11550\nएकूण विक्री किंमत = खरेदी + नफा = 11550 + 5250 = ₹ 16800\nएका साडीची विक्री किंमत = 16800 ÷ 12 = ₹ 1400"]]}, {"h": "स्वाध्याय 12 – (1) योग्य पर्याय निवडा", "t": "mcq", "items": [["खरेदी किंमत ₹ 418 व नफा ₹ 72 असल्यास विक्री किंमत किती?", ["₹ 360", "₹ 490", "₹ 346", "₹ 418"], 1], ["विक्री किंमत ₹ 1275 व तोटा ₹ 84 असल्यास खरेदी किंमत किती?", ["1359", "1275", "191", "1191"], 0]]}, {"h": "स्वाध्याय 12 – (2) उत्तरे काढा", "t": "qa", "lines": 4, "items": [["पर्यावरणपूरक पिशव्या ₹ 357 ला घेतल्या व ₹ 418 ला विकल्या. नफा किती?", "खरे const SCI="<!DOCTYPE html>\n<html lang=\"mr\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>6वी गणित – नफा-तोटा<\/title>\n<style>\n:root{--b:#1d4ed8;--g:#15803d;--o:#ea580c;--bg:#f1f5f9;--ink:#0f172a;--mut:#64748b}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;background:#fff;color:var(--ink);font-family:\"Noto Sans Devanagari\",\"Mukta\",\"Segoe UI\",system-ui,sans-serif;font-size:17px;line-height:1.5}\n.wrap{max-width:760px;margin:0 auto;padding:12px}\n.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0001}\nh2{margin:0 0 6px;font-size:20px;color:var(--b)}\n.step{font-size:13px;color:var(--mut);font-weight:700}\n.btn{display:inline-block;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;margin:4px 4px 4px 0}\n.btn.gr{background:var(--g)}.btn.or{background:var(--o)}.btn.ln{background:#e2e8f0;color:#1e293b}\n.btn:disabled{opacity:.4}\n.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}\n.chip{padding:8px 14px;border-radius:999px;background:#e2e8f0;font-weight:700;border:2px solid transparent;cursor:pointer;user-select:none}\n.chip.on{background:#dbeafe;border-color:var(--b);color:var(--b)}\n.chip.ok{background:#dcfce7;border-color:#16a34a;color:#166534}.chip.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}\nsvg{max-width:100%;height:auto}\n.fig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;margin:6px 0}\n.fig>div{text-align:center;font-size:14px;font-weight:700;min-width:100px}\ntable.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}\ntable.t th,table.t td{border:1.5px solid #94a3b8;padding:6px;text-align:center}\ntable.t th{background:#dbeafe}\ntable.t td.l{text-align:left;font-weight:700;background:#f8fafc}\ntable.t tr.hi td{background:#fef9c3}\ninput.n{width:70px;font:inherit;font-size:17px;text-align:center;padding:5px;border:2px solid #94a3b8;border-radius:8px}\n.msg{margin-top:6px;padding:8px 10px;border-radius:10px;font-weight:600}\n.msg.ok{background:#dcfce7;color:#166534}.msg.no{background:#fee2e2;color:#991b1b}.msg.in{background:#fef9c3;color:#713f12}\n.say{float:right;border:0;background:#eff6ff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;color:var(--b);cursor:pointer}\n.key{background:#fef9c3;border-left:5px solid #eab308;padding:8px 10px;border-radius:8px;margin:8px 0}\n.big{font-size:22px;font-weight:800;text-align:center}\ninput[type=range]{width:100%}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<div id=\"stepBox\"><\/div>\n<\/div>\n<script>\n/* ---------- common ---------- */\nfunction say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;\n const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}\nconst C='#1e293b',BL='#2563eb',RD='#dc2626',GR='#16a34a',OR='#ea580c';\nconst f=v=>(+v).toFixed(1);\nfunction ah(x1,y1,x2,y2,col){const a=Math.atan2(y2-y1,x2-x1),L=12,W=6;const bx=x2-L*Math.cos(a),by=y2-L*Math.sin(a);\n return `<polygon points=\"${f(x2)},${f(y2)} ${f(bx-W*Math.sin(a))},${f(by+W*Math.cos(a))} ${f(bx+W*Math.sin(a))},${f(by-W*Math.cos(a))}\" fill=\"${col||C}\"/>`}\nfunction ln(x1,y1,x2,y2,o){o=o||{};const col=o.c||C;let s=`<line x1=\"${f(x1)}\" y1=\"${f(y1)}\" x2=\"${f(x2)}\" y2=\"${f(y2)}\" stroke=\"${col}\" stroke-width=\"${o.w||3}\" stroke-linecap=\"round\"${o.d?' stroke-dasharray=\"6 5\"':''}/>`;\n if(o.e)s+=ah(x1,y1,x2,y2,col);if(o.s)s+=ah(x2,y2,x1,y1,col);return s}\nfunction dot(x,y,lab,dx,dy,col){return `<circle cx=\"${f(x)}\" cy=\"${f(y)}\" r=\"5\" fill=\"${col||C}\"/>`+(lab?`<text x=\"${f(x+(dx||0))}\" y=\"${f(y+(dy==null?-10:dy))}\" font-size=\"17\" font-weight=\"700\" text-anchor=\"middle\" fill=\"${col||C}\">${lab}<\/text>`:'')}\nconst svg=(w,h,inner,pw)=>`<svg viewBox=\"0 0 ${w} ${h}\" width=\"${pw||w}\">${inner}<\/svg>`;\nfunction rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}\nfunction shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\n\n/* ---------- steps : नफा-तोटा ---------- */\nlet S=0;const SN=7;\nconst st={cp:650,sp:720,q2:0,q2m:'',fm:0,ex:0,ek:0,ex2:0,ek2:0,pr:null,prm:'',hint:false};\nfunction sx(t){return `<button class=\"say\" onclick=\"say(this.dataset.t)\" data-t=\"${t.replace(/\"/g,'&quot;')}\">🗣 ऐका<\/button>`}\nfunction nav(){return `<div class=\"nav\"><button class=\"btn ln\" ${S==0?'disabled':''} onclick=\"go(-1)\">◀ मागे<\/button><span class=\"step\">${S+1} / ${SN}<\/span><button class=\"btn\" ${S==SN-1?'disabled':''} onclick=\"go(1)\">पुढे ▶<\/button><\/div>`}\nfunction go(d){S=Math.max(0,Math.min(SN-1,S+d));drawStep();try{window.parent.document.getElementById('sf').scrollIntoView()}catch(x){}}\nfunction drawStep(){document.getElementById('stepBox').innerHTML=[s0,s1,s2,s3,s4,s5,s6][S]()+nav()}\nconst R=n=>'₹ '+(+n).toLocaleString('en-IN');\nconst BOX=a=>`<div style=\"border:2px solid #cbd5e1;border-radius:12px;padding:8px 14px;font-size:18px;line-height:1.9\">${a}<\/div>`;\nfunction barPair(cp,sp){const M=Math.max(cp,sp)*1.05,W=280,x=v=>v/M*W;let g=`<text x=\"0\" y=\"16\" font-size=\"13\" font-weight=\"700\">खरेदी<\/text><rect x=\"60\" y=\"4\" width=\"${f(x(cp))}\" height=\"20\" fill=\"#60a5fa\" rx=\"3\"/><text x=\"${f(64+x(cp))}\" y=\"19\" font-size=\"12\">${cp}<\/text>`;\n g+=`<text x=\"0\" y=\"50\" font-size=\"13\" font-weight=\"700\">विक्री<\/text><rect x=\"60\" y=\"38\" width=\"${f(x(sp))}\" height=\"20\" fill=\"${sp>=cp?'#4ade80':'#f87171'}\" rx=\"3\"/><text x=\"${f(64+x(sp))}\" y=\"53\" font-size=\"12\">${sp}<\/text>`;\n if(sp!=cp)g+=`<rect x=\"${f(60+x(Math.min(cp,sp)))}\" y=\"62\" width=\"${f(x(Math.abs(sp-cp)))}\" height=\"10\" fill=\"${sp>cp?'#16a34a':'#dc2626'}\"/>`;\n return svg(380,76,g,340)}\n\n/* पायरी 1 : संकल्पना */\nfunction s0(){const {cp,sp}=st,t='व्यापारी वस्तू ज्या किमतीला विकत घेतो ती खरेदी किंमत. ज्या किमतीला विकतो ती विक्री किंमत. विक्री किंमत जास्त असेल तर नफा, कमी असेल तर तोटा.';\n const p=sp-cp;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 1<\/div><h2>खरेदी किंमत, विक्री किंमत, नफा व तोटा<\/h2>\n <div>🛒 खरेदी किंमत : <b>${R(cp)}<\/b><\/div><input type=\"range\" min=\"100\" max=\"1000\" step=\"10\" value=\"${cp}\" oninput=\"st.cp=+this.value;drawStep()\">\n <div>💰 विक्री किंमत : <b>${R(sp)}<\/b><\/div><input type=\"range\" min=\"100\" max=\"1000\" step=\"10\" value=\"${sp}\" oninput=\"st.sp=+this.value;drawStep()\">\n <div class=\"fig\">${barPair(cp,sp)}<\/div>\n ${BOX(p>0?`विक्री किंमत > खरेदी किंमत, म्हणून <b style=\"color:#15803d\">नफा<\/b><br>नफा = विक्री किंमत − खरेदी किंमत = ${sp} − ${cp} = <b style=\"color:#15803d\">${R(p)}<\/b>`:p<0?`खरेदी किंमत > विक्री किंमत, म्हणून <b style=\"color:#dc2626\">तोटा<\/b><br>तोटा = खरेदी किंमत − विक्री किंमत = ${cp} − ${sp} = <b style=\"color:#dc2626\">${R(-p)}<\/b>`:'खरेदी किंमत = विक्री किंमत, म्हणून <b>ना नफा ना तोटा<\/b>')}\n <div class=\"key\">• <b>नफा = विक्री किंमत − खरेदी किंमत<\/b> (विक्री जास्त)<br>• <b>तोटा = खरेदी किंमत − विक्री किंमत<\/b> (खरेदी जास्त)<br>• अक्षरांत : P = S − C, L = C − S<\/div><\/div>`}\n\n/* पायरी 2 : नफा की तोटा */\nconst Q2=[[650,720],[1390,1215],[2750,2560],[8195,8266],[7500,8250],[357,418],[143,128],[7450,6820]];\nfunction s1(){const [c,s]=Q2[st.q2],t='खरेदी व विक्री किंमतींची तुलना करून नफा की तोटा ते ठरवा आणि किती ते काढा.';\n const ans=s>c?'नफा':s<c?'तोटा':'ना नफा ना तोटा';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 2<\/div><h2>नफा झाला की तोटा?<\/h2>\n <div class=\"chips\">${Q2.map((x,i)=>`<span class=\"chip ${i==st.q2?'on':''}\" onclick=\"st.q2=${i};st.q2m='';drawStep()\">${i+1}<\/span>`).join('')}<\/div>\n <table class=\"t\"><tr><th>खरेदी किंमत<\/th><th>विक्री किंमत<\/th><\/tr><tr><td style=\"font-size:20px\">${R(c)}<\/td><td style=\"font-size:20px\">${R(s)}<\/td><\/tr><\/table>\n <div class=\"chips\">${['नफा','तोटा','ना नफा ना तोटा'].map(o=>`<span class=\"chip\" onclick=\"st.q2m='${o}'=='${ans}'?'ok':'no';drawStep()\">${o}<\/span>`).join('')}<\/div>\n ${st.q2m?`<div class=\"msg ${st.q2m}\">${st.q2m=='ok'?'✔ बरोबर!':'✘ पुन्हा तुलना करा.'}<\/div>${st.q2m=='ok'?BOX(`${s>c?'विक्री किंमत > खरेदी किंमत, म्हणून नफा':'खरेदी किंमत > विक्री किंमत, म्हणून तोटा'}<br>${ans} = ${s>c?`विक्री किंमत − खरेदी किंमत = ${s} − ${c}`:`खरेदी किंमत − विक्री किंमत = ${c} − ${s}`} = <b>${R(Math.abs(s-c))}<\/b>`):''}`:''}<\/div>`}\n\n/* पायरी 3 : सूत्रे उलटी वापरा */\nconst FM=[['खरेदी किंमत ₹ 418, नफा ₹ 72. विक्री किंमत?','विक्री किंमत = खरेदी किंमत + नफा','418 + 72','₹ 490',[418,72,'+']],\n ['विक्री किंमत ₹ 1285, नफा ₹ 375. खरेदी किंमत?','खरेदी किंमत = विक्री किंमत − नफा','1285 − 375','₹ 910',[910,375,'+']],\n ['खरेदी किंमत ₹ 4750, तोटा ₹ 450. विक्री किंमत?','विक्री किंमत = खरेदी किंमत − तोटा','4750 − 450','₹ 4300',[4300,450,'−']],\n ['विक्री किंमत ₹ 1275, तोटा ₹ 84. खरेदी किंमत?','खरेदी किंमत = विक्री किंमत + तोटा','1275 + 84','₹ 1359',[1275,84,'−']]];\nfunction s2(){const m=FM[st.fm],t='नफा असेल तर विक्री किंमत म्हणजे खरेदी किंमत अधिक नफा. तोटा असेल तर विक्री किंमत म्हणजे खरेदी किंमत वजा तोटा.';\n const [a,b,o]=m[4],W=280,M=a+b;const g=o=='+'?`<rect x=\"0\" y=\"10\" width=\"${a/M*W}\" height=\"26\" fill=\"#60a5fa\"/><rect x=\"${a/M*W}\" y=\"10\" width=\"${b/M*W}\" height=\"26\" fill=\"#4ade80\"/><text x=\"4\" y=\"28\" font-size=\"12\">खरेदी<\/text><text x=\"${a/M*W+4}\" y=\"28\" font-size=\"12\">नफा<\/text><line x1=\"0\" y1=\"44\" x2=\"${W}\" y2=\"44\" stroke=\"#1e293b\" stroke-width=\"2\"/><text x=\"${W/2}\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">विक्री किंमत<\/text>`\n  :`<rect x=\"0\" y=\"10\" width=\"${a/M*W}\" height=\"26\" fill=\"#4ade80\"/><rect x=\"${a/M*W}\" y=\"10\" width=\"${b/M*W}\" height=\"26\" fill=\"#f87171\"/><text x=\"4\" y=\"28\" font-size=\"12\">विक्री<\/text><text x=\"${a/M*W+4}\" y=\"28\" font-size=\"12\">तोटा<\/text><line x1=\"0\" y1=\"44\" x2=\"${W}\" y2=\"44\" stroke=\"#1e293b\" stroke-width=\"2\"/><text x=\"${W/2}\" y=\"60\" font-size=\"12\" text-anchor=\"middle\">खरेदी किंमत<\/text>`;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 3<\/div><h2>विक्री किंवा खरेदी किंमत काढणे<\/h2>\n <div class=\"chips\">${FM.map((x,i)=>`<span class=\"chip ${i==st.fm?'on':''}\" onclick=\"st.fm=${i};drawStep()\">${i+1}<\/span>`).join('')}<\/div>\n <div class=\"key\" style=\"font-size:18px\">${m[0]}<\/div>\n <div class=\"fig\">${svg(W,64,g,300)}<\/div>\n ${BOX(`${m[1]}<br>= ${m[2]}<br>= <b style=\"color:#15803d\">${m[3]}<\/b>`)}\n <table class=\"t\"><tr><th>नफा असल्यास<\/th><th>तोटा असल्यास<\/th><\/tr><tr><td>विक्री = खरेदी + नफा<\/td><td>विक्री = खरेदी − तोटा<\/td><\/tr><tr><td>खरेदी = विक्री − नफा<\/td><td>खरेदी = विक्री + तोटा<\/td><\/tr><\/table><\/div>`}\n\n/* पायरी 4 : एकूण खरेदी किंमत */\nconst TC=[['इक्बालने जुनी गाडी ₹ 2,75,000 ला घेतली, दुरुस्ती ₹ 65,000 व ₹ 3,89,000 ला विकली.',[['गाडी',275000],['दुरुस्ती',65000]],389000],\n ['प्रियाने साहित्य ₹ 2,505 व पॅकिंग ₹ 455 खर्च करून वस्तू ₹ 3,480 ला विकल्या.',[['साहित्य',2505],['पॅकिंग',455]],3480],\n ['आकाश : बियाणे ₹ 850, शेणखत-औषधे ₹ 1,250, मजुरी ₹ 1,650, वाहतूक ₹ 800; 450 जुड्या ₹ 25 प्रमाणे विकल्या.',[['बियाणे',850],['खत',1250],['मजुरी',1650],['वाहतूक',800]],11250]];\nfunction s3(){const x=TC[st.ex],tot=x[1].reduce((a,b)=>a+b[1],0),p=x[2]-tot,t='वस्तू खरेदी करताना वाहतूक, दुरुस्ती, मजुरी असे इतर खर्चही होतात. हे सर्व खर्च खरेदी किमतीत मिळवून एकूण खरेदी किंमत काढतात.';\n const cols=['#60a5fa','#a78bfa','#fbbf24','#f472b6'];let g='',xx=0;const M=Math.max(tot,x[2]),W=300;\n x[1].forEach(([n,v],i)=>{g+=`<rect x=\"${f(xx)}\" y=\"4\" width=\"${f(v/M*W)}\" height=\"24\" fill=\"${cols[i]}\"/>`;xx+=v/M*W});\n g+=`<rect x=\"0\" y=\"34\" width=\"${f(x[2]/M*W)}\" height=\"24\" fill=\"#4ade80\"/><text x=\"4\" y=\"51\" font-size=\"12\">विक्री<\/text>`;\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 4<\/div><h2>एकूण खरेदी किंमत (इतर खर्चासह)<\/h2>\n <div class=\"chips\">${TC.map((v,i)=>`<span class=\"chip ${i==st.ex?'on':''}\" onclick=\"st.ex=${i};drawStep()\">${['🚗 गाडी','🎁 हस्तकला','🌿 मेथी'][i]}<\/span>`).join('')}<\/div>\n <div class=\"key\" style=\"font-size:17px\">${x[0]}<\/div>\n <div class=\"fig\">${svg(W,60,g,300)}<\/div>\n <div style=\"font-size:13px;text-align:center\">${x[1].map((v,i)=>`<span style=\"color:${cols[i]}\">■<\/span> ${v[0]}`).join(' &nbsp; ')}<\/div>\n ${BOX(`एकूण खरेदी किंमत = ${x[1].map(v=>v[1]).join(' + ')} = <b>${R(tot)}<\/b><br>${st.ex==2?`विक्री किंमत = 450 × 25 = ${R(11250)}<br>`:''}विक्री किंमत > एकूण खरेदी किंमत, म्हणून नफा<br>नफा = ${x[2]} − ${tot} = <b style=\"color:#15803d\">${R(p)}<\/b>`)}\n <div class=\"key\">❗ वाहतूक, दुरुस्ती, मजुरी हे खर्च <b>खरेदी किमतीत मिळवा<\/b> – मग नफा/तोटा काढा.<\/div><\/div>`}\n\n/* पायरी 5-6 : बहुपायरी उदाहरणे */\nconst EX=[['रखमाने 72 कोथिंबिरीच्या जुड्या ₹ 864 ला घेतल्या. 8 जुड्या खराब झाल्या. उरलेल्या जुड्या ₹ 15 ला एक याप्रमाणे विकल्या. नफा झाला की तोटा? किती?',['खरेदी किंमत = ₹ 864','उरलेल्या जुड्या = 72 − 8 = 64','विक्री किंमत = 64 × 15 = ₹ 960','विक्री किंमत > खरेदी किंमत, म्हणून नफा','नफा = 960 − 864 = ₹ 96']],\n ['भाजीविक्रेत्याने 342 किलो टोमॅटो ₹ 8,208 ला घेतले. 318 किलो ₹ 25 प्रति किलो दराने विकले, 24 किलो खराब झाले. तोटा किती?',['खरेदी किंमत = ₹ 8208','विक्री किंमत = 318 × 25 = ₹ 7950','खरेदी किंमत > विक्री किंमत, म्हणून तोटा','तोटा = 8208 − 7950 = ₹ 258']],\n ['ज्यूलीने 72 कंपासपेट्या प्रत्येकी ₹ 145 प्रमाणे घेतल्या, वाहतूक ₹ 628. प्रत्येक पेटी ₹ 162 ला विकली. नफा/तोटा किती?',['मूळ खरेदी किंमत = 72 × 145 = ₹ 10440','एकूण खरेदी किंमत = 10440 + 628 = ₹ 11068','विक्री किंमत = 72 × 162 = ₹ 11664','विक्री > खरेदी, म्हणून नफा','नफा = 11664 − 11068 = ₹ 596']],\n ['संगीताने 12 साड्या ₹ 10,800 ला घेतल्या, वाहतूक ₹ 750. सर्व साड्या विकून ₹ 5,250 नफा झाला. एका साडीची विक्री किंमत किती?',['एकूण खरेदी किंमत = 10800 + 750 = ₹ 11550','एकूण विक्री किंमत = खरेदी + नफा = 11550 + 5250 = ₹ 16800','एका साडीची विक्री किंमत = 16800 ÷ 12 = ₹ 1400']],\n ['महिला बचत गट (10 महिला) : खर्च ₹ 20,000, विक्रीतून ₹ 26,500. नफ्यातून ₹ 1,500 शालेय साहित्यास दिले, उरलेली रक्कम समान वाटली. प्रत्येकीला किती?',['नफा = 26500 − 20000 = ₹ 6500','वाटपासाठी रक्कम = 6500 − 1500 = ₹ 5000','प्रत्येकीला = 5000 ÷ 10 = ₹ 500']]];\nfunction exStep(idx,kk,list){const e=EX[st[idx]],k=st[kk];\n return `<div class=\"chips\">${list.map(i=>`<span class=\"chip ${i==st[idx]?'on':''}\" onclick=\"st.${idx}=${i};st.${kk}=0;drawStep()\">${['🌿 कोथिंबीर','🍅 टोमॅटो','🧭 कंपासपेटी','🥻 साड्या','👩‍👩‍👧 बचत गट'][i]}<\/span>`).join('')}<\/div>\n <div class=\"key\" style=\"font-size:17px\">${e[0]}<\/div>\n ${BOX(e[1].slice(0,k).map((s,i)=>`<div style=\"${i==e[1].length-1?'color:#15803d;font-weight:800':''}\">${s}<\/div>`).join('')||'<span style=\"color:#94a3b8;font-size:15px\">‘पुढची पायरी’ दाबा.<\/span>')}\n <button class=\"btn\" ${k>=e[1].length?'disabled':''} onclick=\"st.${kk}++;drawStep()\">▶ पुढची पायरी<\/button><button class=\"btn ln\" onclick=\"st.${kk}=0;drawStep()\">↺ पुन्हा<\/button>`}\nfunction s4(){const t='नग आणि दर दिला असेल तर नग गुणिले दर करून एकूण किंमत काढा. खराब झालेल्या वस्तू विक्रीतून वगळा.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 5<\/div><h2>नग × दर : बहुपायरी उदाहरणे<\/h2>${exStep('ex','ek',[0,1,2])}\n <div class=\"key\">• एकूण किंमत = नग × एका नगाची किंमत.<br>• खराब झालेल्या वस्तू विकल्या जात नाहीत – त्या वजा करून विक्री काढा; खरेदी किंमत मात्र पूर्ण.<\/div><\/div>`}\nfunction s5(){const t='काही उदाहरणांत नफा दिलेला असतो आणि विक्री किंमत काढायची असते, किंवा नफ्याचे वाटप करायचे असते. पायऱ्या क्रमाने सोडवा.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 6<\/div><h2>नफ्याचा उपयोग व वाटप<\/h2>${exStep('ex2','ek2',[3,4])}\n <div class=\"key\">उदाहरण सोडवण्याच्या पायऱ्या : 1) दिलेले लिहा 2) एकूण खरेदी/विक्री काढा 3) नफा/तोटा ठरवा 4) विचारलेले उत्तर काढा.<\/div><\/div>`}\n\n/* पायरी 7 : आता तुम्ही सोडवा */\nfunction newPr(){const k=rnd(0,3),c=rnd(20,900)*10,d=rnd(5,150)*5;\n if(k==0){const s=Math.random()<.5?c+d:c-d;st.pr={q:`खरेदी किंमत ${R(c)}, विक्री किंमत ${R(s)}. ${s>c?'नफा':'तोटा'} किती?`,a:d,h:s>c?`नफा = विक्री − खरेदी = ${s} − ${c}`:`तोटा = खरेदी − विक्री = ${c} − ${s}`}}\n else if(k==1){st.pr={q:`खरेदी किंमत ${R(c)}, नफा ${R(d)}. विक्री किंमत किती?`,a:c+d,h:`विक्री = खरेदी + नफा = ${c} + ${d}`}}\n else if(k==2){st.pr={q:`विक्री किंमत ${R(c)}, तोटा ${R(d)}. खरेदी किंमत किती?`,a:c+d,h:`खरेदी = विक्री + तोटा = ${c} + ${d}`}}\n else{const n=rnd(10,60),r=rnd(10,90),tr=rnd(1,30)*10,s=rnd(r+2,r+30);st.pr={q:`${n} वस्तू प्रत्येकी ${R(r)} प्रमाणे घेतल्या, वाहतूक ${R(tr)}. प्रत्येक वस्तू ${R(s)} ला विकली. नफा/तोटा किती रुपये?`,a:Math.abs(n*s-(n*r+tr)),h:`एकूण खरेदी = ${n} × ${r} + ${tr} = ${n*r+tr}; विक्री = ${n} × ${s} = ${n*s}`}}\n st.prm='';st.hint=false}\nfunction s6(){if(!st.pr)newPr();const p=st.pr,t='उदाहरण सोडवा.';\n return `<div class=\"card\">${sx(t)}<div class=\"step\">पायरी 7<\/div><h2>आता तुम्ही सोडवा<\/h2>\n <div class=\"key\" style=\"font-size:18px\">${p.q}<\/div><div class=\"big\">₹ <input class=\"n\" id=\"pra\" style=\"width:120px;font-size:22px\" inputmode=\"numeric\"><\/div>\n <button class=\"btn gr\" onclick=\"chkPr()\">तपासा<\/button><button class=\"btn or\" onclick=\"st.hint=!st.hint;drawStep()\">💡 मदत<\/button>\n ${st.hint?`<div class=\"key\">${p.h}<\/div>`:''}<div>${st.prm}<\/div><button class=\"btn ln\" onclick=\"newPr();drawStep()\">🔄 दुसरे उदाहरण<\/button><\/div>`}\nfunction chkPr(){const raw=document.getElementById('pra').value.trim().replace(/,/g,''),p=st.pr;\n st.prm=+raw===p.a&&raw!==''?`<div class=\"msg ok\">🎉 बरोबर! ${R(p.a)}<\/div>`:'<div class=\"msg no\">✘ अजून नाही. 💡 मदत पाहा.<\/div>';drawStep();document.getElementById('pra').value=raw}\n\ndrawStep();\n<\/script>\n<\/body>\n<\/html>\n";
const L={name:'पाठ 12 : नफा-तोटा',cls:'इयत्ता : 6वी &nbsp; विषय : गणित',foot:'इ. 6वी गणित · पाठ 12'};

<script>
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,R){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='mr-IN';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/mr/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/hi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sx=t=>`<button class="say" onclick="say(this.dataset.t)" data-t="${esc(t).replace(/"/g,'&quot;')}">🗣 ऐका</button>`;
const LET=['अ','ब','क','ड','इ'];
let view='home';

<button class="hc" onclick="go('learn')"><div class="ic">📖</div><h2>1. शिकू या</h2><p>पायरी-पायरीने पाठ समजून घ्या – कृतीसह, स्वतः तपासा</p></button>
<button class="hc" onclick="go('mcq')"><div class="ic">❓</div><h2>2. MCQ प्रश्न</h2><p>बहुपर्यायी सराव + A4 PDF (उत्तरसूचीसह)</p></button>
<button class="hc" onclick="go('sw')"><div class="ic">✍️</div><h2>3. स्वाध्याय</h2><p>अ) पुस्तकातील · ब) अधिक (पुस्तकाबाहेरील) – PDF</p></button>

const symGrid=()=>`<div class="sg">${SYM.map(s=>`<div class="sc" onclick="this.classList.toggle('on')"><div class="sy">${s[0]}</div><div class="sf">❓ कोणता धर्म?<br><small>(टिचकी मारा)</small></div><div class="sb"><b>${s[1]}</b><br><small>${s[2]}</small></div></div>`).join('')}</div>`;

const qimg=k=>`<img src="${IM[k]}" style="width:100%;max-width:300px;border-radius:10px;display:block;margin:6px 0">`;
let WID=0;
function chipsInfo(items){const id='ci'+(++WID);return `<div class="chips" id="${id}c">${items.map((x,i)=>`<button class="chip" onclick="ci('${id}',${i})">${x[0]}</button>`).join('')}</div><div class="info" id="${id}">👆 एखाद्या शब्दावर टिचकी मारा.</div>`+`<script type="text/plain" id="${id}d">${esc(JSON.stringify(items.map(x=>x[1])))}<\/script>`}
function ci(id,i){const d=JSON.parse($(id+'d').textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'));$(id).innerHTML=d[i];[...$(id+'c').children].forEach((c,j)=>c.classList.toggle('on',i==j))}
const flip=(q,a)=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="fq">❓ ${q}</div><div class="fa">✔ ${a}</div></div>`;
function mini(q,opts,ans,why){const id='mq'+(++WID);return `<div class="mini" id="${id}"><b>🧩 स्वतः तपासा:</b> ${q}${opts.map((o,i)=>`<button class="opt" onclick="mqa('${id}',this,${i==ans},'${esc(why).replace(/'/g,"\\'")}')">${o}</button>`).join('')}<div class="mm"></div></div>`}
function mqa(id,b,ok,why){const box=$(id);if(box.dataset.done)return;b.classList.add(ok?'ok':'no');const mm=box.querySelector('.mm');
 if(ok){box.dataset.done=1;mm.innerHTML=`<div class="msg ok">🎉 बरोबर! ${why}</div>`;LS.pts++;updProg()}else mm.innerHTML='<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>'}
function ordGame(title,items){const id='og'+(++WID);const R=rng(7+WID);const sh=shuf(items.map((x,i)=>[x,i]),R);
 return `<div class="mini" id="${id}" data-n="${items.length}" data-k="0"><b>🔢 ${title}</b><div class="ord">${sh.map(([x,i])=>`<button class="opt" data-i="${i}" onclick="ogc('${id}',this)">${x}</button>`).join('')}</div><div class="mm">क्रमाने एकेक घटना निवडा.</div></div>`}
function ogc(id,b){const box=$(id);let k=+box.dataset.k;if(b.classList.contains('ok'))return;const mm=box.querySelector('.mm');
 if(+b.dataset.i===k){b.classList.add('ok');b.innerHTML=(k+1)+'. '+b.innerHTML;box.dataset.k=++k;mm.innerHTML=k==box.dataset.n?'<div class="msg ok">🎉 सर्व क्रम बरोबर!</div>':'<div class="msg in">बरोबर! पुढची घटना कोणती?</div>';if(k==box.dataset.n){LS.pts++;updProg()}}
 else mm.innerHTML='<div class="msg no">✘ ही घटना आता नाही. विचार करून पुन्हा निवडा.</div>'}

 const q=MC.qs[MC.i];b.innerHTML=`<h2>❓ सराव (${MC.i+1}/${MC.qs.length}) <small style="float:right">⭐ ${MC.sc}</small></h2><div class="prog"><i style="width:${MC.i/MC.qs.length*100}%"></i></div><p><b>${q.q}</b></p>${q.o.map((o,i)=>`<button class="opt" onclick="mcA(${i},this)">${LET[i]}) ${o}</button>`).join('')}<div id="mcm"></div>`}

 $('mcm').innerHTML=`<div class="msg ${i==q.a?'ok':'no'}">${i==q.a?'🎉 बरोबर!':'✘ चुकले.'} ${q.e}</div><button class="btn" onclick="MC.i++;if(MC.i>=MC.qs.length)MC.done=true;drawMc()">${MC.i==MC.qs.length-1?'निकाल पाहा':'पुढचा प्रश्न ▶'}</button>`}
function genMcq(){const n=+$('mn').value,seed=+$('seed').value||1,R=rng(seed);const qs=shuf(MCQ,R).slice(0,n).map(q=>mkq(q,R));
 let h=dHead('MCQ चाचणी',n,$('sch').value.trim())+`<div class="ds">संच क्र. ${seed} · योग्य पर्याय निवडून उत्तर कंसात लिहा.</div>`+
 qs.map((q,i)=>`<div class="qb"><div>${i+1}. ${q.q} <b>( &nbsp;&nbsp;&nbsp; )</b></div><div class="opts">${q.o.map((o,j)=>`<span>${LET[j]}) ${o}</span>`).join('')}</div></div>`).join('');

 else if(b.t=='match')h+=`<table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${b.L.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x}</td><td><select id="${id('s'+i)}"><option value="">–</option>${b.R.map((r,j)=>`<option>${LET[j]}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${b.R.map((r,j)=>`<li>${LET[j]}) ${r}</li>`).join('')}</ul><button class="btn gr" onclick="swMt(${bi})">तपासा</button><div id="${id('m')}"></div>`;
 else if(b.t=='table')h+=`<table class="t"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${mk(c)}</td>`).join('')}</tr>`).join('')}</table><button class="btn ln" onclick="document.querySelectorAll('#sw${bi}c .ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`.replace('<table class="t">',`<div id="sw${bi}c"><table class="t">`).replace('</table>','</table></div>');
 else if(b.t=='order')h+=ordGame('क्रमाने लावा',b.items)+`<div class="msg in">योग्य क्रम : ${b.items.map((x,i)=>`${i+1}) ${x}`).join(' → ')}</div>`;
 else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qcard">${qimg(it[0])}${i+1}. ${it[2]||''}<br>${ansBtn(id('a'+i))}<div class="ans" id="${id('a'+i)}">✔ ${it[1]}</div></div>`).join('');
 else if(b.t=='concept')h+=`<div style="text-align:center"><b>${b.center}</b><br>⬇<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">${b.leaves.map(x=>`<span class="ans2" style="padding:6px 10px">${x}</span>`).join('')}</div></div><div id="sw${bi}c"></div><button class="btn ln" onclick="document.querySelectorAll('.ans2').forEach(e=>e.classList.toggle('rev'))">👁 उत्तरे दाखवा</button>`;
 else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 return h+'</div>'}
function swM(id,b,ok,a){const box=$(id);if(box.dataset.d)return;b.classList.add(ok?'ok':'no');if(ok)box.dataset.d=1;box.querySelector('.mm').innerHTML=ok?`<div class="msg ok">🎉 बरोबर!</div>`:`<div class="msg no">✘ पुन्हा प्रयत्न करा.</div>`}

function genSwA(){const ky=$('ky').checked,sc=$('sch').value.trim();const R=rng(11);

  else if(b.t=='match')h+=`<table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${b.L.map((x,i)=>`<tr><td>${i+1}) ${x} &nbsp;&nbsp; ( ${ky?A(LET[b.A[i]]):'&nbsp;&nbsp;'} )</td><td>${b.R[i]!=null?LET[i]+') '+b.R[i]:''}</td></tr>`).join('')}</table>`;
  else if(b.t=='table')h+=`<table class="w"><tr>${b.head.map(x=>`<th>${x}</th>`).join('')}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c&&typeof c=='object'?(ky?A(c.a):'&nbsp;<br>&nbsp;'):(c==null?'':c)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if(b.t=='order'){const idx=shuf(b.items.map((x,i)=>i),R);h+=idx.map((j,i)=>`<div class="qb">${i+1}. ${b.items[j]}</div>`).join('')+(ky?A('योग्य क्रम : '+b.items.map((x,i)=>idx.indexOf(i)+1).join(' → ')):wl(2))}
  else if(b.t=='img')h+=b.items.map((it,i)=>`<div class="qb"><img src="${IM[it[0]]}" style="height:30mm;border-radius:2mm"> ${i+1}. ${it[2]||''} ${ky?A('→ '+it[1]):'<i class="ln" style="min-width:45mm"></i>'}</div>`).join('');
  else if(b.t=='concept')h+=`<div style="text-align:center"><b style="border:1.2px solid #000;padding:2px 10px">${b.center}</b><div style="display:flex;gap:8px;justify-content:center;margin-top:6px">${b.leaves.map(x=>`<span style="border:1.2px solid #000;padding:6px 12px;min-width:30mm">${ky?A(x):'&nbsp;'}</span>`).join('')}</div></div>`;
  else if(b.t=='text')h+=`<ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.t=='qb'||b.p)h+=''; });
 showPrev(h)}

let SB=401;
function sbData(seed){const R=rng(seed);const fb=shuf(FB,R).slice(0,6),mt=shuf(MT,R).slice(0,5),mtB=shuf(mt.map((x,i)=>[x[1],i]),R),tf=shuf(TF,R).slice(0,6),os=shuf(OS,R).slice(0,5),sa=shuf(SA,R).slice(0,3);return{fb,mt,mtB,tf,os,sa}}
function swB(b){b.innerHTML=`<div id="sbq"></div><div class="card" id="pdfp" style="display:none"><h2>🖨 अधिक स्वाध्याय – PDF</h2><div class="tool">${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;REGEN=()=>{genSwB()};renderSbq();genSwB()}
function newSb(){SB=1+Math.floor(Math.random()*99999);renderSbq();genSwB()}
function sbRev(id){$(id).classList.toggle('show')}
function sbTf(i,v,t,c,b){const ok=(v==t);b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('ok','no'));b.classList.add(ok?'ok':'no');$('tf'+i).innerHTML=ok?`<span class="msg ok">🎉 बरोबर! ${t?'हे विधान बरोबर आहे.':'हे विधान चूक आहे. बरोबर : '+c}</span>`:`<span class="msg no">✘ पुन्हा विचार करा.</span>`}
function sbMt(){const d=sbData(SB);let ok=0;d.mt.forEach((x,i)=>{const s=$('sm'+i),good=LET[d.mtB.findIndex(y=>y[1]==i)];const g=s.value===good;if(g)ok++;s.style.background=s.value?(g?'#dcfce7':'#fee2e2'):''});$('smm').innerHTML=ok==d.mt.length?'<div class="msg ok">🎉 सर्व जोड्या बरोबर!</div>':`<div class="msg in">${ok}/${d.mt.length} बरोबर. लाल रंगाच्या जोड्या बदला.</div>`}
function renderSbq(){const d=sbData(SB);let h=`<div class="card"><h2>✍️ अधिक स्वाध्याय · संच क्र. ${SB}</h2><button class="btn gr" onclick="newSb()">🎲 नवे प्रश्न</button></div>`;
 h+=`<div class="card"><h2>प्र.1 रिकाम्या जागा भरा.</h2>${d.fb.map((x,i)=>`<div class="qcard">${i+1}) ${x[0]}<br>${ansBtn('f'+i)}<div class="ans" id="f${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.2 जोड्या जुळवा.</h2><table class="t"><tr><th>‘अ’ गट</th><th>उत्तर</th></tr>${d.mt.map((x,i)=>`<tr><td style="text-align:left">${i+1}) ${x[0]}</td><td><select id="sm${i}"><option value="">–</option>${LET.concat(['इ']).slice(0,5).map(l=>`<option>${l}</option>`).join('')}</select></td></tr>`).join('')}</table><b>‘ब’ गट :</b><ul style="list-style:none;padding-left:4px">${d.mtB.map((y,j)=>`<li>${LET.concat(['इ'])[j]}) ${y[0]}</li>`).join('')}</ul><button class="btn gr" onclick="sbMt()">तपासा</button><div id="smm"></div></div>`;
 h+=`<div class="card"><h2>प्र.3 बरोबर की चूक?</h2>${d.tf.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<div><button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},1,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✔ बरोबर</button> <button class="opt" style="display:inline-block;width:auto" onclick="sbTf(${i},0,${x[1]},'${esc(x[2]).replace(/'/g,"\\'")}',this)">✘ चूक</button></div><div id="tf${i}"></div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.4 एका वाक्यात उत्तरे लिहा.</h2>${d.os.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('o4'+i)}<div class="ans" id="o4${i}">✔ ${x[1]}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h2>प्र.5 थोडक्यात उत्तरे लिहा.</h2>${d.sa.map((x,i)=>`<div class="qcard">${i+1}. ${x[0]}<br>${ansBtn('s5'+i)}<div class="ans" id="s5${i}">${x[1]}</div></div>`).join('')}</div>`;
 $('sbq').innerHTML=h}
function genSwB(){const seed=SB,ky=$('ky').checked,sc=$('sch').value.trim();const {fb,mt,mtB,tf,os,sa}=sbData(seed);
 let h=dHead('अधिक स्वाध्याय',30,sc)+`<div class="ds">संच क्र. ${seed}</div>`;
 h+=`<div class="qh">प्र.1 रिकाम्या जागा भरा. (6 गुण)</div>`+fb.map((x,i)=>`<div class="qb">${i+1}) ${x[0]}</div>`).join('');
 h+=`<div class="qh">प्र.2 जोड्या जुळवा. (5 गुण)</div><table class="w"><tr><th style="width:50%">‘अ’ गट</th><th>‘ब’ गट</th></tr>${mt.map((x,i)=>`<tr><td>${i+1}) ${x[0]} &nbsp;&nbsp; ( &nbsp;&nbsp; )</td><td>${LET.concat(['इ'])[i]}) ${mtB[i][0]}</td></tr>`).join('')}</table>`;
 h+=`<div class="qh">प्र.3 खालील विधाने बरोबर की चूक ते लिहा. चूक असल्यास दुरुस्त करून लिहा. (6 गुण)</div>`+tf.map((x,i)=>`<div class="qb">${i+1}. ${x[0]} <b>( &nbsp;&nbsp;&nbsp;&nbsp; )</b></div>`).join('');
 h+=`<div class="qh">प्र.4 एका वाक्यात उत्तरे लिहा. (5 गुण)</div>`+os.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(1)}</div>`).join('');
 h+=`<div class="qh">प्र.5 थोडक्यात उत्तरे लिहा. (8 गुण)</div>`+sa.map((x,i)=>`<div class="qb">${i+1}. ${x[0]}${wl(4)}</div>`).join('');
 if(ky){const mk=mt.map((x,i)=>`${i+1} → ${LET.concat(['इ'])[mtB.findIndex(y=>y[1]==i)]}`);
  h+=`<div class="qb key"><b>उत्तरसूची (शिक्षकांसाठी) – संच ${seed}</b><div class="qh">प्र.1</div>${fb.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.2</div><div>${mk.join(' &nbsp; ')}</div><div class="qh">प्र.3</div>${tf.map((x,i)=>`<div>${i+1}) ${x[1]?'बरोबर':'चूक – '+x[2]}</div>`).join('')}<div class="qh">प्र.4</div>${os.map((x,i)=>`<div>${i+1}) ${x[1]}</div>`).join('')}<div class="qh">प्र.5 (मार्गदर्शक मुद्दे)</div>${sa.map((x,i)=>`<div class="qb">${i+1}) <pre>${x[1]}</pre></div>`).join('')}</div>`}
 showPrev(h)}

/* ---------- 4. HOTS ---------- */
function vHots(m){m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><button class="back" style="margin:0" onclick="go('home')">← मुख्य पान</button><button class="btn bl" style="margin:0" onclick="togPdf()">📄 PDF तयार करा</button></div>
 <div class="card"><h2>🧠 उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न</h2><p>पाठाच्या आशयावर आधारित पण पाठ्यपुस्तकाबाहेरील प्रश्न. स्वतः उत्तर लिहून मग ‘मार्गदर्शक मुद्दे’ पाहा.</p>
 ${HOTS.map((x,i)=>`<div class="qcard"><span class="tag">${x[0]}</span><b>${i+1}. ${x[1]}</b><br>${ansBtn('hq'+i)}<div class="ans" id="hq${i}">💡 मार्गदर्शक मुद्दे:\n${x[2]}</div></div>`).join('')}</div>
 <div class="card" id="pdfp" style="display:none"><h2>🖨 HOTS प्रश्नपत्रिका (A4 PDF)</h2><div class="tool"><label>प्रश्न:</label><select id="hn" onchange="regen()"><option>4</option><option selected>6</option><option>8</option></select>${seedBox(501)}${schoolBox}${keyBox}${prBtn}</div>${prHelp}<div class="paper" id="prev"></div></div>`;
 REGEN=genHots;genHots()}
function genHots(){const seed=+$('seed').value||1,R=rng(seed),n=+$('hn').value,ky=$('ky').checked,sc=$('sch').value.trim();const qs=shuf(HOTS,R).slice(0,n);
 let h=dHead('उपयोजनात्मक / उच्चस्तरीय विचार प्रश्न',n*3,sc)+`<div class="ds">संच क्र. ${seed} · स्वतःच्या शब्दांत सविस्तर उत्तरे लिहा.</div>`;
 h+=qs.map((x,i)=>`<div class="qb"><div class="qh">प्र.${i+1} <small>[${x[0]}]</small> ${x[1]} (3 गुण)</div>${wl(6)}</div>`).join('');
 if(ky)h+=`<div class="qb key"><b>मार्गदर्शक मुद्दे (शिक्षकांसाठी) – संच ${seed}</b>${qs.map((x,i)=>`<div class="qb"><b>प्र.${i+1}</b><pre>${x[2]}</pre></div>`).join('')}</div>`;
 showPrev(h)}

/* ---------- boot ---------- */
document.title=L.name;$('hdr').textContent=L.name;
const h0=location.hash.replace('#','');if(['learn','mcq','sw','hots'].includes(h0))view=h0;
draw();
</script>
